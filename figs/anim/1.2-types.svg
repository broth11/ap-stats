nchor="middle">cat</text><text x="280.0" y="248.0" font-size="22" font-weight="700" fill="rgb(11,11,11)" text-anchor="middle" class="mono">10243</text><text x="392.0" y="248.0" font-size="22" font-weight="700" fill="rgb(11,11,11)" text-anchor="middle" class="mono">0</text><text x="506.0" y="248.0" font-size="22" font-weight="700" fill="rgb(11,11,11)" text-anchor="middle" class="mono">170.1</text><text x="78.0" y="288.0" font-size="22" font-weight="700" fill="rgb(11,11,11)" text-anchor="middle">C</text><text x="178.0" y="288.0" font-size="22" font-weight="700" fill="rgb(11,11,11)" text-anchor="middle">dog</text><text x="280.0" y="288.0" font-size="22" font-weight="700" fill="rgb(11,11,11)" text-anchor="middle" class="mono">10110</text><text x="392.0" y="288.0" font-size="22" font-weight="700" fill="rgb(11,11,11)" text-anchor="middle" class="mono">3</text><text x="506.0" y="288.0" font-size="22" font-weight="700" fill="rgb(11,11,11)" text-anchor="middle" class="mono">158.8</text><text x="78.0" y="328.0" font-size="22" font-weight="700" fill="rgb(11,11,11)" text-anchor="middle">D</text><text x="178.0" y="328.0" font-size="22" font-weight="700" fill="rgb(11,11,11)" text-anchor="middle">fish</text><text x="280.0" y="328.0" font-size="22" font-weight="700" fill="rgb(11,11,11)" text-anchor="middle" class="mono">10587</text><text x="392.0" y="328.0" font-size="22" font-weight="700" fill="rgb(11,11,11)" text-anchor="middle" class="mono">1</text><text x="506.0" y="328.0" font-size="22" font-weight="700" fill="rgb(11,11,11)" text-anchor="middle" class="mono">175.5</text><rect x="40.0" y="184.0" width="520.0" height="34.0" rx="8" fill="rgb(255,77,0)" stroke="none" stroke-width="2.5" opacity="0.000"/><rect x="40.0" y="184.0" width="520.0" height="34.0" rx="8" fill="none" stroke="rgb(255,77,0)" stroke-width="3" opacity="0.000"/><text x="300.0" y="394.0" font-size="22" font-weight="800" fill="rgb(206,64,2)" text-anchor="middle" opacity="0.000">Each row is an observational unit: one student</text><text x="300.0" y="430.0" font-size="20" font-weight="600" fill="rgb(84,84,84)" text-anchor="middle" opacity="0.000">Each column is a variable: a characteristic that changes from unit to unit</text><line x1="140.0" y1="356.0" x2="318.0" y2="356.0" stroke="rgb(75,92,255)" stroke-width="5" stroke-linecap="round"/><line x1="140.0" y1="348.0" x2="140.0" y2="356.0" stroke="rgb(75,92,255)" stroke-width="5" stroke-linecap="round"/><line x1="318.0" y1="348.0" x2="318.0" y2="356.0" stroke="rgb(75,92,255)" stroke-width="5" stroke-linecap="round"/><text x="229.0" y="386.0" font-size="22" font-weight="800" fill="rgb(75,92,255)" text-anchor="middle">categorical</text><line x1="348.0" y1="356.0" x2="562.0" y2="356.0" stroke="rgb(255,77,0)" stroke-width="5" stroke-linecap="round"/><line x1="348.0" y1="348.0" x2="348.0" y2="356.0" stroke="rgb(255,77,0)" stroke-width="5" stroke-linecap="round"/><line x1="562.0" y1="348.0" x2="562.0" y2="356.0" stroke="rgb(255,77,0)" stroke-width="5" stroke-linecap="round"/><text x="455.0" y="386.0" font-size="22" font-weight="800" fill="rgb(206,64,2)" text-anchor="middle">quantitative</text><text x="300.0" y="450.0" font-size="21" font-weight="700" fill="rgb(75,92,255)" text-anchor="middle" opacity="0.000">Categorical: category names or group labels</text><text x="300.0" y="450.0" font-size="21" font-weight="700" fill="rgb(206,64,2)" text-anchor="middle">Quantitative: a measured or counted quantity</text><text x="300.0" y="486.0" font-size="21" font-weight="800" fill="rgb(11,11,11)" text-anchor="middle">A zip code looks like a number, but it is a label</text><text x="392.0" y="420.0" font-size="21" font-weight="800" fill="rgb(40,129,57)" text-anchor="middle" opacity="0.000">discrete</text><text x="506.0" y="420.0" font-size="21" font-weight="800" fill="rgb(214,51,108)" text-anchor="middle" opacity="0.000">continuous</text><text x="300.0" y="462.0" font-size="21" font-weight="700" fill="rgb(40,129,57)" text-anchor="middle" opacity="0.000">Discrete: a countable number of values (0, 1, 2, ...)</text><text x="300.0" y="498.0" font-size="21" font-weight="700" fill="rgb(214,51,108)" text-anchor="middle" opacity="0.000">Continuous: any value in an interval, so it is measured</text><text x="588.0" y="592.0" font-size="14" font-weight="500" fill="rgb(84,84,84)" text-anchor="end">AP Stats 1.2</text></g></svg>