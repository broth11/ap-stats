<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><style>.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}</style><rect width="600" height="600" fill="@surface"/><g><text x="300.0" y="56.0" font-size="30" font-weight="700" fill="@ink" text-anchor="middle">Experimental design</text><text x="300.0" y="88.0" font-size="20" font-weight="500" fill="@muted" text-anchor="middle">Parts of an experiment and three designs</text><text x="300.0" y="150.0" font-size="24" font-weight="800" fill="@ink" text-anchor="middle">Random assignment of treatments</text><text x="300.0" y="190.0" font-size="24" font-weight="800" fill="@at" text-anchor="middle">allows a cause-and-effect conclusion</text><rect x="44.0" y="240.0" width="512.0" height="64.0" rx="12" fill="@surface" stroke="@ink" stroke-width="3"/><text x="64.0" y="268.0" font-size="22" font-weight="800" fill="@ink" text-anchor="start">Completely randomized</text><text x="64.0" y="294.0" font-size="20" font-weight="600" fill="@muted" text-anchor="start">assign all units at random</text><rect x="44.0" y="322.0" width="512.0" height="64.0" rx="12" fill="@surface" stroke="@ink" stroke-width="3"/><text x="64.0" y="350.0" font-size="22" font-weight="800" fill="@ink" text-anchor="start">Randomized block</text><text x="64.0" y="376.0" font-size="20" font-weight="600" fill="@muted" text-anchor="start">randomize within blocks</text><rect x="44.0" y="404.0" width="512.0" height="64.0" rx="12" fill="@surface" stroke="@ink" stroke-width="3"/><text x="64.0" y="432.0" font-size="22" font-weight="800" fill="@ink" text-anchor="start">Matched pairs</text><text x="64.0" y="458.0" font-size="20" font-weight="600" fill="@muted" text-anchor="start">randomize within each pair</text><text x="588.0" y="592.0" font-size="14" font-weight="500" fill="@muted" text-anchor="end">AP Stats 1.13</text></g></svg>