<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><style>.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}</style><rect width="600" height="600" fill="@surface"/><g><text x="300.0" y="56.0" font-size="30" font-weight="700" fill="@ink" text-anchor="middle">Bias in sampling</text><text x="300.0" y="88.0" font-size="20" font-weight="500" fill="@muted" text-anchor="middle">Repeated samples show bias</text><text x="300.0" y="132.0" font-size="24" font-weight="800" fill="@ink" text-anchor="middle">Sources of bias</text><rect x="44.0" y="160.0" width="512.0" height="66.0" rx="12" fill="@surface" stroke="@a" stroke-width="3"/><text x="64.0" y="188.0" font-size="22" font-weight="800" fill="@at" text-anchor="start">Voluntary response</text><text x="64.0" y="216.0" font-size="20" font-weight="600" fill="@ink" text-anchor="start">the sample is all volunteers</text><rect x="44.0" y="242.0" width="512.0" height="66.0" rx="12" fill="@surface" stroke="@a" stroke-width="3"/><text x="64.0" y="270.0" font-size="22" font-weight="800" fill="@at" text-anchor="start">Undercoverage</text><text x="64.0" y="298.0" font-size="20" font-weight="600" fill="@ink" text-anchor="start">part of the population is left out</text><rect x="44.0" y="324.0" width="512.0" height="66.0" rx="12" fill="@surface" stroke="@a" stroke-width="3"/><text x="64.0" y="352.0" font-size="22" font-weight="800" fill="@at" text-anchor="start">Nonresponse</text><text x="64.0" y="380.0" font-size="20" font-weight="600" fill="@ink" text-anchor="start">chosen people do not respond</text><rect x="44.0" y="406.0" width="512.0" height="66.0" rx="12" fill="@surface" stroke="@a" stroke-width="3"/><text x="64.0" y="434.0" font-size="22" font-weight="800" fill="@at" text-anchor="start">Response bias</text><text x="64.0" y="462.0" font-size="20" font-weight="600" fill="@ink" text-anchor="start">answers differ from the true value</text><text x="300.0" y="540.0" font-size="20" font-weight="700" fill="@muted" text-anchor="middle" opacity="0.148">Nonrandom methods (convenience, volunteers) risk bias</text><text x="588.0" y="592.0" font-size="14" font-weight="500" fill="@muted" text-anchor="end">AP Stats 1.12</text></g></svg>