<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><style>.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}</style><rect width="600" height="600" fill="@surface"/><g><text x="300.0" y="56.0" font-size="30" font-weight="700" fill="@ink" text-anchor="middle">Experimental design</text><text x="300.0" y="88.0" font-size="20" font-weight="500" fill="@muted" text-anchor="middle">Parts of an experiment and three designs</text><g transform="translate(0,0.0)" opacity="1.000"><text x="300.0" y="128.0" font-size="22" font-weight="800" fill="@ink" text-anchor="middle">A well-designed experiment has four parts</text><rect x="44.0" y="164.0" width="512.0" height="66.0" rx="12" fill="@surface" stroke="@b" stroke-width="3"/><text x="64.0" y="192.0" font-size="22" font-weight="800" fill="@bt" text-anchor="start">Comparison</text><text x="64.0" y="220.0" font-size="20" font-weight="600" fill="@ink" text-anchor="start">at least two treatment groups, one may be a control</text><rect x="44.0" y="246.0" width="512.0" height="66.0" rx="12" fill="@surface" stroke="@b" stroke-width="3"/><text x="64.0" y="274.0" font-size="22" font-weight="800" fill="@bt" text-anchor="start">Random assignment</text><text x="64.0" y="302.0" font-size="20" font-weight="600" fill="@ink" text-anchor="start">of treatments to the experimental units</text><rect x="44.0" y="328.0" width="512.0" height="66.0" rx="12" fill="@surface" stroke="@b" stroke-width="3"/><text x="64.0" y="356.0" font-size="22" font-weight="800" fill="@bt" text-anchor="start">Replication</text><text x="64.0" y="384.0" font-size="20" font-weight="600" fill="@ink" text-anchor="start">more than one unit assigned to each treatment</text><rect x="44.0" y="410.0" width="512.0" height="66.0" rx="12" fill="@surface" stroke="@b" stroke-width="3"/><text x="64.0" y="438.0" font-size="22" font-weight="800" fill="@bt" text-anchor="start">Direct control</text><text x="64.0" y="466.0" font-size="20" font-weight="600" fill="@ink" text-anchor="start">keep extraneous sources of variation the same</text></g><text x="588.0" y="592.0" font-size="14" font-weight="500" fill="@muted" text-anchor="end">AP Stats 1.13</text></g></svg>