<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><style>.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}</style><rect width="600" height="600" fill="#ffffff"/><g><text x="300.0" y="56.0" font-size="30" font-weight="700" fill="rgb(11,11,11)" text-anchor="middle">Question to conclusion</text><text x="300.0" y="88.0" font-size="20" font-weight="500" fill="rgb(84,84,84)" text-anchor="middle">Census, study type, what we can conclude</text><g transform="translate(0,0.0)" opacity="1.000"><rect x="30.0" y="160.0" width="260.0" height="200.0" rx="14" fill="rgb(255,255,255)" stroke="rgb(75,92,255)" stroke-width="3"/><text x="160.0" y="204.0" font-size="22" font-weight="800" fill="rgb(75,92,255)" text-anchor="middle">Observational study</text><text x="160.0" y="248.0" font-size="21" font-weight="700" fill="rgb(11,11,11)" text-anchor="middle">The researcher records</text><text x="160.0" y="280.0" font-size="21" font-weight="700" fill="rgb(11,11,11)" text-anchor="middle">values and does not</text><text x="160.0" y="312.0" font-size="21" font-weight="700" fill="rgb(11,11,11)" text-anchor="middle">impose treatments</text><rect x="310.0" y="160.0" width="260.0" height="200.0" rx="14" fill="rgb(255,255,255)" stroke="rgb(255,77,0)" stroke-width="3"/><text x="440.0" y="204.0" font-size="22" font-weight="800" fill="rgb(206,64,2)" text-anchor="middle">Experiment</text><text x="440.0" y="248.0" font-size="21" font-weight="700" fill="rgb(11,11,11)" text-anchor="middle">The researcher assigns</text><text x="440.0" y="280.0" font-size="21" font-weight="700" fill="rgb(11,11,11)" text-anchor="middle">treatments to the</text><text x="440.0" y="312.0" font-size="21" font-weight="700" fill="rgb(11,11,11)" text-anchor="middle">experimental units</text><text x="300.0" y="420.0" font-size="20" font-weight="600" fill="rgb(84,84,84)" text-anchor="middle">Explanatory variable: imposed.  Response variable: