<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><style>.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}</style><rect width="600" height="600" fill="#ffffff"/><g><text x="300.0" y="56.0" font-size="30" font-weight="700" fill="rgb(11,11,11)" text-anchor="middle">Counts to proportions</text><text x="300.0" y="88.0" font-size="20" font-weight="500" fill="rgb(84,84,84)" text-anchor="middle">Pets owned by 40 students</text><text x="96.0" y="160.0" font-size="21" font-weight="800" fill="rgb(11,11,11)" text-anchor="start">Pet</text><text x="250.0" y="160.0" font-size="21" font-weight="800" fill="rgb(11,11,11)" text-anchor="middle">Frequency</text><text x="372.0" y="160.0" font-size="21" font-weight="800" fill="rgb(75,92,255)" text-anchor="middle" opacity="0.000">Relative</text><text x="492.0" y="160.0" font-size="21" font-weight="800" fill="rgb(206,64,2)" text-anchor="middle" opacity="0.000">Percent</text><line x1="44.0" y1="174.0" x2="556.0" y2="174.0" stroke="rgb(11,11,11)" stroke-width="3" stroke-linecap="round"/><text x="96.0" y="216.0" font-size="23" font-weight="700" fill="rgb(11,11,11)" text-anchor="start">Dog</text><text x="250.0" y="216.0" font-size="24" font-weight="800" fill="rgb(11,11,11)" text-anchor="middle" class="mono">18</text><text x="372.0" y="216.0" font-size="24" font-weight="800" fill="rgb(75,92,255)" text-anchor="middle" class="mono" opacity="0.000">0.45</text><text x="492.0" y="216.0" font-size="24" font-weight="800" fill="rgb(206,64,2)" text-anchor="middle" class="mono" opacity="0.000">45%</text><text x="96.0" y="258.0" font-size="23" font-weight="700" fill="rgb(11,11,11)" text-anchor="start">Cat</text><text x="250.0" y="258.0" font-size="24" font-weight="800" fill="rgb(11,11,11)" text-anchor="middle" class="mono">12</text><text x="372.0" y="258.0" font-size="24" font-weight="800" fill="rgb(75,92,255)" text-anchor="middle" class="mono" opacity="0.000">0.30</text><text x="492.0" y="258.0" font-size="24" font-weight="800" fill="rgb(206,64,2)" text-anchor="middle" class="mono" opacity="0.000">30%</text><text x="96.0" y="300.0" font-size="23" font-weight="700" fill="rgb(11,11,11)" text-anchor="start">Fish</text><text x="250.0" y="300.0" font-size="24" font-weight="800" fill="rgb(11,11,11)" text-anchor="middle" class="mono">6</text><text x="372.0" y="300.0" font-size="24" font-weight="800" fill="rgb(75,92,255)" text-anchor="middle" class="mono" opacity="0.000">0.15</text><text x="492.0" y="300.0" font-size="24" font-weight="800" fill="rgb(206,64,2)" text-anchor="middle" class="mono" opacity="0.000">15%</text><text x="96.0" y="342.0" font-size="23" font-weight="700" fill="rgb(11,11,11)" text-anchor="start">Other</text><text x="250.0" y="342.0" font-size="24" font-weight="800" fill="rgb(11,11,11)" text-anchor="middle" class="mono">4</text><text x="372.0" y="342.0" font-size="24" font-weight="800" fill="rgb(75,92,255)" text-anchor="middle" class="mono" opacity="0.000">0.10</text><text x="492.0" y="342.0" font-size="24" font-weight="800" fill="rgb(206,64,2)" text-anchor="middle" class="mono" opacity="0.000">10%</text><line x1="44.0" y1="366.0" x2="556.0" y2="366.0" stroke="rgb(11,11,11)" stroke-width="2" stroke-linecap="round"/><text x="96.0" y="396.0" font-size="23" font-weight="800" fill="rgb(11,11,11)" text-anchor="start">Total</text><text x="250.0" y="396.0" font-size="24" font-weight="800" fill="rgb(11,11,11)" text-anchor="middle" class="mono">40</text><text x="372.0" y="396.0" font-size="24" font-weight="800" fill="rgb(75,92,255)" text-anchor="middle" class="mono" opacity="0.000">1.00</text><text x="492.0" y="396.0" font-size="24" font-weight="800" fill="rgb(206,64,2)" text-anchor="middle" class="mono" opacity="0.000">100%</text><text x="300.0" y="452.0" font-size="21" font-weight="700" fill="rgb(84,84,84)" text-anchor="middle" opacity="0.852">Frequency: the number of units in each category</text><text x="300.0" y="452.0" font-size="21" font-weight="800" fill="rgb(11,11,11)" text-anchor="middle" opacity="0.000">Relative frequency = frequency / total, e.g. 18 / 40</text><text x="300.0" y="452.0" font-size="21" font-weight="800" fill="rgb(11,11,11)" text-anchor="middle" opacity="0.000">Proportion, percent and ratio say the same thing</text><text x="300.0" y="490.0" font-size="24" font-weight="800" fill="rgb(206,64,2)" text-anchor="middle" opacity="0.000">0.45 = 45% = 45 out of 100 = 9 out of 20</text><rect x="44.0" y="189.0" width="512.0" height="38.0" rx="8" fill="rgb(255,77,0)" stroke="none" stroke-width="2.5" opacity="0.000"/><rect x="44.0" y="189.0" width="512.0" height="38.0" rx="8" fill="none" stroke="rgb(255,77,0)" stroke-width="3" opacity="0.000"/><text x="300.0" y="452.0" font-size="22" font-weight="800" fill="rgb(11,11,11)" text-anchor="middle" opacity="0.000">The mode is Dog: the most common category</text><text x="300.0" y="490.0" font-size="22" font-weight="800" fill="rgb(206,64,2)" text-anchor="middle" opacity="0.000">45% of the class has a dog as a pet</text><text x="300.0" y="528.0" font-size="20" font-weight="600" fill="rgb(84,84,84)" text-anchor="middle" opacity="0.000">Counts and relative frequencies can justify claims</text><text x="588.0" y="592.0" font-size="14" font-weight="500" fill="rgb(84,84,84)" text-anchor="end">AP Stats 1.3</text></g></svg>