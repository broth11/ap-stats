<!DOCTYPE html>
<html lang="en">
<head>

<title>1.8 Building a boxplot</title>
<style>
  html, body { margin: 0; background: var(--surface, #fff); }

  #card { width: min(100vw, 100vh, 640px); aspect-ratio: 1 / 1; cursor: pointer; }
  svg { width: 100%; height: 100%; display: block; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

</style>
</head>
<body>
<div id="card" title="Click to pause or play"><svg id="s" viewBox="0 0 600 600" role="img" aria-label="A boxplot built from the five-number summary of ten values, a fence at Q3 plus 1.5 IQR with an outlier beyond it, and three distributions showing that the mean is pulled toward the longer tail"></svg></div>

// Shared drawing + math kit. Embedded into every animation page via makeKit.toString().
