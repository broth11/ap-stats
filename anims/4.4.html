      K.T(300, 56, META.title, { size: 30, w: 700 }) + K.T(300, 88, META.sub, { size: 20, w: 500, fill: K.GRAY }) +
      scene.frame(t) +
      K.T(588, 592, "AP Stats " + META.id, { size: 14, w: 500, fill: "@muted", anchor: "end" }) + '</g>');
  }
  var tm = qs.match(/[?&]t=([0-9.]+)/);
  if (tm) { draw(parseFloat(tm[1])); return; }
  if (/still/.test(qs) || (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)) { draw(META.still); return; }
  // Playback state: clock = time on the animation timeline. speed can be changed at any moment.
  var clock = 0, last = null, playing = true, speed = 1;
  var sm = qs.match(/[?&]speed=([0-9.]+)/); if (sm) speed = parseFloat(sm[1]) || 1;
  function frame(now) {
    if (last !== null && playing) clock = (clock + (now - last) / 1000 * speed) % DUR;
    last = now; draw(clock); requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  // Hooks for a future control bar (or a parent page): window.anim.setSpeed(0.5), .pause(), .play(), .seek(3.2)
  window.anim = {
    time: function () { return clock; }, chapters: [{"id":"null","t":0.3,"rest":3},{"id":"left","t":3.2,"rest":4.9},{"id":"right","t":5.5,"rest":7.2},{"id":"two","t":7.8,"rest":9.5},{"id":"conditions","t":11.3,"rest":15},{"id":"pairs","t":16.8,"rest":21.9},{"id":"summary","t":23.5,"rest":27.7}],
    setSpeed: function (v) { speed = v; }, getSpeed: function () { return speed; },
    play: function () { playing = true; }, pause: function () { playing = false; },
    seek: function (v) { clock = ((v % DUR) + DUR) % DUR; }, duration: DUR
  };
  document.getElementById("card").addEventListener("click", function () { playing = !playing; });
})();
</script>
