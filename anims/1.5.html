<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1.5 Dotplot, histogram and stem-and-leaf plot</title>
<style>
  html, body { margin: 0; background: var(--surface, #fff); }
  /* add ?transparent to the URL (or iframe src) for a see-through background */
  html.transparent, html.transparent body { background: transparent; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  #card { width: min(100vw, 100vh, 640px); aspect-ratio: 1 / 1; cursor: pointer; }
  svg { width: 100%; height: 100%; display: block; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
</style>
</head>
<body>
<div id="card" title="Click to pause or play"><svg id="s" viewBox="0 0 600 600" role="img" aria-label="Twenty homework times shown as a dotplot, a histogram with bins of 10 minutes, a stem-and-leaf plot, and histograms with bin widths of 5, 10 and 20 minutes"></svg></div>
<script>
// Shared drawing + math kit. Embedded into every animation page via makeKit.toString().
function makeKit(TEX, REC) {
  /* animTheme(srcEl): semantic colors that follow the page theme. One source of truth, used in two places:
     - pasted inside makeKit() of every animation page (srcEl = window.frameElement, the <iframe> in the CED block), and
     - in the CED block's own script (srcEl = the .ced-anim element), so inline step images use the same colors.
  
     Page contract: the page defines six CSS custom properties on the iframe's ancestor (the .ced-anim block) -
       --anim-ink      text, outlines, curves
       --anim-surface  background the picture sits on
       --anim-a        first series / population            (site orange)
       --anim-b        second series / statistic            (site blue)
       --anim-pos      "good" outcome (reject, capture)
       --anim-neg      "bad" outcome  (fail to reject, miss)

     Everything else is derived, so a new theme needs only those six values:
       muted, line, dot, pale   mixes of ink and surface
       a, b, pos, neg           the token, darkened toward ink only if needed to reach 3:1 on the surface (graphics)
       at, bt, pt, nt           the same, darkened until 4.5:1 on the surface (text)  [WCAG AA]

    var NAMES = ["ink", "surface", "a", "b", "pos", "neg"], TEXT = { "@a": "@at", "@b": "@bt", "@pos": "@pt", "@neg": "@nt" };

  const hasMath = s => !/<[a-z]/i.test(s) && (MATHCH.test(s) || /(^|[\s(])[A-Za-z]\s*[=<>]\s*[-−\d(]/.test(s) || /^[A-Za-z]\s*=\s/.test(s) || /(^|\s)P\(/.test(s) || /(^|[\s(])[pnxyzrkXYt]($|[\s,.;:)])/.test(s) || /(^|\s)[A-Za-z]\*/.test(s) || /(^|\s)\d[\d.]*[A-Za-z]($|[\s,.;:)])/.test(s));

  const isNum = t => /^[-−+]?[\d][\d.,%/]*$/.test(t);
  const mathTok = t => MATHCH.test(t) || /^[A-Za-z]$/.test(t) && !/^[aAI]$/.test(t) || /^[A-Za-z]\(/.test(t) || /^[A-Za-z]\*$/.test(t) || /^\d[\d.]*[A-Za-z]$/.test(t) || /^[A-Za-z]\d$/.test(t) || isOp(t);

    let u = m;
    for (let i = u.indexOf("√"); i >= 0; i = u.indexOf("√", i + 1)) {   // sqrt with a bracket group or a plain atom

      if (u[j] === "(") { let d = 0, k = j; for (; k < u.length; k++) { if (u[k] === "(") d++; if (u[k] === ")" && --d === 0) break; } inner = u.slice(j + 1, k); u = u.slice(0, i) + "\\sqrt{" + inner + "}" + u.slice(k + 1); }

  const M = (x, y, tex, o = {}) => {

  };
