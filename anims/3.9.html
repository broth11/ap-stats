  // Hooks for a future control bar (or a parent page): window.anim.setSpeed(0.5), .pause(), .play(), .seek(3.2)
  window.anim = {
    time: function () { return clock; }, chapters: [{"id":"center","t":0.3,"rest":3.2},{"id":"size","t":3.8,"rest":8.2},{"id":"conditions","t":9,"rest":12.8},{"id":"summary","t":13.6,"rest":17.6}],
    setSpeed: function (v) { speed = v; }, getSpeed: function () { return speed; },
    play: function () { playing = true; }, pause: function () { playing = false; },
    seek: function (v) { clock = ((v % DUR) + DUR) % DUR; }, duration: DUR
  };
  document.getElementById("card").addEventListener("click", function () { playing = !playing; });
})();
</script>
