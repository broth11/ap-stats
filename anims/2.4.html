<div id="card" title="Click to pause or play"><svg id="s" viewBox="0 0 600 600" role="img" aria-label="The 36 equally likely outcomes of two dice, the event that the sum is 7, its complement, the range of probabilities from 0 for an impossible event to 1 for a certain event, and the rules together"></svg></div>

// Shared drawing + math kit. Embedded into every animation page via makeKit.toString().
