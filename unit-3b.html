<script id="data" type="application/json">{"unit": 3, "teacher": false, "extra": null, "ced": "ced-3.html", "title": "Inference for Categorical Data: Proportions", "overview": "Builds inference for one proportion, then two proportions, then chi-square tests: estimators and sampling distributions, confidence intervals, significance tests, p-values, errors, and the chi-square family.", "parts": [{"code": "3B", "title": "Inference for Multiple Proportions"}], "lessons": [{"id": "L9", "n": 9, "ln": 1, "code": "3.B.1", "part": "3B", "partTitle": "Inference for Multiple Proportions", "title": "Sampling Distribution for Two Proportions", "summary": "Comparing two groups means working with the difference of two sample proportions. You tell one sample from two, describe the sampling distribution of the difference, and check conditions for both groups. The activity analyzes unemployment among computer science graduates to ask whether AI will take jobs.", "standards": [{"code": "CED 3.9", "text": "Sampling distributions for the difference between sample proportions", "ek": [{"code": "3.9.A", "text": "Calculate the mean and standard deviation of the sampling distribution for the difference between two sample proportions. [Skill 3.D]", "eks": [{"code": "3.9.A.1", "text": "For two independent populations, with population proportions $p_1$ and $p_2$, when the sampled values are independent, the sampling distribution for the difference in sample proportions, $\\hat{p}_1-\\hat{p}_2$, has a mean, $\\mu_{\\hat{p}_1-\\hat{p}_2}=p_1-p_2$, and standard deviation, $\\sigma_{\\hat{p}_1-\\hat{p}_2}=\\sqrt{\\dfrac{p_1(1-p_1)}{n_1}+\\dfrac{p_2(1-p_2)}{n_2}}$."}]}, {"code": "3.9.B", "text": "Justify the appropriateness of conditions for the sampling distribution for the difference between two sample proportions. [Skill 4.E]", "eks": [{"code": "3.9.B.1", "text": "When sampling without replacement, two conditions must be met:\n3.9.B.1.i The randomization condition—the data should be collected using two independent random samples.\n3.9.B.1.ii The 10% condition—the size of each sample should be less than or equal to 10% of the respective population size: $n_1\\le 10\\%N_1$ and $n_2\\le 10\\%N_2$, where $N_1$ is the size of population 1 and $N_2$ is the size of population 2. The sample sizes are represented as $n_1$ and $n_2$."}, {"code": "3.9.B.2", "text": "If the data come from an experiment, the data only need to meet the randomization condition. The treatments must be randomly assigned to the experimental units to meet the randomization condition."}, {"code": "3.9.B.3", "text": "The sampling distribution for the difference between sample proportions, $\\hat{p}_1-\\hat{p}_2$, will have an approximately normal distribution provided both sample sizes are large enough. To ensure that both sample sizes are large enough, the data must meet the following conditions: $n_1p_1\\ge 10$, $n_1(1-p_1)\\ge 10$, $n_2p_2\\ge 10$, and $n_2(1-p_2)\\ge 10$, where $n_1p_1$ and $n_2p_2$ are the expected number of successes and $n_1(1-p_1)$ and $n_2(1-p_2)$ are the expected number of failures."}]}, {"code": "3.9.C", "text": "Interpret the mean, standard deviation, and probabilities for the sampling distribution for the difference between two sample proportions. [Skill 4.D]", "eks": [{"code": "3.9.C.1", "text": "The mean, standard deviation, and probabilities for the sampling distribution for the difference between two sample proportions should be interpreted within the context of two specific populations."}]}]}], "skills": ["Describe the sampling distribution of the difference of two sample proportions.", "Check conditions for two independent samples."], "understandings": ["The mean of p1-hat minus p2-hat is p1 minus p2 and the variances add.", "Independent samples are needed for the variance rule."], "misconceptions": ["Subtracting standard deviations instead of adding variances.", "Treating paired data as two independent samples."], "processes": ["Compute the mean and standard deviation of the difference, check large counts for both groups."], "exam": ["Verify conditions for each group separately."], "qr": "https://broth11.github.io/ap-stats/unit-3b.html#L9", "files": {"F": [{"l": "3.B.1.APStats.Handout", "h": "https://drive.google.com/file/d/1DXn1fsYKS5Ig3NmBw7byaezBAv-7_PKP/view", "k": "page", "x": ""}, {"l": "3.B.1.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/16EyR-emtWZjNhJk6xLXBkFBl1K_YexkU/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=CHDxRp0cuiM", "k": "video", "x": ""}, {"l": "Supplemental video", "h": "https://www.youtube.com/watch?v=vXtiHmv2IbU", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 3.9", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=39", "k": "brain", "x": ""}, {"l": "Practice Library 3.B.1", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=3-b&question=u3b01", "k": "brain", "x": ""}]}}, {"id": "L10", "n": 10, "ln": 2, "code": "3.B.2", "part": "3B", "partTitle": "Inference for Multiple Proportions", "title": "Interval for Two Proportions", "summary": "A two-sample z-interval estimates the difference between two population proportions. You check conditions, calculate and interpret the interval, and decide whether zero is plausible. The activity analyzes an experiment that sent identical resumes with different names to employers and compares callback rates.", "standards": [{"code": "CED 3.10", "text": "Constructing a confidence interval for the difference between two population proportions", "ek": [{"code": "3.10.A", "text": "Identify an appropriate confidence interval procedure including the parameters for the difference between two population proportions. [Skill 2.C]", "eks": [{"code": "3.10.A.1", "text": "Based on the sample data, a confidence interval can be calculated to estimate the difference between two population proportions. The appropriate confidence interval procedure is a two-sample z-interval for a difference between population proportions."}, {"code": "3.10.A.2", "text": "The parameters of a confidence interval for the difference between two population proportions should refer to the difference in the proportions, the response variable, and the populations in context."}]}, {"code": "3.10.B", "text": "Justify the appropriateness of constructing a confidence interval for the difference between two population proportions by verifying conditions. [Skill 4.E]", "eks": [{"code": "3.10.B.1", "text": "A two-sample $z$-interval for a difference between two population proportions requires that three conditions be met:\n3.10.B.1.i The randomization condition—the data should be collected using two independent random samples or a randomized experiment.\n3.10.B.1.ii The 10% condition—when sampling without replacement, the size of each sample should be less than or equal to 10% of the respective population size: $n_1\\le 10\\%N_1$ and $n_2\\le 10\\%N_2$, where $N_1$ is the size of population 1 and $N_2$ is the size of population 2. The sample sizes are represented as $n_1$ and $n_2$. (Note: This condition is unnecessary when the data are from a randomized experiment.)\n3.10.B.1.iii The normality condition—the number of observed successes, $n_1\\hat{p}_1$ and $n_2\\hat{p}_2$, and number of observed failures, $n_1(1-\\hat{p}_1)$ and $n_2(1-\\hat{p}_2)$, for both samples are all at least 10."}]}, {"code": "3.10.C", "text": "Calculate an appropriate confidence interval for the difference between two population proportions. [Skill 3.E]", "eks": [{"code": "3.10.C.1", "text": "The point estimate for the difference between two population proportions is $\\hat{p}_1-\\hat{p}_2$."}, {"code": "3.10.C.2", "text": "For the difference between two population proportions, the interval estimate can be constructed as point estimate $\\pm$ (margin of error). The interval estimate for the difference between two population proportions is $(\\hat{p}_1-\\hat{p}_2)\\pm z^{*}\\sqrt{\\dfrac{\\hat{p}_1(1-\\hat{p}_1)}{n_1}+\\dfrac{\\hat{p}_2(1-\\hat{p}_2)}{n_2}}$."}]}, {"code": "3.10.D", "text": "Calculate the standard error and margin of error for estimating the difference between two population proportions. [Skill 3.E]", "eks": [{"code": "3.10.D.1", "text": "The standard error ($SE$) for the difference between two population proportions is $SE_{\\hat{p}_1-\\hat{p}_2}=\\sqrt{\\dfrac{\\hat{p}_1(1-\\hat{p}_1)}{n_1}+\\dfrac{\\hat{p}_2(1-\\hat{p}_2)}{n_2}}$."}, {"code": "3.10.D.2", "text": "For the difference between two population proportions, the margin of error is the critical value ($z^{*}$) times the standard error ($SE$) of the difference between the two proportions, which equals $z^{*}\\sqrt{\\dfrac{\\hat{p}_1(1-\\hat{p}_1)}{n_1}+\\dfrac{\\hat{p}_2(1-\\hat{p}_2)}{n_2}}$."}]}]}, {"code": "CED 3.11", "text": "Justifying a claim based on a confidence interval for the difference between two population proportions", "ek": [{"code": "3.11.A", "text": "Interpret a confidence interval in context for the difference between two population proportions. [Skill 4.F]", "eks": [{"code": "3.11.A.1", "text": "Because the confidence interval for the difference between two population proportions is calculated based on samples from two populations, the computed interval may or may not contain the value for the difference between those two population proportions."}, {"code": "3.11.A.2", "text": "The interpretation of the confidence level is as follows: In repeated random sampling with the same sample sizes from the same populations, approximately C% of confidence intervals created will capture the difference between the two population proportions, where C represents the numerical value of the confidence level used."}, {"code": "3.11.A.3", "text": "When interpreting a C% confidence interval for the difference between two population proportions, we say we are C% confident that the interval a, b contains the parameter for the difference between the populations, where a represents the lower limit and b represents the upper limit. An interpretation of a confidence interval for the difference between two population proportions includes a reference to the parameter with the details about the populations it represents in the context of the study."}]}, {"code": "3.11.B", "text": "Justify a claim based on a confidence interval for the difference between two population proportions. [Skill 4.G]", "eks": [{"code": "3.11.B.1", "text": "A confidence interval for the difference between two population proportions provides an interval of values that may provide convincing evidence to support a particular claim about the difference between the two population proportions. For example, if the interval contains 0, then there is insufficient evidence to conclude there is a difference between the two population proportions. If the interval does not contain 0, there is sufficient evidence to conclude there is a difference between the two population proportions."}]}]}], "skills": ["Construct and interpret a two-sample z interval.", "Decide whether zero is a plausible difference."], "understandings": ["An interval containing 0 means no difference is plausible.", "The sign of the interval shows which group is higher."], "misconceptions": ["Interpreting the interval as a statement about samples, not populations.", "Ignoring the direction of subtraction."], "processes": ["Define p1 and p2, check conditions, use 2-PropZInt, interpret the difference."], "exam": ["Interpret the difference p1 minus p2 in context and state which is larger when the interval excludes 0."], "qr": "https://broth11.github.io/ap-stats/unit-3b.html#L10", "files": {"F": [{"l": "3.B.2.APStats.Handout", "h": "https://drive.google.com/file/d/1Sx1oP7sFMS105rI__b0m_RCoojPFdi9m/view", "k": "page", "x": ""}, {"l": "3.B.2.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1SChaQ2n6kgRAtm2sFYkot7BMmsUndrlS/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=miJyEZ5mPDw", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 3.10 & 3.11", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=40", "k": "brain", "x": ""}, {"l": "Practice Library 3.B.2", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=3-b&question=u3b11", "k": "brain", "x": ""}]}}, {"id": "L11", "n": 11, "ln": 3, "code": "3.B.3", "part": "3B", "partTitle": "Inference for Multiple Proportions", "title": "Hypothesis Test for Two Proportions", "summary": "A two-sample z-test checks whether two population proportions differ, using a pooled proportion for the test statistic. You state hypotheses, check conditions, calculate the p-value and conclude. The activity returns to the resume experiment and tests whether the callback gap is more than chance.", "standards": [{"code": "CED 3.12", "text": "Setting up a test for the difference between two population proportions", "ek": [{"code": "3.12.A", "text": "Identify an appropriate testing method for the difference between population proportions including the parameters. [Skill 2.C]", "eks": [{"code": "3.12.A.1", "text": "The appropriate testing method for the difference between two population proportions is a two-sample z-test for the difference between two population proportions."}, {"code": "3.12.A.2", "text": "The parameters for a hypothesis test for the difference between two population proportions should reference the population parameters, the response variables, and the populations in context."}]}, {"code": "3.12.B", "text": "Identify the null and alternative hypotheses for the difference between population proportions. [Skill 2.E]", "eks": [{"code": "3.12.B.1", "text": "For a two-sample $z$-test for the difference between two population proportions, the null hypothesis indicates no difference. The null hypothesis for the difference between two population proportions can be written as either $H_0: p_1=p_2$ or $H_0: p_1-p_2=0$. A one-sided alternative hypothesis for the difference between two population proportions can be written as either $H_a: p_1<p_2$ or equivalently $H_a: p_1-p_2<0$, or $H_a: p_1>p_2$ or equivalently $H_a: p_1-p_2>0$. A two-sided alternative hypothesis for the difference between two population proportions can be written as either $H_a: p_1\\ne p_2$ or equivalently $H_a: p_1-p_2\\ne 0$."}]}, {"code": "3.12.C", "text": "Justify the appropriateness of a hypothesis test for the difference between two population proportions by verifying conditions. [Skill 4.E]", "eks": [{"code": "3.12.C.1", "text": "A two-sample $z$-test for a difference between two population proportions requires that three conditions be met:\n3.12.C.1.i The randomization condition—the data should be collected using two independent random samples or a randomized experiment.\n3.12.C.1.ii The 10% condition—when sampling without replacement, the size of each sample should be less than or equal to 10% of the respective population size: $n_1\\le 10\\%N_1$ and $n_2\\le 10\\%N_2$, where $N_1$ is the size of population 1 and $N_2$ is the size of population 2. The sample sizes are represented as $n_1$ and $n_2$. (Note: This condition is unnecessary when the data are from a randomized experiment.)\n3.12.C.1.iii The normality condition—$n_1\\hat{p}_c$, $n_1(1-\\hat{p}_c)$, $n_2\\hat{p}_c$, and $n_2(1-\\hat{p}_c)$ must all be at least 10, with $\\hat{p}_c=\\dfrac{n_1\\hat{p}_1+n_2\\hat{p}_2}{n_1+n_2}$ being the combined (or pooled) proportion assuming that $H_0$ is true ($H_0: p_1=p_2$ or $H_0: p_1-p_2=0$)."}]}]}, {"code": "CED 3.13", "text": "Carrying out a test for the difference between two population proportions", "ek": [{"code": "3.13.A", "text": "Calculate an appropriate test statistic and p-value for testing a hypothesis for the difference between two population proportions. [Skill 3.E]", "eks": [{"code": "3.13.A.1", "text": "The test statistic for the difference between two population proportions is $z=\\dfrac{(\\hat{p}_1-\\hat{p}_2)-0}{\\sqrt{\\hat{p}_c(1-\\hat{p}_c)}\\sqrt{\\dfrac{1}{n_1}+\\dfrac{1}{n_2}}}$, where $\\hat{p}_c=\\dfrac{n_1\\hat{p}_1+n_2\\hat{p}_2}{n_1+n_2}$ is the proportion of successes for the two groups combined. The $z$-statistic has a standard normal distribution when the null hypothesis is true."}, {"code": "3.13.A.2", "text": "The p-value for a two-sample z-test for the difference between two population proportions can be found from the standard normal distribution using a table or technology."}]}, {"code": "3.13.B", "text": "Interpret the p-value of a hypothesis test for the difference between two population proportions. [Skill 4.F]", "eks": [{"code": "3.13.B.1", "text": "The p-value is the probability of obtaining a test statistic as extreme or more extreme than the test statistic that was observed (i.e., in the direction of the alternative hypothesis) given that the null hypothesis is true. An interpretation of the p-value of a hypothesis test for a difference between two population proportions should include a statement that the p-value is computed assuming the null hypothesis is true (i.e., by assuming that the true population proportions are equal to each other in context)."}]}, {"code": "3.13.C", "text": "Justify a claim about the populations based on the results of a hypothesis test for the difference between two population proportions. [Skill 4.G]", "eks": [{"code": "3.13.C.1", "text": "A formal decision in a hypothesis test for the difference between two population proportions explicitly compares the $p$-value to the significance level, $\\alpha$. If the $p$-value $\\le\\alpha$, then reject the null hypothesis, $H_0: p_1=p_2$ or $H_0: p_1-p_2=0$. If the $p$-value $>\\alpha$, then fail to reject the null hypothesis."}, {"code": "3.13.C.2", "text": "The results of a hypothesis test for the difference between two population proportions can serve as the statistical reasoning to support the answer to an investigative question about the two populations that were sampled."}, {"code": "3.13.C.3", "text": "A conclusion for the hypothesis test for the difference between two population proportions is stated in context consistent with, and in terms of, the alternative hypothesis using non-definitive language. The conclusion should contain a reference to the parameters and the populations."}]}]}], "skills": ["State hypotheses and carry out a two-sample z test.", "Use the pooled proportion for the test statistic."], "understandings": ["The test pools because the null says the proportions are equal.", "A significant result supports a difference in the populations."], "misconceptions": ["Using unpooled standard error in a test.", "Concluding causation from observational data."], "processes": ["State, plan, check conditions, compute with 2-PropZTest, conclude."], "exam": ["Causal language is only allowed for randomized experiments."], "qr": "https://broth11.github.io/ap-stats/unit-3b.html#L11", "files": {"F": [{"l": "3.B.3.APStats.Handout", "h": "https://drive.google.com/file/d/1HVltpC7NUGCM4Pi8OpILhxGni4giv3pK/view", "k": "page", "x": ""}, {"l": "3.B.3.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1bKRjOzgKy7PTiXS7WCHWXceMpgeL92iW/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=9WfSI600Vs0", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 3.12 & 3.13", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=41", "k": "brain", "x": ""}, {"l": "Practice Library 3.B.3", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=3-b&question=u3b21", "k": "brain", "x": ""}]}}, {"id": "L12", "n": 12, "ln": 4, "code": "3.B.4", "part": "3B", "partTitle": "Inference for Multiple Proportions", "title": "Chi-Square Test for Homogeneity", "summary": "The chi-square test for homogeneity checks whether a categorical variable has the same distribution in several groups. You calculate expected counts and the chi-square statistic, then conclude. The activity asks whether underperforming large schools should be broken into smaller ones.", "standards": [{"code": "CED 3.14", "text": "Setting up a chi-square test for homogeneity or independence", "ek": [{"code": "3.14.A", "text": "Describe chi-square distributions. [Skill 4.C]", "eks": [{"code": "3.14.A.1", "text": "The chi-square statistic measures the distance between observed and expected counts relative to expected counts."}, {"code": "3.14.A.2", "text": "Chi-square distributions have positive values and are skewed right. Within this family of density curves, the skew becomes less pronounced with increasing degrees of freedom."}]}, {"code": "3.14.B", "text": "Identify an appropriate testing method for comparing distributions in two-way tables of categorical data including the populations and variables. [Skill 2.C]", "eks": [{"code": "3.14.B.1", "text": "To determine whether the distributions of a categorical variable for two or more populations are different, the appropriate test is the chi-square test for homogeneity."}, {"code": "3.14.B.2", "text": "A chi-square test for homogeneity should reference the categorical variable and the populations in context."}, {"code": "3.14.B.3", "text": "To determine whether row and column variables in a two-way table of categorical data might be associated in the single population from which the data were sampled, the appropriate test is the chi-square test for independence."}, {"code": "3.14.B.4", "text": "A chi-square test for independence should reference the categorical variables and the population in context."}]}, {"code": "3.14.C", "text": "Identify the null and alternative hypotheses for a chi-square test for homogeneity or independence. [Skill 2.E]", "eks": [{"code": "3.14.C.1", "text": "The appropriate null hypothesis for a chi-square test for homogeneity is $H_0$: there is no difference in the distributions of the categorical variable across populations or treatments. The appropriate alternative hypothesis for a chi-square test for homogeneity is $H_a$: there is a difference in the distributions of the categorical variable across populations or treatments."}, {"code": "3.14.C.2", "text": "The appropriate null hypothesis for a chi-square test for independence is $H_0$: there is no association between two categorical variables in a given population or the two categorical variables in a given population are independent of each other. The appropriate alternative hypothesis for a chi-square test for independence is $H_a$: there is an association between two categorical variables in a given population or the two categorical variables in a given population are not independent of each other."}]}, {"code": "3.14.D", "text": "Justify the appropriateness of a chi-square test for independence or homogeneity by verifying conditions. [Skill 4.E]", "eks": [{"code": "3.14.D.1", "text": "A chi-square test for homogeneity or independence requires that three conditions must be met:\n3.14.D.1.i The randomization condition—the test of independence states that the data should be collected using a random sample. The test for homogeneity states that the data should be collected using independent random samples or a randomized experiment.\n3.14.D.1.ii The 10% condition—when sampling without replacement, check that $n\\le 10\\%N$, where $N$ is the size of the population and $n$ is the sample size. (Note: This condition is unnecessary when the data are from a randomized experiment.)\n3.14.D.1.iii The expected counts condition—all expected counts should be greater than 5."}]}]}, {"code": "CED 3.15", "text": "Carrying out a chi-square test for homogeneity or independence", "ek": [{"code": "3.15.A", "text": "Calculate expected counts for two-way tables of categorical data. [Skill 3.C]", "eks": [{"code": "3.15.A.1", "text": "The expected counts (under the null hypothesis) in a particular cell of a two-way table of categorical data can be calculated using the formula $\\text{expected count}=\\dfrac{(\\text{row total})(\\text{column total})}{\\text{total table}}$."}]}, {"code": "3.15.B", "text": "Calculate the appropriate test statistic and p-value for a chi- square test for homogeneity or independence. [Skill 3.E]", "eks": [{"code": "3.15.B.1", "text": "The appropriate test statistic for a chi-square test for homogeneity or independence is the chi-square statistic $\\chi^{2}=\\sum\\dfrac{(\\text{Observed Count}-\\text{Expected Count})^{2}}{\\text{Expected Count}}$, where the sum is taken over all cells of the two-way table. The chi-square statistics have a chi-square distribution with degrees of freedom equal to $(\\text{number of rows}-1)\\cdot(\\text{number of columns}-1)$ when the null hypothesis is true."}, {"code": "3.15.B.2", "text": "The p-value for a chi-square test for independence or homogeneity is found from a chi-square distribution using a table or technology."}]}, {"code": "3.15.C", "text": "Interpret the p-value for the chi-square test for homogeneity or independence. [Skill 4.F]", "eks": [{"code": "3.15.C.1", "text": "The p-value is the probability of obtaining a test statistic as extreme or more extreme than the test statistic that was observed (i.e., in the direction of the alternative hypothesis) given that the null hypothesis is true. An interpretation of the p-value for the chi-square test for homogeneity or independence should include a statement that the p-value is computed by assuming the null hypothesis is true in context."}]}, {"code": "3.15.D", "text": "Justify a claim about the population(s) based on the results of a chi-square test for homogeneity or independence. [Skill 4.G]", "eks": [{"code": "3.15.D.1", "text": "A formal decision in a hypothesis test explicitly compares the $p$-value to the significance level, $\\alpha$. If the $p$-value $\\le\\alpha$, then reject the null hypothesis for the appropriate chi-square test. If the $p$-value $>\\alpha$, then fail to reject the null hypothesis."}, {"code": "3.15.D.2", "text": "The results of a chi-square test for homogeneity or independence can serve as the statistical reasoning to support the answer to an investigative question about the population that was sampled (independence) or the populations that were sampled (homogeneity)."}, {"code": "3.15.D.3", "text": "A conclusion for a chi-square test for homogeneity or independence is stated in context consistent with, and in terms of, the alternative hypothesis using non-definitive language. The conclusion should contain a reference to the population(s)."}]}]}], "skills": ["Set up and carry out a chi-square test for homogeneity.", "Compute expected counts and check the conditions."], "understandings": ["Homogeneity compares the distribution of one categorical variable across several populations or treatments.", "A large chi-square statistic means observed counts differ from expected counts.", "Expected counts must be at least 5."], "misconceptions": ["Choosing independence when the data came from separate samples of each group.", "Stating hypotheses about means or proportions instead of the distribution.", "Using percentages in place of counts."], "processes": ["State H0 (same distribution in every group), enter counts in a matrix, run the chi-square test, check expected counts, read the statistic, df and p-value, conclude."], "exam": ["Name the test, the statistic, the degrees of freedom and the p-value, then conclude in context."], "qr": "https://broth11.github.io/ap-stats/unit-3b.html#L12", "files": {"F": [{"l": "3.B.4.APStats.Handout", "h": "https://drive.google.com/file/d/1jDM34-3yaeyJk_-GkPrE0iQ3Zau68Zzi/view", "k": "page", "x": ""}, {"l": "3.B.4.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1Dez92R5c83Yfwys4huiljhEBJvTe5Ep4/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=06m8hKYeGWw", "k": "video", "x": ""}, {"l": "Supplemental video (chi-square p-value)", "h": "https://www.youtube.com/watch?v=nGD_fuKR-Q8", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 3.14", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=42", "k": "brain", "x": ""}, {"l": "Stats Hub 3.15", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=43", "k": "brain", "x": ""}, {"l": "Practice Library 3.B.4", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=3-b&question=u3b31", "k": "brain", "x": ""}]}}, {"id": "L13", "n": 13, "ln": 5, "code": "3.B.5", "part": "3B", "partTitle": "Inference for Multiple Proportions", "title": "Chi-Square Test for Independence", "summary": "The chi-square test for independence checks whether two categorical variables are associated in one population. You check conditions, find degrees of freedom and the p-value, and conclude. The activity uses New York stop and frisk data to ask whether police use of force is associated with race.", "standards": [{"code": "CED 3.14", "text": "Setting up a chi-square test for homogeneity or independence", "ek": [{"code": "3.14.A", "text": "Describe chi-square distributions. [Skill 4.C]", "eks": [{"code": "3.14.A.1", "text": "The chi-square statistic measures the distance between observed and expected counts relative to expected counts."}, {"code": "3.14.A.2", "text": "Chi-square distributions have positive values and are skewed right. Within this family of density curves, the skew becomes less pronounced with increasing degrees of freedom."}]}, {"code": "3.14.B", "text": "Identify an appropriate testing method for comparing distributions in two-way tables of categorical data including the populations and variables. [Skill 2.C]", "eks": [{"code": "3.14.B.1", "text": "To determine whether the distributions of a categorical variable for two or more populations are different, the appropriate test is the chi-square test for homogeneity."}, {"code": "3.14.B.2", "text": "A chi-square test for homogeneity should reference the categorical variable and the populations in context."}, {"code": "3.14.B.3", "text": "To determine whether row and column variables in a two-way table of categorical data might be associated in the single population from which the data were sampled, the appropriate test is the chi-square test for independence."}, {"code": "3.14.B.4", "text": "A chi-square test for independence should reference the categorical variables and the population in context."}]}, {"code": "3.14.C", "text": "Identify the null and alternative hypotheses for a chi-square test for homogeneity or independence. [Skill 2.E]", "eks": [{"code": "3.14.C.1", "text": "The appropriate null hypothesis for a chi-square test for homogeneity is $H_0$: there is no difference in the distributions of the categorical variable across populations or treatments. The appropriate alternative hypothesis for a chi-square test for homogeneity is $H_a$: there is a difference in the distributions of the categorical variable across populations or treatments."}, {"code": "3.14.C.2", "text": "The appropriate null hypothesis for a chi-square test for independence is $H_0$: there is no association between two categorical variables in a given population or the two categorical variables in a given population are independent of each other. The appropriate alternative hypothesis for a chi-square test for independence is $H_a$: there is an association between two categorical variables in a given population or the two categorical variables in a given population are not independent of each other."}]}, {"code": "3.14.D", "text": "Justify the appropriateness of a chi-square test for independence or homogeneity by verifying conditions. [Skill 4.E]", "eks": [{"code": "3.14.D.1", "text": "A chi-square test for homogeneity or independence requires that three conditions must be met:\n3.14.D.1.i The randomization condition—the test of independence states that the data should be collected using a random sample. The test for homogeneity states that the data should be collected using independent random samples or a randomized experiment.\n3.14.D.1.ii The 10% condition—when sampling without replacement, check that $n\\le 10\\%N$, where $N$ is the size of the population and $n$ is the sample size. (Note: This condition is unnecessary when the data are from a randomized experiment.)\n3.14.D.1.iii The expected counts condition—all expected counts should be greater than 5."}]}]}, {"code": "CED 3.15", "text": "Carrying out a chi-square test for homogeneity or independence", "ek": [{"code": "3.15.A", "text": "Calculate expected counts for two-way tables of categorical data. [Skill 3.C]", "eks": [{"code": "3.15.A.1", "text": "The expected counts (under the null hypothesis) in a particular cell of a two-way table of categorical data can be calculated using the formula $\\text{expected count}=\\dfrac{(\\text{row total})(\\text{column total})}{\\text{total table}}$."}]}, {"code": "3.15.B", "text": "Calculate the appropriate test statistic and p-value for a chi- square test for homogeneity or independence. [Skill 3.E]", "eks": [{"code": "3.15.B.1", "text": "The appropriate test statistic for a chi-square test for homogeneity or independence is the chi-square statistic $\\chi^{2}=\\sum\\dfrac{(\\text{Observed Count}-\\text{Expected Count})^{2}}{\\text{Expected Count}}$, where the sum is taken over all cells of the two-way table. The chi-square statistics have a chi-square distribution with degrees of freedom equal to $(\\text{number of rows}-1)\\cdot(\\text{number of columns}-1)$ when the null hypothesis is true."}, {"code": "3.15.B.2", "text": "The p-value for a chi-square test for independence or homogeneity is found from a chi-square distribution using a table or technology."}]}, {"code": "3.15.C", "text": "Interpret the p-value for the chi-square test for homogeneity or independence. [Skill 4.F]", "eks": [{"code": "3.15.C.1", "text": "The p-value is the probability of obtaining a test statistic as extreme or more extreme than the test statistic that was observed (i.e., in the direction of the alternative hypothesis) given that the null hypothesis is true. An interpretation of the p-value for the chi-square test for homogeneity or independence should include a statement that the p-value is computed by assuming the null hypothesis is true in context."}]}, {"code": "3.15.D", "text": "Justify a claim about the population(s) based on the results of a chi-square test for homogeneity or independence. [Skill 4.G]", "eks": [{"code": "3.15.D.1", "text": "A formal decision in a hypothesis test explicitly compares the $p$-value to the significance level, $\\alpha$. If the $p$-value $\\le\\alpha$, then reject the null hypothesis for the appropriate chi-square test. If the $p$-value $>\\alpha$, then fail to reject the null hypothesis."}, {"code": "3.15.D.2", "text": "The results of a chi-square test for homogeneity or independence can serve as the statistical reasoning to support the answer to an investigative question about the population that was sampled (independence) or the populations that were sampled (homogeneity)."}, {"code": "3.15.D.3", "text": "A conclusion for a chi-square test for homogeneity or independence is stated in context consistent with, and in terms of, the alternative hypothesis using non-definitive language. The conclusion should contain a reference to the population(s)."}]}]}], "skills": ["Set up and carry out a chi-square test for independence.", "Distinguish independence from homogeneity from how the data were collected."], "understandings": ["Independence asks whether two categorical variables are associated within one population, from a single sample.", "Degrees of freedom are (rows minus 1) times (columns minus 1).", "Association does not mean cause."], "misconceptions": ["Concluding a cause from an association.", "Mixing up the homogeneity and independence hypotheses.", "Skipping the expected count check."], "processes": ["State H0 (the variables are independent), enter counts, run the chi-square test, check expected counts, conclude."], "exam": ["Hypotheses are about association between the two variables in the population, in context."], "qr": "https://broth11.github.io/ap-stats/unit-3b.html#L13", "files": {"F": [{"l": "3.B.5.APStats.Handout", "h": "https://drive.google.com/file/d/1kMY9CX1bZiBpZd7GTsyuw3rSqcRdbgkp/view", "k": "page", "x": ""}, {"l": "3.B.5.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1c6tj2Teh6lTAz8ZzJUkItoRMfOkPkdhF/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=do0afvzdUQM", "k": "video", "x": ""}, {"l": "Supplemental video (chi-square p-value)", "h": "https://www.youtube.com/watch?v=nGD_fuKR-Q8", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 3.14", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=42", "k": "brain", "x": ""}, {"l": "Stats Hub 3.15", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=43", "k": "brain", "x": ""}, {"l": "Practice Library 3.B.5", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=3-b&question=u3b41", "k": "brain", "x": ""}]}}], "view": true, "back": "Part 3B · Inference for Multiple Proportions"}</script>

<script>
(function(){
'use strict';
var D=JSON.parse(document.getElementById('data').textContent), app=document.getElementById('app'), L=D.lessons, P=D.parts;
var ICON={"page": "<path d=\"M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z\" /><path d=\"M14 2v4a2 2 0 0 0 2 2h4\" /><path d=\"M10 9H8\" /><path d=\"M16 13H8\" /><path d=\"M16 17H8\" />", "link": "<path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\" /><path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\" />", "video": "<path d=\"M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.55 49.55 0 0 1-16.2 0A2 2 0 0 1 2.5 17\" /><path d=\"m10 15 5-3-5-3z\" />", "brain": "<path d=\"M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z\" /><path d=\"M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z\" /><path d=\"M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4\" /><path d=\"M17.599 6.5a3 3 0 0 0 .399-1.375\" /><path d=\"M6.003 5.125A3 3 0 0 0 6.401 6.5\" /><path d=\"M3.477 10.896a4 4 0 0 1 .585-.396\" /><path d=\"M19.938 10.5a4 4 0 0 1 .585.396\" /><path d=\"M6 18a4 4 0 0 1-1.967-.516\" /><path d=\"M19.967 17.484A4 4 0 0 1 18 18\" />"};
var TABS=[['overview','Overview'],['skills','Skills'],['standards','CED'],['files','Files'],['understandings','Key ideas'],['misconceptions','Watch out'],['processes','How to'],['exam','Exam tips']];
var NAME={skills:'Skills',standards:'CED topics',understandings:'Key ideas',misconceptions:'Watch out for',processes:'How to do it',exam:'Exam tips',files:'Files'};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function mt(s){var o='',p=String(s==null?'':s).split('$');for(var i=0;i<p.length;i++){if(i%2===0){o+=esc(p[i]);}else{try{o+=window.katex?katex.renderToString(p[i],{throwOnError:false}):esc('$'+p[i]+'$');}catch(e){o+=esc('$'+p[i]+'$');}}}return o;}
function fmt(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
function icon(k){return '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[k]+'</svg>';}
function byId(id){for(var i=0;i<L.length;i++)if(L[i].id===id)return L[i];return null;}
function pad(n){return (n<10?'0':'')+n;}
function cl(s){var c=s.code.replace('CED ','');return D.ced&&s.ek&&s.ek.length?'data-href="'+D.ced+'#'+encodeURIComponent(c)+'" title="Open CED '+esc(c)+'"':'';}
function chips(l){return l.standards.map(function(s){var h=cl(s);return h?'<button type="button" class="chip" '+h+'>'+esc(s.code.replace('CED ',''))+'</button>':'<span class="chip">'+esc(s.code.replace('CED ',''))+'</span>';}).join('');}
function list(a){return a&&a.length?'<ul>'+a.map(function(x){return '<li>'+fmt(x)+'</li>';}).join('')+'</ul>':'<p class="none">Nothing here yet</p>';}
function ekh(s,open){if(!s.ek||!s.ek.length)return '';var n=s.ek.reduce(function(a,lo){return a+lo.eks.length;},0);return '<details class="ek"'+(open?' open':'')+'><summary>Essential knowledge ('+n+')</summary>'+s.ek.map(function(lo){return '<div class="lo"><b>'+esc(lo.code)+'</b> '+esc(lo.text)+'</div><ul class="eks">'+lo.eks.map(function(e){return '<li><span class="ekc">'+esc(e.code)+'</span>'+(e.img&&!e.text?'<img src="'+e.img+'" alt="'+esc(e.code)+'">':'<span class="tx">'+mt(e.text)+'</span>')+'</li>';}).join('')+'</ul>';}).join('')+'</details>';}
function std(l,open){return l.standards.length?'<dl class="stds">'+l.standards.map(function(s){return '<dt>'+(cl(s)?'<button type="button" class="cedlink" '+cl(s)+'>'+esc(s.code.replace('CED ',''))+'</button>':esc(s.code.replace('CED ','')))+'</dt><dd>'+fmt(s.text)+'</dd>'+ekh(s,open);}).join('')+'</dl>':'<p class="none">Nothing here yet</p>';}
function btns(items){return items.map(function(f){return '<button type="button" class="fbtn'+(f.t?' tonly':'')+'" data-open="'+esc(f.h)+'" title="'+esc(f.l)+'">'+icon(f.k)+'<span>'+esc(f.l)+(f.x?' <em>'+esc(f.x)+'</em>':'')+'</span>'+(f.t?'<i class="tb">T</i>':'')+'</button>';}).join('');}
function col(t,items){return '<div class="col"><h3>'+t+'</h3>'+(items.length?'<div class="fbtns">'+btns(items)+'</div>':'<p class="none">None</p>')+'</div>';}
function cols(l){return '<div class="cols">'+col('Files',l.files.F)+col('Videos',l.files.V)+col('Links',l.files.K)+'</div>';}
function lessonUrl(id){var l=byId(id);return l&&l.qr?l.qr:location.href.split('#')[0]+'#'+id;}
function qrSvg(url){var q=qrcode(0,'M');q.addData(url);q.make();var n=q.getModuleCount(),d='',r,c;for(r=0;r<n;r++)for(c=0;c<n;c++)if(q.isDark(r,c))d+='M'+(c+4)+' '+(r+4)+'h1v1h-1z';return '<svg viewBox="0 0 '+(n+8)+' '+(n+8)+'" shape-rendering="crispEdges" aria-hidden="true"><rect width="100%" height="100%" fill="#fff"/><path d="'+d+'" fill="#0b0b0b"/></svg>';}
function qrBtn(l){if(D.teacher)return '';return '<button type="button" class="qr" data-qr="'+l.id+'" title="Show QR code for lesson '+esc(l.code)+'" aria-label="Show QR code for lesson '+esc(l.code)+'">'+qrSvg(lessonUrl(l.id))+'</button>';}
function qrClose(){var m=document.getElementById('qrm');if(m)m.remove();}
function qrOpen(id){var l=byId(id);if(!l)return;qrClose();var u=lessonUrl(id),m=document.createElement('div');m.id='qrm';m.className='qrm';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.setAttribute('aria-label','QR code for lesson '+l.code);m.innerHTML='<div class="qrm-card"><div class="qrm-big">'+qrSvg(u)+'</div><div class="qrm-cap"><span class="code-tag">Lesson '+esc(l.code)+'</span><b>'+esc(l.title)+'</b><span class="qrm-url">'+esc(u)+'</span></div></div>';document.body.appendChild(m);}
function numCell(l){return '<span class="num">'+pad(l.ln)+'</span>';}
function titleBlock(l){return '<div class="ttl"><span class="code-tag">Lesson '+esc(l.code)+'</span><h2>'+fmt(l.title)+'</h2></div>';}

var state={lens:'overview',lesson:null,section:null};
function read(){
  var h=decodeURIComponent(location.hash.slice(1)),p=h.split('/'),n={lens:state.lens,lesson:null,section:null};
  if(byId(p[0])){n.lesson=p[0];n.section=p[1]||null;}
  else n.lens=TABS.some(function(t){return t[0]===h;})?h:'overview';
  return n;
}
function lensBar(){return '<nav class="lens" aria-label="Category">'+TABS.map(function(t){return '<button type="button" class="tab'+(state.lens===t[0]?' on':'')+'" data-go="#'+(t[0]==='overview'?'':t[0])+'">'+t[1]+'</button>';}).join('')+'</nav>';}
function xres(){if(!D.teacher||!D.extra)return '';var e=D.extra,o='<details class="xres"><summary>Unit and course resources</summary><div class="xgrid">';if(e.unit.length)o+='<div class="col"><h3>This unit</h3><div class="fbtns">'+btns(e.unit)+'</div></div>';e.course.forEach(function(g){o+='<div class="col"><h3>'+esc(g.group)+'</h3><div class="fbtns">'+btns(g.items)+'</div></div>';});return o+'</div></details>';}
function hero(){return '<header class="hero"><span class="sticker">'+(D.teacher?'Teacher site':L.length+' lessons')+'</span><div class="eyebrow">'+(D.teacher?'Teacher · ':'')+'Unit '+D.unit+'</div><h1>'+esc(D.title)+'</h1><p>'+fmt(D.overview)+'</p></header>';}
function jump(){return L.length>1?'<nav class="jump lessons" aria-label="Lessons">'+L.map(function(l){return '<button type="button" data-jumpl="'+l.id+'" title="'+esc(l.title)+'">'+esc(l.code)+'</button>';}).join('')+'</nav>':'';}
function partHead(p,n){return '<div class="part" id="p'+p.code+'"><div class="code">'+p.code+'</div><div class="pt"><b>'+esc(p.title)+'</b><span>'+n+' lesson'+(n!==1?'s':'')+'</span></div></div>';}

function overviewCard(l){
  return '<article class="card" data-id="'+l.id+'">'+qrBtn(l)+'<div class="card-top" role="link" tabindex="0" data-go="#'+l.id+'">'+numCell(l)+titleBlock(l)+'</div>'+
   '<div class="chips"><span class="lab">CED</span>'+chips(l)+'</div>'+
   '<div class="card-body"><div class="blk" role="link" tabindex="0" data-go="#'+l.id+'/skills"><h3>Skills</h3>'+list(l.skills.slice(0,3))+(l.skills.length>3?'<p class="more">+'+(l.skills.length-3)+' more</p>':'')+'</div>'+
   '<div class="blk" role="link" tabindex="0" data-go="#'+l.id+'"><h3>Summary</h3><p>'+fmt(l.summary)+'</p></div></div>'+
   '<div class="cut"></div>'+cols(l)+'</article>';
}
function lensRow(l,k){
  var body=k==='files'?cols(l):k==='standards'?std(l,true):list(l[k]);
  return '<article class="card lrow" data-id="'+l.id+'">'+qrBtn(l)+'<div class="lr-head" role="link" tabindex="0" data-go="#'+l.id+'/'+k+'">'+numCell(l)+titleBlock(l)+'</div><div class="lr-body">'+body+'</div></article>';
}
function board(){
  var out='';
  P.forEach(function(p){
    var ls=L.filter(function(l){return l.part===p.code;});
    out+='<section>'+partHead(p,ls.length)+ls.map(function(l){return state.lens==='overview'?overviewCard(l):lensRow(l,state.lens);}).join('')+'</section>';
  });
  return out;
}
function sec(key,inner){return '<section class="sec'+(state.section===key?' focus':'')+'" id="s-'+key+'"><h3>'+NAME[key]+'</h3>'+inner+'</section>';}
function sheet(){
  var l=byId(state.lesson); if(!l)return '';
  var i=L.indexOf(l),pv=L[i-1],nx=L[i+1];
  return '<div class="sheet" tabindex="-1" role="dialog" aria-modal="true" aria-label="Lesson '+esc(l.code)+'"><div class="wrap">'+
   '<div class="sheet-bar"><button type="button" class="back" data-go="#'+(state.lens==='overview'?'':state.lens)+'">&larr; '+esc(D.back||('Unit '+D.unit+' '+D.title))+'</button><span class="pager">'+
   (pv?'<button type="button" data-go="#'+pv.id+'" title="'+esc(pv.title)+'">&lsaquo; '+esc(pv.code)+'</button>':'<span class="off">&lsaquo;</span>')+
   (nx?'<button type="button" data-go="#'+nx.id+'" title="'+esc(nx.title)+'">'+esc(nx.code)+' &rsaquo;</button>':'<span class="off">&rsaquo;</span>')+'</span></div>'+
   '<header class="s-head sq">'+numCell(l)+'<div><span class="code-tag">Lesson '+esc(l.code)+' · '+esc(l.partTitle)+'</span><h2>'+fmt(l.title)+'</h2></div>'+qrBtn(l)+'</header>'+
   '<section class="sec'+(state.section==='files'?' focus':'')+'" id="s-files">'+cols(l)+'</section>'+
   '<div class="s-grid"><div class="s-main">'+
   '<section class="sec"><h3>Summary</h3><p>'+fmt(l.summary)+'</p></section>'+
   '<div class="quad">'+sec('understandings',list(l.understandings))+sec('misconceptions',list(l.misconceptions))+sec('processes',list(l.processes))+sec('exam',list(l.exam))+'</div>'+
   sec('skills',list(l.skills))+'</div>'+
   '<aside class="s-side">'+sec('standards',std(l))+'</aside></div>'+
   '</div></div>';
}
function draw(){
  var open=!!state.lesson;
  app.innerHTML=hero()+(state.lens==='overview'?xres():'')+lensBar()+jump()+board()+'<p class="foot">Click a lesson for its full page. Esc returns.</p>'+sheet();
  document.body.classList.toggle('locked',open);
  var sh=app.querySelector('.sheet'); if(sh){sh.focus({preventScroll:true});var f=sh.querySelector('.focus');if(f)f.scrollIntoView({block:'center'});else sh.scrollTop=0;}
}
function route(){
  var n=read(),same=n.lens===state.lens&&n.lesson===state.lesson&&n.section===state.section;
  var y=window.scrollY; state=n; if(!same){draw(); if(!n.lesson)window.scrollTo(0,y);}
}
window.addEventListener('hashchange',route);
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&document.getElementById('qrm')){qrClose();return;}
  if(e.key==='Escape'&&state.lesson){location.hash=state.lens==='overview'?'':state.lens;return;}
