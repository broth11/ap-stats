<script id="data" type="application/json">{"unit": 4, "teacher": false, "extra": null, "ced": "ced-4.html", "title": "Inference for Quantitative Data: Means", "overview": "Extends inference to means: sampling distributions of x-bar, t intervals and t tests for one mean or mean difference (paired data), then the same for the difference between two independent means.", "parts": [{"code": "4B", "title": "Inference for Multiple Means"}], "lessons": [{"id": "L6", "n": 6, "ln": 1, "code": "4.B.1", "part": "4B", "partTitle": "Inference for Multiple Means", "title": "Sampling Distribution for Two Means", "summary": "Comparing two groups means describing the sampling distribution of the difference between two sample means. You calculate its center and spread and check conditions for both groups. The activity returns to the social media experiment and compares the mental health scores of the two groups.", "standards": [{"code": "CED 4.6", "text": "Sampling distributions for the difference between two sample means", "ek": [{"code": "4.6.A", "text": "Calculate the mean and standard deviation of a sampling distribution for the difference between two sample means. [Skill 3.D]", "eks": [{"code": "4.6.A.1", "text": "For two independent populations with population means $\\mu_1$ and $\\mu_2$ and population standard deviations $\\sigma_1$ and $\\sigma_2$, when the sampled values are independent, the sampling distribution of the difference in sample means $\\bar{x}_1-\\bar{x}_2$ has a mean $\\mu_{(\\bar{x}_1-\\bar{x}_2)}=\\mu_1-\\mu_2$ and standard deviation $\\sigma_{(\\bar{x}_1-\\bar{x}_2)}=\\sqrt{\\dfrac{\\sigma_1^{2}}{n_1}+\\dfrac{\\sigma_2^{2}}{n_2}}$."}]}, {"code": "4.6.B", "text": "Justify the appropriateness of conditions for the sampling distribution of the difference between two sample means. [Skill 4.E]", "eks": [{"code": "4.6.B.1", "text": "Sampling without replacement requires that two conditions must be met:\n4.6.B.1.i The randomization condition—the data should be collected using two independent random samples.\n4.6.B.1.ii The 10% condition—the size of each sample should be less than or equal to 10% of the respective population size: $n_1\\le 10\\%N_1$ and $n_2\\le 10\\%N_2$, where $N_1$ is the size of population 1 and $N_2$ is the size of population 2. The sample sizes are represented as $n_1$ and $n_2$."}, {"code": "4.6.B.2", "text": "If the data come from an experiment, the data only need to meet the randomization condition. The treatments must be randomly assigned to experimental units to meet the randomization condition."}, {"code": "4.6.B.3", "text": "The sampling distribution for the difference between sample means, $\\bar{x}_1-\\bar{x}_2$, can be modeled with a normal distribution if the two population distributions can each be modeled by a normal distribution."}, {"code": "4.6.B.4", "text": "The sampling distribution for the difference between sample means, $\\bar{x}_1-\\bar{x}_2$, can be modeled approximately by a normal distribution if the two population distributions cannot be modeled by a normal distribution but $n_1\\ge 30$ and $n_2\\ge 30$."}]}, {"code": "4.6.C", "text": "Interpret the mean, standard deviation, and probabilities for a sampling distribution for the difference between sample means. [Skill 4.D]", "eks": [{"code": "4.6.C.1", "text": "The mean, standard deviation, and probabilities for a sampling distribution for the difference between sample means should be interpreted within the context of specific populations."}]}]}], "skills": ["Describe the sampling distribution of x1-bar minus x2-bar.", "Check independence and normality for both samples."], "understandings": ["Variances of independent sample means add.", "Both samples need normality conditions."], "misconceptions": ["Subtracting standard deviations.", "Treating paired data as two samples."], "processes": ["Compute the mean and standard deviation of the difference, check both samples."], "exam": ["Check conditions separately for each group."], "qr": "https://broth11.github.io/ap-stats/unit-4b.html#L6", "files": {"F": [{"l": "4.B.1.APStats.Handout", "h": "https://drive.google.com/file/d/1m-K2eU0yPuMSc6sOxeCiOqfuHOQNzKgw/view", "k": "page", "x": ""}, {"l": "4.B.1.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/114CVZpZhyqLdv7tZHjZXaUftaHBkHBAJ/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=nAlbRM-iN0Y", "k": "video", "x": ""}, {"l": "Supplemental video", "h": "https://youtu.be/74R6MVY2Muc", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 4.6", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=48", "k": "brain", "x": ""}, {"l": "Practice Library (AP Statistics)", "h": "https://broth11.github.io/practice-library/#course=ap-statistics", "k": "brain", "x": ""}]}}, {"id": "L7", "n": 7, "ln": 2, "code": "4.B.2", "part": "4B", "partTitle": "Inference for Multiple Means", "title": "Interval for Two Means", "summary": "A two-sample t-interval estimates the difference between two population means. You check conditions, build and interpret the interval, and decide whether zero is plausible. The activity uses a natural experiment to ask whether college causes higher wages.", "standards": [{"code": "CED 4.7", "text": "Constructing a confidence interval for the difference between two population means", "ek": [{"code": "4.7.A", "text": "Identify an appropriate confidence interval procedure including the parameter for the difference between two population means. [Skill 2.C]", "eks": [{"code": "4.7.A.1", "text": "Based on the sample data, a confidence interval can be calculated to estimate the difference between two population means. The appropriate confidence interval procedure for two independent samples is a two-sample t-interval for the difference between population means."}, {"code": "4.7.A.2", "text": "The parameter for a confidence interval for a two-sample t-interval for the difference between population means should reference the difference in the means, the response variable, and the populations in context."}]}, {"code": "4.7.B", "text": "Justify the appropriateness of constructing a confidence interval for the difference between two population means by verifying conditions. [Skill 4.E]", "eks": [{"code": "4.7.B.1", "text": "A two-sample $t$-interval for a difference between population means requires that three conditions be met:\n4.7.B.1.i The randomization condition—the data should be collected using two independent random samples or a randomized experiment.\n4.7.B.1.ii The 10% condition—when sampling without replacement, the size of each sample should be less than or equal to 10% of the respective population size: $n_1\\le 10\\%N_1$ and $n_2\\le 10\\%N_2$, where $N_1$ is the size of population 1 and $N_2$ is the size of population 2. The sample sizes are represented as $n_1$ and $n_2$. (Note: This condition is unnecessary when the data are from a randomized experiment).\n4.7.B.1.iii The sample data condition—both samples should have a sample size greater than or equal to 30 or it is indicated that both population distributions are approximately normal. If either sample size is less than 30, both sample data distributions should be free from strong skewness and outliers."}]}, {"code": "4.7.C", "text": "Calculate an appropriate confidence interval for the difference between two population means. [Skill 3.E]", "eks": [{"code": "4.7.C.1", "text": "A point estimate for the difference between two population means is the difference in sample means, $\\bar{x}_1-\\bar{x}_2$."}, {"code": "4.7.C.2", "text": "For the difference between population means when the population standard deviations are unknown, the confidence interval can be constructed as point estimate $\\pm$ (margin of error). The confidence interval for the difference between population means is $(\\bar{x}_1-\\bar{x}_2)\\pm t^{*}\\sqrt{\\dfrac{s_1^{2}}{n_1}+\\dfrac{s_2^{2}}{n_2}}$, where $t^{*}$ are the critical values for the central $C$% of a $t$-distribution with appropriate degrees of freedom that can be found using technology. The degrees of freedom fall between $n_1+n_2-2$ and the smaller of $n_1-1$ and $n_2-1$."}]}, {"code": "4.7.D", "text": "Calculate the standard error and margin of error for estimating the difference between two population means. [Skill 3.E]", "eks": [{"code": "4.7.D.1", "text": "The standard error for the difference between two sample means is $SE_{\\bar{x}_1-\\bar{x}_2}=\\sqrt{\\dfrac{s_1^{2}}{n_1}+\\dfrac{s_2^{2}}{n_2}}$, where $s_1$ and $s_2$ are the sample standard deviations."}, {"code": "4.7.D.2", "text": "For the difference between two sample means, the margin of error is the critical value ($t^{*}$) times the standard error ($SE$) of the difference of two sample means, which equals $t^{*}\\sqrt{\\dfrac{s_1^{2}}{n_1}+\\dfrac{s_2^{2}}{n_2}}$."}]}]}, {"code": "CED 4.8", "text": "Justifying a claim based on a confidence interval for the difference between two population means", "ek": [{"code": "4.8.A", "text": "Interpret a confidence interval in context for the difference between two population means. [Skill 4.F]", "eks": [{"code": "4.8.A.1", "text": "Because the confidence interval for the difference between two population means is calculated based on samples from two populations, the computed interval may or may not contain the value for the difference between the two population means."}, {"code": "4.8.A.2", "text": "The interpretation of the confidence level is as follows: In repeated random sampling with the same sample size from the same populations, approximately C% of confidence intervals created will capture the difference between the two population means, where C represents the numerical value of the confidence level used."}, {"code": "4.8.A.3", "text": "When interpreting a $C$% confidence interval for the difference between two population means, we say we are $C$% confident that the interval $(a,b)$ contains the value of the difference in the population means, where $a$ represents the lower limit and $b$ represents the upper limit. An interpretation of a confidence interval for the difference between two population means includes a reference to the difference in the population means with the details about the populations it represents in the context of the study."}]}, {"code": "4.8.B", "text": "Justify a claim based on a confidence interval for the difference between two population means. [Skill 4.G]", "eks": [{"code": "4.8.B.1", "text": "A confidence interval for the difference between two population means provides an interval of values that may serve as convincing evidence to support a particular claim about the difference in two population means. For example, if the interval contains 0, then there is insufficient evidence to conclude there is a difference between the two population means. If the interval does not contain 0, then there is sufficient evidence to conclude there is a difference between the two population means."}]}]}], "skills": ["Construct and interpret a two-sample t interval.", "Decide whether zero is plausible."], "understandings": ["An interval containing 0 means no difference is plausible.", "The sign of the interval shows which mean is larger."], "misconceptions": ["Reading the interval as individuals.", "Ignoring the direction of subtraction."], "processes": ["Define mu1 and mu2, check conditions, run 2-SampTInt (no pooling), interpret."], "exam": ["Interpret the difference mu1 minus mu2 in context."], "qr": "https://broth11.github.io/ap-stats/unit-4b.html#L7", "files": {"F": [{"l": "4.B.2.APStats.Handout", "h": "https://drive.google.com/file/d/1h3srrMBCtkjgpfcHD03oy2Iacw_7uUV4/view", "k": "page", "x": ""}, {"l": "4.B.2.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1rTMxUsdv2_78rDwuTZPbQXrVXChqf69R/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=mld1lYbUZF8", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 4.7 & 4.8", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=49", "k": "brain", "x": ""}, {"l": "Practice Library (AP Statistics)", "h": "https://broth11.github.io/practice-library/#course=ap-statistics", "k": "brain", "x": ""}]}}, {"id": "L8", "n": 8, "ln": 3, "code": "4.B.3", "part": "4B", "partTitle": "Inference for Multiple Means", "title": "Hypothesis Test for Two Means", "summary": "A two-sample t-test checks whether two population means differ. You state hypotheses, check conditions, calculate the t statistic and p-value, and conclude in context. The activity analyzes a stent retriever trial to ask whether it improves recovery after a stroke.", "standards": [{"code": "CED 4.9", "text": "Setting up a test for the difference between two population means", "ek": [{"code": "4.9.A", "text": "Identify an appropriate testing method for the difference between two population means including the parameters for the difference between the two population means. [Skill 2.C]", "eks": [{"code": "4.9.A.1", "text": "The appropriate test for the difference between two population means is a two-sample t-test for a difference between two population means."}, {"code": "4.9.A.2", "text": "The parameters for a hypothesis test for the difference between two population means should reference the population parameters, the response variables, and the populations in context."}]}, {"code": "4.9.B", "text": "Identify the null and alternative hypotheses for the difference between two population means. [Skill 2.E]", "eks": [{"code": "4.9.B.1", "text": "The null hypothesis for a two-sample $t$-test for the difference between two population means, $\\mu_1$ and $\\mu_2$, can be written as either $H_0: \\mu_1-\\mu_2=0$ or $H_0: \\mu_1=\\mu_2$. A one-sided alternative hypothesis for the difference between population means can be written as either $H_a: \\mu_1<\\mu_2$ (or equivalently $H_a: \\mu_1-\\mu_2<0$) or $H_a: \\mu_1>\\mu_2$ (or equivalently $H_a: \\mu_1-\\mu_2>0$). A two-sided alternative hypothesis for the difference between population means can be written as $H_a: \\mu_1\\ne\\mu_2$ (or equivalently $H_a: \\mu_1-\\mu_2\\ne 0$)."}]}, {"code": "4.9.C", "text": "Justify the appropriateness of a hypothesis test for the difference between two population means by verifying conditions. [Skill 4.E]", "eks": [{"code": "4.9.C.1", "text": "A two-sample $t$-test for a difference between population means requires that three conditions be met:\n4.9.C.1.i The randomization condition—the data should be collected using two independent random samples or a randomized experiment.\n4.9.C.1.ii The 10% condition—when sampling without replacement, the size of each sample should be less than or equal to 10% of the respective population size: $n_1\\le 10\\%N_1$ and $n_2\\le 10\\%N_2$, where $N_1$ is the size of population 1 and $N_2$ is the size of population 2. The sample sizes are represented as $n_1$ and $n_2$. (Note: This condition is unnecessary when the data are from a randomized experiment.)\n4.9.C.1.iii The sample data condition—both samples should have a sample size greater than or equal to 30 or it is indicated that both population distributions are approximately normal. If either sample size is less than 30, both sample data distributions should be free from strong skewness and outliers."}]}]}, {"code": "CED 4.10", "text": "Carrying out a test for the difference between two population means", "ek": [{"code": "4.10.A", "text": "Calculate an appropriate test statistic and p-value for testing a hypothesis for the difference between two population means. [Skill 3.E]", "eks": [{"code": "4.10.A.1", "text": "The test statistic for a two-sample $t$-test for the difference between two population means is $t=\\dfrac{(\\bar{x}_1-\\bar{x}_2)-0}{\\sqrt{\\dfrac{s_1^{2}}{n_1}+\\dfrac{s_2^{2}}{n_2}}}$. The $t$-statistic has a $t$-distribution when the null hypothesis is true. The $t$-statistics with the degrees of freedom can be found using technology. The degrees of freedom fall between $n_1+n_2-2$ and the smaller of $n_1-1$ and $n_2-1$."}, {"code": "4.10.A.2", "text": "The p-value for a two-sample t-test for the difference between two population means can be found using the appropriate t-distribution table or from the appropriate t-distribution using technology."}]}, {"code": "4.10.B", "text": "Interpret the p-value of a hypothesis test for the difference between two population means. [Skill 4.F]", "eks": [{"code": "4.10.B.1", "text": "The p-value is the probability of obtaining a test statistic as extreme or more extreme than the test statistic that was observed (i.e., in the direction of the alternative hypothesis) given that the null hypothesis is true. An interpretation of the p-value of a hypothesis test for a two-sample test for the difference between two population means should include a statement that the p-value is computed by assuming that the null hypothesis is true (i.e., by assuming the population means are equal to each other in context)."}]}, {"code": "4.10.C", "text": "Justify a claim about the populations based on the results of a hypothesis test for the difference between two population means. [Skill 4.G]", "eks": [{"code": "4.10.C.1", "text": "A formal decision explicitly compares the $p$-value to the significance level, $\\alpha$. If the $p$-value $\\le\\alpha$, then reject the null hypothesis, $H_0: \\mu_1-\\mu_2=0$ or $H_0: \\mu_1=\\mu_2$. If the $p$-value $>\\alpha$, then fail to reject the null hypothesis."}, {"code": "4.10.C.2", "text": "The results of a hypothesis test for a two-sample t-test for a difference between two population means can serve as the statistical reasoning to support the answer to an investigative question about the two populations that were sampled."}, {"code": "4.10.C.3", "text": "A conclusion for the hypothesis test for the difference between two population means is stated in context consistent with, and in terms of, the alternative hypothesis using non-definitive language. The conclusion should contain a reference to the parameters and the populations."}]}]}], "skills": ["State hypotheses and carry out a two-sample t test.", "Conclude in context."], "understandings": ["The null says the two population means are equal.", "Significance gives evidence of a difference in population means."], "misconceptions": ["Using a paired test for independent samples.", "Concluding causation without random assignment."], "processes": ["State, plan, check conditions, run 2-SampTTest, conclude."], "exam": ["State whether the design is paired or independent and justify."], "qr": "https://broth11.github.io/ap-stats/unit-4b.html#L8", "files": {"F": [{"l": "4.B.3.APStats.Handout", "h": "https://drive.google.com/file/d/1RiyB9D6ze0AytMviIA4iIpWDa3t59bnQ/view", "k": "page", "x": ""}, {"l": "4.B.3.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1cGFz2CTBB_EQp15iNRQwfc5GUaJNwCSL/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=D9tgE9OvBrQ", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 4.9 & 4.10", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=50", "k": "brain", "x": ""}, {"l": "Practice Library (AP Statistics)", "h": "https://broth11.github.io/practice-library/#course=ap-statistics", "k": "brain", "x": ""}]}}], "view": true, "back": "Part 4B · Inference for Multiple Means"}</script>
