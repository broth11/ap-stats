        {
         "code": "1.7.A.3",
         "text": "The median is the middle value when the data set is ordered from smallest to largest and can be found with and without using technology. One common method for determining the median of a data set with an even number of values is to use the mean of the two middle values. A common method for determining the median of a data set with an odd number of values is to use the value in the middle of all the values."
        },
        {
         "code": "1.7.A.4",
         "text": "In an ordered data set, the smallest value is the minimum value, and the largest value is the maximum value."
        },
        {
         "code": "1.7.A.5",
         "text": "The first quartile, denoted by Q1, is the median value of the lower half of the ordered data set from the minimum value to the position of the median. Approximately 25% of the values in the data set are less than or equal to Q1. The third quartile, denoted by Q3, is the median value of the upper half of the ordered data set from the position of the median to the maximum value. Approximately 75% of the values in the data set are less than or equal to Q3. The second quartile, Q2, is also the median of the data set. Q1 and Q3 form the boundaries for the middle 50% of values in an ordered data set."
        },
        {
         "code": "1.7.A.6",
         "text": "The pth percentile is the value that has p% of the data less than or equal to it when the data set is ordered from smallest to largest. The first and third quartiles are the 25th and 75th percentiles, respectively."
        }
       ]
      },
      {
       "code": "1.7.B",
       "text": "Calculate measures of variability for quantitative data. [Skill 3.B]",
       "eks": [
        {
         "code": "1.7.B.1",
         "text": "Three commonly used measures of variability (or spread) in the distribution of a quantitative variable are the range, interquartile range, and standard deviation."
        },
        {
         "code": "1.7.B.2",
         "text": "The range is the difference between the maximum data value and the minimum data value."
        },
        {
         "code": "1.7.B.3",
         "text": "The interquartile range (IQR) is the difference between the third and first quartiles: Q3 − Q1."
        },
        {

   "title": "Types of Studies",
   "topic": "Types of Studies.",
   "standards": [
    {
     "code": "CED 1.10",
     "text": "The investigative question revisited and data collection",
     "ek": [
      {
       "code": "1.10.A",
       "text": "Determine the components of an investigative question within a statistical study. [Skill 1.A]",
       "eks": [
        {
         "code": "1.10.A.1",
         "text": "The first component of an investigative question should guide the data collection process and should be phrased in terms of the variable(s) of interest in the study."
        },
        {
         "code": "1.10.A.2",
         "text": "The second component of an investigative question should guide the data analysis choice. 1.10.A.2.i In the case of a hypothesis test, the investigative question should make clear the parameter and the direction of the alternative hypothesis (i.e., not equal, greater than, less than, association, not independent). 1.10.A.2.ii In the case of a confidence interval, the investigative question should make clear the parameter and the goal of estimation of that parameter within a range of potential values."
        },
        {
         "code": "1.10.A.3",
         "text": "The third component of an investigative question should indicate the type(s) of conclusion(s) applicable from the study. The investigative question should provide the population to which the conclusions will be applicable and, in the case of an experiment that uses random assignment, a cause-and-effect conclusion."
        }
       ]
      },
      {
       "code": "1.10.B",
       "text": "Identify a census. [Skill 2.A]",
       "eks": [
        {
         "code": "1.10.B.1",
         "text": "A census consists of recording information from all items or individuals in a population."
        }
       ]
      },
      {
       "code": "1.10.C",
       "text": "Identify an experiment. [Skill 2.A]",
       "eks": [
        {
         "code": "1.10.C.1",
         "text": "An experiment is a study in which a researcher assigns conditions, or treatments, to experimental units to explore an investigative question of interest about the population."
        },
        {
         "code": "1.10.C.2",
         "text": "The experimental unit is the observational unit to which the treatment is assigned. When experimental units consist of people, they are sometimes referred to as subjects or participants."
        },
        {
         "code": "1.10.C.3",
         "text": "An explanatory variable, or factor, is a variable whose different categories, or levels, are imposed on the experimental units. The different categories, or levels, of the explanatory variable are called treatments. When there is more than one explanatory variable, the combinations of the categories, or levels, of the explanatory variables are called treatments."
        },
        {
         "code": "1.10.C.4",
         "text": "A response variable is an outcome measured on each experimental unit after the treatment has been administered."
        }
       ]
      },
      {
       "code": "1.10.D",
       "text": "Identify an observational study. [Skill 2.A]",
       "eks": [
        {
         "code": "1.10.D.1",
         "text": "An observational study is a study where treatments are not imposed. The researcher records the values of the variables of interest in order to explore an investigative question of interest."
        },
        {
         "code": "1.10.D.2",
         "text": "A prospective study is one in which the observational units of study are selected at a point in time, and data are gathered both at that time and into the future."
        },
        {
         "code": "1.10.D.3",
         "text": "A retrospective study is one in which the observational units of study are selected at a point in time and data from the past are gathered."
        },
        {
         "code": "1.10.D.4",
         "text": "A survey is an observational study in which the data are collected from humans using a standard set of questions."
        },
        {
         "code": "1.10.D.5",
         "text": "A confounding variable in an observational study provides an alternative explanation for the observed relationship between the explanatory and response variables determined in the study, thereby reducing the possibility of concluding a causal relationship between the explanatory and response variables of interest. To be a confounding variable, a variable must be associated with both the explanatory variable and the response variable."
        }
       ]
      },
      {
       "code": "1.10.E",
       "text": "Justify the appropriateness of generalizations for a statistical study. [Skill 2.B]",

         "code": "1.10.E.1",
         "text": "A sample is considered random when all observational units in the sample are selected from the population using some type of random mechanism, such as a random number generator."
        },
        {
         "code": "1.10.E.2",
         "text": "When observational units, or experimental units, in a sample are randomly selected from a population, it is appropriate to make generalizations about the entire population of individuals from which the sample was selected."
        },
        {
         "code": "1.10.E.3",
         "text": "A sample is not randomly selected when observational units are deliberately chosen or volunteer themselves to be in the sample."
        },
        {
         "code": "1.10.E.4",
         "text": "When observational units, or experimental units, in a sample are not randomly selected from a population, it is appropriate to make generalizations only about a population of individuals that are similar to those used in the study."
        }

     "code": "CED 1.11",
     "text": "Random sampling",
     "ek": [
      {
       "code": "1.11.A",
       "text": "Identify a sampling method given a description of a study. [Skill 2.A]",
       "eks": [
        {
         "code": "1.11.A.1",
         "text": "Sampling without replacement is a sampling strategy in which an observational unit from a population can be selected only once. The observational unit is not returned to the population before subsequent selections of observational units are made, so there is no chance that the observational unit can be selected again."
        },
        {
         "code": "1.11.A.2",
         "text": "Sampling with replacement is a sampling strategy in which an observational unit from the population can be selected more than once. The observational unit is returned to the population before subsequent selections of observational units are made, so it is possible that the observational unit could be selected again."
        },
        {
         "code": "1.11.A.3",
         "text": "In a simple random sample (SRS) of size n, every sample of the size n has the same chance of being selected. This method is the basis for many types of sampling mechanisms. There are several procedures to obtain a simple random sample; for example, using a random number generator or randomly selecting numbered slips of paper."
        },
        {
         "code": "1.11.A.4",
         "text": "A stratified random sample involves the division of all individuals in a population into non-overlapping groups, called strata, based on one or more shared attributes or characteristics (homogeneous grouping). Within each stratum a simple random sample is selected, and the selected individuals are combined to form one sample."
        },
        {
         "code": "1.11.A.5",
         "text": "A cluster random sample involves the division of a population into smaller groups, called clusters. Ideally, each cluster mirrors the heterogeneity of the population, with clusters similar to one another. A simple random sample of clusters is selected from the population to form the sample of clusters. Data are collected from all observational units in each of the selected clusters."
        },
        {
         "code": "1.11.A.6",
         "text": "A systematic random sample is a method in which sample members from a population are selected according to a random starting point and a fixed, periodic interval between successive sampling units."
        }
       ]
      },
      {
       "code": "1.11.B",
       "text": "Justify the appropriateness of a sampling method. [Skill 2.B]",
       "eks": [
        {
         "code": "1.11.B.1",
         "text": "Each random sampling method has different characteristics that make it more appropriate for sampling populations depending on the question being investigated."
        }
       ]
      }
     ]
    }

       "text": "Identify potential sources of bias in sampling methods. [Skill 2.A]",
       "eks": [

         "text": "Bias in a sampling method is a systematic error in the sampling procedure that results in a statistic being consistently larger or consistently smaller than the parameter the statistic is used to estimate."
        },
        {
         "code": "1.12.A.2",
         "text": "Voluntary response bias is a bias that may occur when a sample consists entirely of volunteers."
        },
        {
         "code": "1.12.A.3",
         "text": "Undercoverage bias may occur when the sampling method fails to include part of the population or a part of the population is less likely to be selected based on the sampling method."
        },
        {
         "code": "1.12.A.4",
         "text": "Nonresponse bias may occur because of a failure to obtain responses from some individuals chosen to be sampled. The respondents and nonrespondents could differ significantly in ways that are important for the study."
        },
        {
         "code": "1.12.A.5",
         "text": "Response bias may occur when responses to a survey or measurements of observational units tend to differ from the “true” value in one direction. Examples include questions that are confusing or leading (question wording bias) or self-reported responses."
        },
        {
         "code": "1.12.A.6",
         "text": "Nonrandom sampling methods (e.g., samples chosen by convenience or voluntary response) introduce potential bias because they do not use random chance to select the individuals."
        }
       ]

   "title": "Experimental Design",
   "topic": "Experimental Design.",
   "standards": [
    {
     "code": "CED 1.13",
     "text": "Experimental design (part A)",
     "ek": [
      {
       "code": "1.13.A",
       "text": "Identify elements of a well- designed experiment. [Skill 2.A]",
       "eks": [
        {
         "code": "1.13.A.1",
         "text": "A well-designed experiment should include the following: 1.13.A.1.i Comparisons of at least two treatment groups, one of which could be a control group 1.13.A.1.ii Random assignment of treatments to experimental units 1.13.A.1.iii Replication 1.13.A.1.iv Direct control of potential extraneous sources of variation in the response"
        },
        {
         "code": "1.13.A.2",
         "text": "A control group is a collection of experimental units that are created for comparison. A control group may be given a treatment different from the treatment of interest to determine if the treatment of interest has an effect (e.g., a treatment with an inactive substance, a placebo, may be given)."
        },
        {
         "code": "1.13.A.3",
         "text": "The placebo effect is the difference between the average response to a placebo and the average response to no treatment."
        },
        {
         "code": "1.13.A.4",
         "text": "In a single-blind, also called single-masked, experiment, participants do not know which treatment they are receiving, but members of the research team who interact with them know which treatment each participant is receiving, or vice versa."
        },
        {
         "code": "1.13.A.5",
         "text": "In a double-blind, also called double-masked, experiment, neither the participants nor the members of the research team who interact with them know which treatment each participant is receiving."
        },
        {
         "code": "1.13.A.6",
         "text": "An extraneous source of variation, also referred to as an extraneous variable, is a variable that is known (or believed) to affect the response but is not an explanatory variable being studied."
        },
        {
         "code": "1.13.A.7",
         "text": "The purpose of random assignment is to create treatment groups that are as similar as possible with respect to extraneous sources of variation. If random assignment is successful, the respective distributions of each extraneous variable will be approximately the same for all the treatment groups."
        },
        {
         "code": "1.13.A.8",
         "text": "A confounding variable in an experiment is a variable that is related to the explanatory variable in such a way that it is difficult to determine which variable, explanatory or confounding, is influencing the change in the response variable. However, in a well-designed experiment, the potential for confounding variables is reduced."
        },
        {
         "code": "1.13.A.9",
         "text": "Replication within an experiment means more than one experimental unit is assigned to each treatment."
        },
        {
         "code": "1.13.A.10",
         "text": "Direct control in an experiment means keeping the settings of certain potential extraneous sources of variation in the response variable the same from experimental unit to experimental unit."
        }
       ]
      },
      {
       "code": "1.13.B",
       "text": "Identify experimental designs. [Skill 2.A]",
       "eks": [
        {
         "code": "1.13.B.1",
         "text": "In a completely randomized design, treatments are assigned to experimental units completely at random. Often the number of experimental units assigned to each treatment will be the same, but the sample sizes in each treatment do not have to be the same."
        },
        {
         "code": "1.13.B.2",
         "text": "A blocking variable is a source of extraneous variation in the response variable. In a randomized block design, the experimental units are first grouped according to similar values of a blocking variable. These groups are called blocks. Units within the same block are homogeneous with respect to the blocking variable. After the blocks are formed, the treatments are randomly assigned to experimental units within each block so that all treatments occur within every block."
        },
        {
         "code": "1.13.B.3",
         "text": "The purpose of blocking is to separate the variation in the response caused by the blocking variable from the rest of the extraneous variation in the response. Blocking allows for more precise comparisons of the response across the treatments. Within a block, the treatments can be compared without having to worry about variation in the response caused by changes in the blocking variable."
        },
        {
         "code": "1.13.B.4",
         "text": "A matched pairs design is a randomized block design with only two treatments. Experimental units are arranged in pairs by matching on one or more extraneous sources of variation in the response variable. Each pair receives both treatments by randomly assigning one treatment to one member of the pair and the other treatment to the second member of the pair. Alternatively, each experimental unit may get both treatments while the order of the treatments is randomized."
        }
       ]
      },
      {
       "code": "1.13.C",
       "text": "Justify the appropriateness of a particular experimental design. [Skill 2.B]",
       "eks": [
        {
         "code": "1.13.C.1",
         "text": "One experimental design may be more appropriate than another experimental design based on the goals of the investigative study, the characteristics of the population, and the sample and variables involved."
        }
       ]
      },
      {
       "code": "1.13.D",
       "text": "Justify the appropriateness of the conclusions based on a well-designed experiment. [Skill 2.B]",
       "eks": [
        {
         "code": "1.13.D.1",
         "text": "Using random assignment of treatments to experimental units allows for cause-and-effect conclusions between the explanatory and the response variables because the potential for confounding variables is reduced."
        },
        {
         "code": "1.13.D.2",
         "text": "Depending on the experimental unit, it may be unethical or difficult to randomly select experimental units to participate in an experiment. In that case, the study’s experimental units are obtained from volunteers and will represent the population of experimental units similar to those who participated in the study."
        }
       ]
      }
     ]
    }
   ],
   "skills": [
    "Identify explanatory and response variables, treatments, experimental units and confounding.",
    "Distinguish an experiment from an observational study."
   ],
   "explainer": {
    "understandings": [
     "Random assignment, not random sampling, creates comparable groups.",
     "A control group gives a baseline for comparison."
    ],
    "misconceptions": [
     "Treating random sampling and random assignment as the same thing.",
     "Ignoring confounding variables in an observational study."
    ],
    "processes": [
     "List units, treatments and response, then say how treatments are assigned at random."
    ],
    "exam": [
     "Say what is randomly assigned and why that rules out confounding."
    ]
   },

        {
         "code": "1.13.A.2",
         "text": "A control group is a collection of experimental units that are created for comparison. A control group may be given a treatment different from the treatment of interest to determine if the treatment of interest has an effect (e.g., a treatment with an inactive substance, a placebo, may be given)."
        },
        {
         "code": "1.13.A.3",
         "text": "The placebo effect is the difference between the average response to a placebo and the average response to no treatment."
        },
        {
         "code": "1.13.A.4",
         "text": "In a single-blind, also called single-masked, experiment, participants do not know which treatment they are receiving, but members of the research team who interact with them know which treatment each participant is receiving, or vice versa."
        },
        {
         "code": "1.13.A.5",
         "text": "In a double-blind, also called double-masked, experiment, neither the participants nor the members of the research team who interact with them know which treatment each participant is receiving."
        },
        {
         "code": "1.13.A.6",
         "text": "An extraneous source of variation, also referred to as an extraneous variable, is a variable that is known (or believed) to affect the response but is not an explanatory variable being studied."
        },
        {
         "code": "1.13.A.7",
         "text": "The purpose of random assignment is to create treatment groups that are as similar as possible with respect to extraneous sources of variation. If random assignment is successful, the respective distributions of each extraneous variable will be approximately the same for all the treatment groups."
        },
        {
         "code": "1.13.A.8",
         "text": "A confounding variable in an experiment is a variable that is related to the explanatory variable in such a way that it is difficult to determine which variable, explanatory or confounding, is influencing the change in the response variable. However, in a well-designed experiment, the potential for confounding variables is reduced."
        },
        {
         "code": "1.13.A.9",
         "text": "Replication within an experiment means more than one experimental unit is assigned to each treatment."
        },
        {
         "code": "1.13.A.10",
         "text": "Direct control in an experiment means keeping the settings of certain potential extraneous sources of variation in the response variable the same from experimental unit to experimental unit."
        }
       ]
      },
      {
       "code": "1.13.B",
       "text": "Identify experimental designs. [Skill 2.A]",
       "eks": [
        {
         "code": "1.13.B.1",
         "text": "In a completely randomized design, treatments are assigned to experimental units completely at random. Often the number of experimental units assigned to each treatment will be the same, but the sample sizes in each treatment do not have to be the same."
        },
        {
         "code": "1.13.B.2",
         "text": "A blocking variable is a source of extraneous variation in the response variable. In a randomized block design, the experimental units are first grouped according to similar values of a blocking variable. These groups are called blocks. Units within the same block are homogeneous with respect to the blocking variable. After the blocks are formed, the treatments are randomly assigned to experimental units within each block so that all treatments occur within every block."
        },
        {
         "code": "1.13.B.3",
         "text": "The purpose of blocking is to separate the variation in the response caused by the blocking variable from the rest of the extraneous variation in the response. Blocking allows for more precise comparisons of the response across the treatments. Within a block, the treatments can be compared without having to worry about variation in the response caused by changes in the blocking variable."
        },
        {
         "code": "1.13.B.4",
         "text": "A matched pairs design is a randomized block design with only two treatments. Experimental units are arranged in pairs by matching on one or more extraneous sources of variation in the response variable. Each pair receives both treatments by randomly assigning one treatment to one member of the pair and the other treatment to the second member of the pair. Alternatively, each experimental unit may get both treatments while the order of the treatments is randomized."
        }
       ]
      },
      {
       "code": "1.13.C",
       "text": "Justify the appropriateness of a particular experimental design. [Skill 2.B]",
       "eks": [
        {
         "code": "1.13.C.1",
         "text": "One experimental design may be more appropriate than another experimental design based on the goals of the investigative study, the characteristics of the population, and the sample and variables involved."
        }
       ]
      },
      {
       "code": "1.13.D",
       "text": "Justify the appropriateness of the conclusions based on a well-designed experiment. [Skill 2.B]",
       "eks": [
        {
         "code": "1.13.D.1",
         "text": "Using random assignment of treatments to experimental units allows for cause-and-effect conclusions between the explanatory and the response variables because the potential for confounding variables is reduced."
        },
        {
         "code": "1.13.D.2",
         "text": "Depending on the experimental unit, it may be unethical or difficult to randomly select experimental units to participate in an experiment. In that case, the study’s experimental units are obtained from volunteers and will represent the population of experimental units similar to those who participated in the study."
        }
       ]
      }
     ]
    }
