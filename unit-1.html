 symbol n."}, {"code": "1.1.A.6", "text": "Each component of a statistical study and the resulting calculations can be related to an aspect of the corresponding real-world context from which the components were derived. This identification of a statistical result with the corresponding contextual component is what is meant by “in context.”"}]}, {"code": "1.1.B", "text": "Determine an investigative question within a statistical study. [Skill 1.A]", "eks": [{"code": "1.1.B.1", "text": "An investigative question for a specific study should have a defined purpose and should not be changed based on the data analysis or results."}, {"code": "1.1.B.2", "text": "An investigative question should be posed so that the required data can be collected and analyzed."}]}]}, {"code": "CED 1.2", "text": "Variables", "ek": [{"code": "1.2.A", "text": "Identify observational units, variables, parameters, and statistics from a statistical study or data set. [Skill 2.A]", "eks": [{"code": "1.2.A.1", "text": "An observational unit is an item or individual from which a datum is collected."}, {"code": "1.2.A.2", "text": "A variable is a characteristic that may change from one observational unit to another."}, {"code": "1.2.A.3", "text": "Data collected on numerical and categorical variables measured on observational units, including photographs, sounds, videos, and text, can convey meaningful information."}, {"code": "1.2.A.4", "text": "A parameter is a numerical attribute or summary of the variable of interest for a population."}, {"code": "1.2.A.5", "text": "A statistic is a numerical attribute or summary of the variable of interest for a sample. The value of a statistic from a certain sample is often not equal to the unknown value of the population parameter but may provide the basis for making inferences about the population parameter."}]}, {"code": "1.2.B", "text": "Identify types of variables. [Skill 2.A]", "eks": [{"code": "1.2.B.1", "text": "A categorical variable, also called a qualitative variable, takes on values that are category names or group labels."}, {"code": "1.2.B.2", "text": "A quantitative variable, also called a numerical variable, takes on numerical values for a measured or counted quantity and generally has units of measure."}]}, {"code": "1.2.C", "text": "Identify types of quantitative variables. [Skill 2.A]", "eks": [{"code": "1.2.C.1", "text": "A discrete quantitative variable can take on a countable number of values. The number of values may be finite or countably infinite, as with the whole numbers."}, {"code": "1.2.C.2", "text": "A continuous quantitative variable can take on an infinite number of possible values within a given interval. The number of values the variable can take on is measurable but not countable. This variable can take on all possible values between any pair of values."}]}]}], "skills": ["Write an investigative question and identify the population and sample.", "Classify variables as categorical or quantitative, and identify individuals."], "understandings": ["Statistics answers a question about a population using data from individuals.", "The type of variable decides which summaries and graphs are allowed."], "misconceptions": ["Numbers used as labels (zip codes, jersey numbers) are categorical, not quantitative.", "Confusing the individuals with the variables recorded on them."], "processes": ["State the question, identify individuals, then name each variable and its type."], "exam": ["Name the variable in context and say categorical or quantitative; a bare type earns nothing."], "qr": "https://broth11.github.io/ap-stats/unit-1.html#L1", "files": {"F": [{"l": "1.A.1.APStats.Handout", "h": "https://drive.google.com/file/d/1sdZFolhblKZcKaP_Fco-E2Tt07CYPDOH/view", "k": "page", "x": ""}, {"l": "1.A.1.APStats.Handout.Key", "h": "https://drive.google.com/file/d/1llhVUTQStUzbuRaTeAS3MNeOaB_lWXiC/view", "k": "page", "x": ""}, {"l": "1.A.1.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1-8CXJsZI5VFU7voE04P1DLFl-CGWKXc5/view", "k": "page", "x": ""}, {"l": "1.A.1.APStats.MasteryChecks.Key", "h": "https://drive.google.com/file/d/1SkRu5cIjcshJmJ3UWseuo8eNhUzhCjiA/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=4-7iHgDKamQ", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 1.1", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=1", "k": "brain", "x": ""}, {"l": "Stats Hub 1.2", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=2", "k": "brain", "x": ""}, {"l": "Practice Library 1.A.1", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=1-a&question=a01", "k": "brain", "x": ""}]}}, {"id": "L2", "n": 2, "ln": 2, "code": "1.A.2", "part": "1A", "partTitle": "Exploring One-Variable Data", "title": "Describing a Categorical Variable", "summary": "Relative frequencies, bar charts and pie charts describe how a categorical variable is spread across its categories. You calculate and interpret them and describe the trend you see. The activity looks at why more elite athletes are born between January and June, and asks you to explain it.", "standards": [{"code": "CED 1.3", "text": "Tabular representation and summary statistics for one categorical variable", "ek": [{"code": "1.3.A", "text": "Construct categorical one-variable tabular representations. [Skill 3.A]", "eks": [{"code": "1.3.A.1", "text": "A frequency table shows the number of observational units in each category of a categorical variable."}, {"code": "1.3.A.2", "text": "A relative frequency table shows the proportion of observational units in each category of a categorical variable."}]}, {"code": "1.3.B", "text": "Describe categorical one-variable tabular representations with summary statistics. [Skill 4.A]", "eks": [{"code": "1.3.B.1", "text": "Percentages, relative frequencies, and ratios all provide the same information as proportions."}, {"code": "1.3.B.2", "text": "Counts and relative frequencies of categorical variables reveal information that can be used to justify claims about the variables in context."}]}]}, {"code": "CED 1.4", "text": "Graphical representations for one categorical variable", "ek": [{"code": "1.4.A", "text": "Construct categorical one-variable graphical representations. [Skill 3.A]", "eks": [{"code": "1.4.A.1", "text": "Bar charts, also called bar graphs, display frequencies (counts) or relative frequencies (proportions) for the categories of a single categorical variable. Each bar on a bar chart represents a category of the categorical variable of interest. The height or length of each bar corresponds to the frequency or relative frequency of the observational units in each category."}, {"code": "1.4.A.2", "text": "Pie charts are used to display frequencies (counts) or relative frequencies (proportions) for categorical data. Each slice on a pie chart represents a category of the categorical variable of interest. The area of each slice, as a fraction of the total area, corresponds to the relative frequency of observational units falling within each category. The sum of the slices’ areas together will equal 1, or 100% of the total area."}]}, {"code": "1.4.B", "text": "Justify a claim using categorical one-variable graphical representations. [Skill 4.B]", "eks": [{"code": "1.4.B.1", "text": "Graphical representations of a categorical variable reveal information that can be used to justify claims about the variable in context."}]}, {"code": "1.4.C", "text": "Compare multiple categorical one-variable tabular and graphical representations. [Skill 4.A]", "eks": [{"code": "1.4.C.1", "text": "Frequency and relative frequency tables, bar charts, and pie charts can be used to compare two or more data sets in terms of the same categorical variable."}]}]}], "skills": ["Build frequency and relative frequency tables.", "Draw and read bar charts and compare categories with relative frequency."], "understandings": ["Relative frequency lets groups of different sizes be compared.", "A good graph shows the categories and the proportion in each without distortion."], "misconceptions": ["Using counts to compare groups of different sizes.", "Calling a bar chart a histogram, or leaving bars in an order that suggests a trend."], "processes": ["Count each category, divide by the total, then graph with labelled axes."], "exam": ["Compare using relative frequencies and name the categories in context."], "qr": "https://broth11.github.io/ap-stats/unit-1.html#L2", "files": {"F": [{"l": "1.A.2.APStats.Handout", "h": "https://drive.google.com/file/d/1BEhqbC6Cr-sor4p5Sqjk5fvib_TLu_lq/view", "k": "page", "x": ""}, {"l": "1.A.2.APStats.Handout.Key", "h": "https://drive.google.com/file/d/1XDteieR1hQ3NcnSxHZRM_5ggAEABPj6Q/view", "k": "page", "x": ""}, {"l": "1.A.2.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/11uywzhrW2gQzxteq9ed5mtZnmoTBNyFn/view", "k": "page", "x": ""}, {"l": "1.A.2.APStats.MasteryChecks.Key", "h": "https://drive.google.com/file/d/1bRD6m9O1mQ6-z87KQD5ttgOQs95BjyiN/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=B93gfiZsQDg", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 1.3", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=3", "k": "brain", "x": ""}, {"l": "Stats Hub 1.4", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=4", "k": "brain", "x": ""}, {"l": "Practice Library 1.A.2", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=1-a&question=a11", "k": "brain", "x": ""}]}}, {"id": "L3", "n": 3, "ln": 3, "code": "1.A.3", "part": "1A", "partTitle": "Exploring One-Variable Data", "title": "Describing a Quantitative Variable", "summary": "Dotplots, stem-and-leaf plots and histograms show how a quantitative variable is distributed. You describe shape, center, spread and unusual features in context. The activity uses baseball team payrolls from the Moneyball season to show why Oakland's 2002 run was so unusual.", "standards": [{"code": "CED 1.5", "text": "Graphical representations for one quantitative variable", "ek": [{"code": "1.5.A", "text": "Construct quantitative one-variable graphical representations. [Skill 3.A]", "eks": [{"code": "1.5.A.1", "text": "Histograms, stem-and-leaf plots, and dotplots provide a visual representation of the distribution of the values of a quantitative variable. These graphs show the frequency or relative frequency of the quantitative variable values or intervals of values and maintain the natural ordering, smallest to largest, of the quantitative variable."}, {"code": "1.5.A.2", "text": "A histogram places the observed values of the quantitative variable into ordered intervals, or bins, along the horizontal axis. Each bar represents an interval or bin, and the height of each bar shows the frequency or relative frequency of the observations within that interval. Altering the interval widths, or bin widths, can change the appearance of the histogram. Alternatively, a histogram can be constructed with bins on the vertical axis with bars appearing horizontally."}, {"code": "1.5.A.3", "text": "A stem-and-leaf plot splits each value of the quantitative variable into two parts: a “stem” (the first digit or digits) and a “leaf” (usually the single digit after the stem digit or digits). Both stems and leaves are ordered from smallest to largest."}, {"code": "1.5.A.4", "text": "A dotplot represents each value of the quantitative variable by a dot. Each dot is placed above the horizontal or beside the vertical axis corresponding to the value of that observation, with nearly identical values stacked on top of each other."}]}]}, {"code": "CED 1.6", "text": "Descriptions for one quantitative variable distributions", "ek": [{"code": "1.6.A", "text": "Describe distributions of quantitative one-variable graphical representations. [Skill 4.A]", "eks": [{"code": "1.6.A.1", "text": "Descriptions of the distribution of one quantitative variable include shape, center, and variability (spread) as well as any unusual features such as outliers, gaps, or clusters in context."}, {"code": "1.6.A.2", "text": "The shape of the distribution of one quantitative variable is skewed to the right (positively skewed) if the right tail (toward larger values) is longer than the left. The shape of the distribution is skewed to the left (negatively skewed) if the left tail (toward smaller values) is longer than the right. The shape of the distribution is approximately symmetric if the left half is approximately the mirror image of the right half."}, {"code": "1.6.A.3", "text": "Distributions of one quantitative variable with one main peak are called unimodal. Distributions with two prominent peaks are called bimodal. A distribution in which each frequency or each relative frequency is approximately the same with no prominent peaks is approximately uniform."}, {"code": "1.6.A.4", "text": "Outliers for one quantitative variable are data points that are unusually small or large relative to the rest of the data."}, {"code": "1.6.A.5", "text": "A gap is a region in a distribution between two values in which there are no observed data."}, {"code": "1.6.A.6", "text": "Clusters are concentrations of values usually separated by gaps."}]}, {"code": "1.6.B", "text": "Justify a claim using distributions of quantitative one-variable graphical representations. [Skill 4.B]", "eks": [{"code": "1.6.B.1", "text": "Graphical representations of a quantitative variable may reveal information that can be used to justify claims about the variable in context."}]}]}], "skills": ["Make and read dotplots, stemplots and histograms.", "Describe shape, center, variability and unusual features (SOCV) in context."], "understandings": ["A description has four parts: shape, center, variability, unusual features, all in context.", "Histogram bin width changes the look, not the data."], "misconceptions": ["Describing the graph (tall bar on the left) instead of the distribution.", "Calling a distribution skewed toward the side with the tail's opposite, mixing up skew direction."], "processes": ["Identify the overall pattern, then check the center, spread and any gaps or outliers."], "exam": ["Every description needs context and comparative language; a list of numbers is not a description."], "qr": "https://broth11.github.io/ap-stats/unit-1.html#L3", "files": {"F": [{"l": "1.A.3.APStats.Data", "h": "https://docs.google.com/spreadsheets/d/1EQWBP8FsXQy0r6bng4CAX2xRUJrkmzyIHDBqjcTCV5E/view", "k": "page", "x": "gsheet"}, {"l": "1.A.3.APStats.Data", "h": "https://drive.google.com/file/d/1v5g7So1yxYA0gmCe_n93S74XH0IiUx2l/view", "k": "page", "x": "xlsx"}, {"l": "1.A.3.APStats.Handout", "h": "https://drive.google.com/file/d/10yhSxg3PRsAGZNGhBwwRY5z4DXYR57zH/view", "k": "page", "x": ""}, {"l": "1.A.3.APStats.Handout.Key", "h": "https://drive.google.com/file/d/1QxjFO1evIrywSkwR2ttZ8ss5bWUmrr6f/view", "k": "page", "x": ""}, {"l": "1.A.3.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1FZsBRoa28ZG_p1CxSPnROghm7aibyW1p/view", "k": "page", "x": ""}, {"l": "1.A.3.APStats.MasteryChecks.Key", "h": "https://drive.google.com/file/d/1pq83-18B3VwnqkRr0DZVlNiF7N1Xg0Td/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=49LBE76yx7c", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 1.5", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=5", "k": "brain", "x": ""}, {"l": "Stats Hub 1.6", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=6", "k": "brain", "x": ""}, {"l": "Practice Library 1.A.3", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=1-a&question=a21", "k": "brain", "x": ""}]}}, {"id": "L4", "n": 4, "ln": 4, "code": "1.A.4", "part": "1A", "partTitle": "Exploring One-Variable Data", "title": "Measures of Center & Spread", "summary": "The mean and median measure center, and the range, IQR, variance and standard deviation measure spread. You also use percentiles to place a value in a data set. The activity compares home prices from 1970 and 2024 to show wages have not kept pace, and asks how to preserve the American Dream.", "standards": [{"code": "CED 1.7", "text": "Summary statistics for one quantitative variable (center, spread, outliers)", "ek": [{"code": "1.7.A", "text": "Calculate measures of center and position for quantitative data. [Skill 3.B]", "eks": [{"code": "1.7.A.1", "text": "Two commonly used measures of center in the distribution of a quantitative variable are the mean and median."}, {"code": "1.7.A.2", "text": "", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA1sAAAD1CAAAAACDqbDaAAA4c0lEQVR42u2dd2AVVd7+P7lAQgIk9N5rIChIpEmREnpRkC4qEBULCOLCatRYEQsgRaQIGxCkCoIQkE7oYKL7c19R33UVX1dBFBuu4qo8vz/mlpm59yYBkjVxz/MH3HvOme+c8808986cOfO5EcLov1wR5hjIF3lMCoyMjLeMjIy3jIyMt0wKjIyMt4yMCpGKWv8dCpS0I+t8u3zZ16F2l1Z3edr1efnewbuLbhFin5fQiUvp95u/tvX2IFygsFH9FfmXL6M8kyRpmK1gluKtwrzWcsaGrUtjkvJHzYGjQaUkSGvd/Ulmw8VGX5vNmMKqeqS3B+GS8wKpobccxvZ8yBcyyg9Z31udSgAHP+hUD4jPLxcXiSwWorRs8c/z86Nj1F8HJZ9vnUOjA50GrvtPf6ZFRuUiOUaF/5xw7Fjgpg+Gjc3PXQ0fHqr0t1/zdXwHPblwjS789h9P/M+5SY7RH+B6K1hriw70vdx4YaCz7vjH1dsB278f7CvZ9n113wXA3jNFb/C3PHKydC935K3fxPYLucvtZ2t08L48drKU4yJp36mogSG32cj1AGvLdHM46rNY727PlbSXO/oWWpvOD/W93HOmfFKYVtvPluoXNoQtGe6xHvq0TI9c79+Z+bXFBriabj5fr4U5ggv69ZYkaSQLrBfxaCAQPV+S1CsC6OxvleBRd6CnXqsG3CRJGh8NNNgmSc+VBegvSZ4OR1oAVfd7t3zVc5ekicUBz2hv2VAPeDzNlMakFZWANpKk3QlA5K3+fS6qBNBeUpanp9VFj7TMc/9LcVBqnUZEQLVtgWuX2kDxW/3hu3nLbX1zXG9V94DHc5eSWf9AFJAsSZpXCSg707vtDZ5U7yA6SaMjgcgU3/XWUM8eSVriud+VDOdYpYNXAFXWVo+U5GmmGZ6uVnmJOG9yNCUSGDzdut6yZ74fUPwR+/XWcyWAayXV9KRLkqZ47jPXWwVJob3VvOHUFROKlJSk2sWnHj76dFRDX6t4rmoya3ETBkVev+SF6iyQdD1j9mhZjeJvSqtJXHMsvTsPSKJ2ua6zl/Yn0X7dP4V+mw5v7MqjVtmKlKgSKSmzlMaVxUYtnp/APZL2RdVckrkvmZHeDTeRsPzgzrvoJmXSXZJUHymNZsXuePneiEpdKj/+yihq+3r4IrXnbHu5M12lFSklolJSFlnljr7ZvTUtmSYpKeuVTPPSk5dPK8saSdPpsFFb2vtysgErAwNZrHEM2XZsZQPSvTEGsVuSXmKKMxmusUplSd74ypDI4r65 AAAAAElFTkSuQmCC"}, {"code": "1.7.A.3", "text": "The median is the middle value when the data set is ordered from smallest to largest and can be found with and without using technology. One common method for determining the median of a data set with an even number of values is to use the mean of the two middle values. A common method for determining the median of a data set with an odd number of values is to use the value in the middle of all the values."}, {"code": "1.7.A.4", "text": "In an ordered data set, the smallest value is the minimum value, and the largest value is the maximum value."}, {"code": "1.7.A.5", "text": "The first quartile, denoted by Q1, is the median value of the lower half of the ordered data set from the minimum value to the position of the median. Approximately 25% of the values in the data set are less than or equal to Q1. The third quartile, denoted by Q3, is the median value of the upper half of the ordered data set from the position of the median to the maximum value. Approximately 75% of the values in the data set are less than or equal to Q3. The second quartile, Q2, is also the median of the data set. Q1 and Q3 form the boundaries for the middle 50% of values in an ordered data set."}, {"code": "1.7.A.6", "text": "The pth percentile is the value that has p% of the data less than or equal to it when the data set is ordered from smallest to largest. The first and third quartiles are the 25th and 75th percentiles, respectively."}]}, {"code": "1.7.B", "text": "Calculate measures of variability for quantitative data. [Skill 3.B]", "eks": [{"code": "1.7.B.1", "text": "Three commonly used measures of variability (or spread) in the distribution of a quantitative variable are the range, interquartile range, and standard deviation."}, {"code": "1.7.B.2", "text": "The range is the difference between the maximum data value and the minimum data value."}, {"code": "1.7.B.3", "text": "The interquartile range (IQR) is the difference between the third  standard deviation are considered nonresistant (or non- robust) measures of variability."}, {"code": "1.7.F.2", "text": "Summary statistics of a quantitative variable may reveal information that can be used to justify claims about the variable in context."}]}]}], "skills": ["Compute and interpret mean, median, standard deviation, IQR and range.", "Identify outliers with the 1.5 IQR rule and judge which summary suits the shape."], "understandings": ["Resistant measures (median, IQR) are preferred for skewed data or outliers.", "Standard deviation measures typical distance from the mean."], "misconceptions": ["Using the mean and standard deviation for a strongly skewed distribution.", "Interpreting standard deviation as the average of the values."], "processes": ["Enter data in lists, run 1-Var Stats, then apply the 1.5 IQR fences by hand."], "exam": ["Interpret the statistic in context, not just state it; justify the choice of center and spread with shape."], "qr": "https://broth11.github.io/ap-stats/unit-1.html#L4", "files": {"F": [{"l": "1.A.4.APStats.Handout", "h": "https://drive.google.com/file/d/16M5xU3XNPU5zaSnYa400psmHXtlOv5ZU/view", "k": "page", "x": ""}, {"l": "1.A.4.APStats.Handout.Key", "h": "https://drive.google.com/file/d/1qoP_HzIzjEpaNZIrdCYJM-7n4xgUpQ9P/view", "k": "page", "x": ""}, {"l": "1.A.4.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1q3K0FUPHGKx3hi3q5GtF_vjZonBCng7_/view", "k": "page", "x": ""}, {"l": "1.A.4.APStats.MasteryChecks.Key", "h": "https://drive.google.com/file/d/1ybZLYBGYRI5AZXpRyQZnhSIrO8Wnz1D0/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=U_hjKd8LBtg", "k": "video", "x": ""}, {"l": "Optional video (measures by hand)", "h": "https://www.youtube.com/watch?v=YhrCbU0ORsA", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 1.7", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=7", "k": "brain", "x": ""}, {"l": "Practice Library 1.A.4", "h": "h in the distribution of a quantitative variable are the range, interquartile range, and standard deviation."}, {"code": "1.7.B.2", "text": "The range is the difference between the maximum data value and the minimum data value."}, {"code": "1.7.B.3", "text": "The interquartile range (IQR) is the difference between the third and first quartiles: Q3 − Q1."}, {"code": "1.7.B.4", "text": "", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAh0AAAFFCAAAAABtPgA8AABBh0lEQVR42u2dZ2BVxdaG35yE9AKhQ+gBAwEpoTeBhF6kNxECQaIoEEBQo1K8FCkighQphk4IvSRIJ6TQEr2X74p6rwX1KjZQQAUVs74fs8/eM7ucAmnKrB9wzrQ9s87KLjP7mdeDIE2ahdmkC6TJ6JAmo0OajA5pMjqkFbl5sf+ytJQSzZHVJl+P4aS5i3dbuV7h3dtt7uUYDmrm21AMeW4VzsdO5qMRERH/WFuRkjCF8tHexAyH+WHeblSIhGnyZsQ764ZFTbcsHpst8yYZ8tDJ7Ybyo5P5aMq5Iw7Ar9uDBwEo6Xpk9U4727yQg9nHW5cQ6vs1AE/vEm7XNLNXX1w82UF2CW/P/BmGoSHFlS51stCvLOsAYHvoOvcq/5lX6HNpuYY+3AWAYcPcr2lmeXl5jrKXL8+nYRgaUlyZi+IYHUY7cq1KO+Xjye/KxPBZp6/69DeUDuqtfjl6Lcxedf+dIWryqe+8Buivvl+W6iqm8BWwL6+/VfcO3ioXY5Z+/IdynbRvKV6GBnI+RWX+2n7uq7tVWznz0sE7tZoICQf+7Gc6dDXxerXW6he9/zgz8Qmz3V6PwsyhRXLfwa6T1dn/SZiypTyAlkREtKI8gNAlaqk15QGgLdEyG2Cz2YhotDcA70Qi2mh7flsFtep0bwCDFmMGES0KBYA+RES2dmfqoyZRZgMAFVO4+w6+AnX3ANCRiCrb3iEiosm2F6mFjYioPQCUSSYaYgNstoa0yzaeiOjFEABlFxMRRdpooAfgt8redgsbEZ1qAADV0uyJqeEAUC+Xfcu1ecDDZtv6hu0RlhAUSBttzy8IAPAI68FWIqJeHgBiiIShc/cdG8sCaLKX3Xeo/htgY7dTu2wdlIZUn6iuZMPLbgn7AUSHFraZR8fDJWLXrYrERCJajHb76FBbrFYK7Ufk5sxj49GZ0hPrID4xkegZDD58flttpBIloYlWdTLCVxxaXDEYM4iSEbXjfGoXvEBEqFGy5pj5RKGI27d1sLevGh18BaruOzf73Ks+dYimYAwREVWyEUWBiBp7vnQ66/WgUkRbEn0CEhOXUgriiegxtN94+M2amEFEEWhWZ+6WSZ6B9sajQEQhpV4/lb7YP9Se6FduVdbJBLRXviZ2RrfExAtUChfZ7fFQSkKNgMTUbe1QX42AcIzatXMgokgYuhYdOz2CZh1a0ywYnQT/7UEdIiLqj3WssOYT1ZVRIKLswICXUveMQUXSObSYRAfWExF51CAiPzakgMpKoTicJiIaGEVE3XGOiOiZIUREBzFMV9VWhoiIymIG0ZudWTNViAgYSkQ0ColERC9AjQ6+wgQWj1PwBpFHSSKineiuuG/ALCKi57CCiILLEhGLjt1oTEREgV5EFMG+jMBbXHQkYQ4R0cKHDrO0oz13EhG1Ub0wF4uJiBIwgYioLQ5TErCDiKgJ1igRMJlltsZeYehadIQjlYioAzqJ/quBE0REPqWVwrxPFFdGgYiaYyt7CIrVObSYREdPIiKq6EW0mP2E1B2Z9ge3JLWCM The median and IQR are considered a resistant (or robust) measure of center and measure of variability, respectively, because outliers do not greatly (if at all) affect their values. Because outliers can affect their values greatly, the mean is considered a nonresistant (or non-robust) measure of center, and the range and standard deviation are considered nonresistant (or non- robust) measures of variability."}, {"code": "1.7.F.2", "text": "Summary statistics of a quantitative variable may reveal information that can be used to justify claims about the variable in context."}]}]}, {"code": "CED 1.8", "text": "Graphical representations of summary statistics", "ek": [{"code": "1.8.A", "text": "Construct quantitative one-variable graphical representations of summary statistics. [Skill 3.A]", "eks": [{"code": "1.8.A.1", "text": "A five-number summary is made up of the minimum data value, the first quartile (Q1), the median, the third quartile (Q3), and the maximum data value."}, {"code": "1.8.A.2", "text": "A boxplot is a graphical representation of the five-number summary (minimum, first quartile, median, third quartile, maximum). The box represents the middle 50% of data, with a line at the median and the ends of the box corresponding to the quartiles. Lines (“whiskers”) that represent 25% of the data extend from the first quartile to the minimum and from the third quartile to the maximum. If there are outliers in the data, the whiskers extend to the most extreme data values that are not outliers, and outliers are usually denoted with an asterisk or other symbol."}]}, {"code": "1.8.B", "text": "Describe quantitative one-variable graphical representations of summary statistics based on the relationship of the mean and the median. [Skill 4.A]", "eks": [{"code": "1.8.B.1", "text": "If a distribution is relatively symmetric, then the values of the mean and median are relatively close to each other. If a distribution is skewed right, then the value of the mean is usually larger than the median. If the distribution is skewed left, then the value of the mean is usually smaller than the median."}]}]}], "skills": ["Draw and read boxplots using the five-number summary.", "Compute and interpret percentiles and z-scores."], "understandings": ["A boxplot shows spread through quartiles, and each section holds about a quarter of the data.", "A z-score counts standard deviations from the mean."], "misconceptions": ["Reading box length as the amount of data in it, or reading a boxplot's tall whisker as more data.", "Calling a z-score the percentile."], "processes": ["Find the five-number summary, mark fences, plot outliers separately, then draw whiskers to the last non-outlier."], "exam": ["Percentile and z-score interpretations need a full sentence in context."], "qr": "https://broth11.github.io/ap-stats/unit-1.html#L5", "files": {"F": [{"l": "1.A.5.APStats.Handout", "h": "https://drive.google.com/file/d/1aY1Aa3Gh_tg2OTg_khUYaHAUfL2OEgiJ/view", "k": "page", "x": ""}, {"l": "1.A.5.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1ACjzpzxKKRgZDgEauYfTAdRYhRrGwHdu/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=jy6SqcuHDLA", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 1.7", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=7", "k": "brain", "x": ""}, {"l": "Stats Hub 1.8", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=8", "k": "brain", "x": ""}, {"l": "Practice Library 1.A.5", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=1-a&question=a41", "k": "brain", "x": ""}]}}, {"id": "L6", "n": 6, "ln": 6, "code": "1.A.6", "part": "1A", "partTitle": "Exploring One-Variable Data", "title": "Comparing Graphs & Z-Scores", "summary": "Comparing distributions means addressing shape, center and spread together, and z-scores let you compare values from different scales. You use both to compare players from different basketball eras. The activity is a debate on who is the greatest NBA scorer of all time, settled with data.", "standards": [{"code": "CED 1.9", "text": "Comparisons of the distributions for one quantitative variable", "ek": [{"code": "1.9.A", "text": "Compare multiple quantitative one-variable graphical representations. [Skill 4.A]", "eks": [{"code": "1.9.A.1", "text": "Graphical representations of a quantitative variable can be used to compare important features between two or more distributions of the same quantitative variable. Histograms, back-to-back stem-and-leaf plots, and dotplots may be used to compare center, variability, shape, outliers, clusters, or gaps in two or more distributions. Boxplots may be used to compare center, variability, outliers, and skewness (or symmetry)."}]}, {"code": "1.9.B", "text": "Compare multiple quantitative one-variable graphical representations of summary statistics. [Skill 4.A]", "eks": [{"code": "1.9.B.1", "text": "A comparison of graphical representations for two or more distributions can include any of the numerical summaries (e.g., mean, standard deviation, etc.)."}]}, {"code": "1.9.C", "text": "Justify a claim using multiple quantitative one-variable graphical representations. [Skill 4.B]", "eks": [{"code": "1.9.C.1", "text": "Multiple quantitative one-variable graphical representations may reveal information that can be used to justify claims about the variable in context."}]}, {"code": "1.9.D", "text": "Calculate z-scores with population parameters. [Skill 3.B]", "eks": [{"code": "1.9.D.1", "text": "A standardized score measures the number of standard deviations a data value falls above or below the mean."}, {"code": "1.9.D.2", "text": "", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAh0AAAE+CAAAAAAM2/0+AABARUlEQVR42u2dd2AVVfr+P7lptCR0RHqTAIoCSgchBJCqKAiIJRCERVFRJLpRQVRAURBBBCkiRUroJSCdEEBKcL/L/mR111W3iQ0LuC66yvv7Y2buPWfKTSiJF5nnn9w7Z+a0++bemTPzeZ8owZcvDwX8KfDlR4cvPzp8+dHhy48OX350+PKjw5cfHb786PDlR4cvX350+PKjI7z21aoOcF3 or between distributions."}]}]}], "skills": ["Compare two or more distributions on shape, center, spread and outliers.", "Choose a graph that supports the comparison."], "understandings": ["Comparison needs both distributions addressed in the same sentence.", "Side-by-side graphs on a common scale make shape, center and spread directly comparable."], "misconceptions": ["Describing each group separately with no comparing words.", "Comparing only the centers."], "processes": ["Draw on a shared axis, then write one comparing sentence each for shape, center, spread and outliers."], "exam": ["Use words like higher, more variable, both skewed right; this is where FRQ marks are lost."], "qr": "https://broth11.github.io/ap-stats/unit-1.html#L6", "files": {"F": [{"l": "1.A.6.APStats.Data", "h": "https://docs.google.com/spreadsheets/d/1d-dEitDtn2qt2Hq50yDS7hT1VzUSY9UkChQPder99w4/view", "k": "page", "x": "gsheet"}, {"l": "1.A.6.APStats.Data", "h": "https://drive.google.com/file/d/1ycbnpouJ3R7zCEXFX4Bib85J2CngmFOJ/view", "k": "page", "x": "xlsx"}, {"l": "1.A.6.APStats.Handout", "h": "https://drive.google.com/file/d/1wq0rOtkbwLdhWFGEDVo9JwsTomG5R5Qn/view", "k": "page", "x": ""}, {"l": "1.A.6.APStats.Handout.Key", "h": "https://drive.google.com/file/d/1gm25J4V-UwgyCfCiCsdrMW_u2bPSKTmr/view", "k": "page", "x": ""}, {"l": "1.A.6.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/19dfuhtutcGreSz-L_S2HiVHnYopplq7N/view", "k": "page", "x": ""}, {"l": "1.A.6.APStats.MasteryChecks.Key", "h": "https://drive.google.com/file/d/18b8LbKSL9O-GlDhW-eVs-cib0jmh9oRo/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=g0U-eOE9n2s", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 1.9", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=9", "k": "brain", "x": ""}, {"l": "Practice Library 1.A.6", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=1-a&question=a51", "k": "brain", "x": ""}]}}, {"id": "L7", "n": 7, "ln": 1, "code": "1.B.1", "part": "1B", "partTitle": "Collecting Data", "title": "Types of Studies", "summary": "The way a study is designed decides what conclusions it can support. You compare observational studies and experiments, spot confounding variables, and judge when causal claims and generalizing are allowed. The activity uses Covid-19 data to ask how we know vaccines work.", "standards": [{"code": "CED 1.10", "text": "The investigative question revisited and data collection", "ek": [{"code": "1.10.A", "text": "Determine the components of an investigative question within a statistical study. [Skill 1.A]", "eks": [{"code": "1.10.A.1", "text": "The first component of an investigative question should guide the data collection process and should be phrased in terms of the variable(s) of interest in the study."}, {"code": "1.10.A.2", "text": "The second component of an investigative question should guide the data analysis choice. 1.10.A.2.i In the case of a hypothesis test, the investigative question should make clear the parameter and the direction of the alternative hypothesis (i.e., not equal, greater than, less than, association, not independent). 1.10.A.2.ii In the case of a confidence interval, the investigative question should make clear the parameter and the goal of estimation of that parameter within a range of potential values."}, {"code": "1.10.A.3", "text": "The third component of an investigative question should indicate the type(s) of conclusion(s) applicable from the study. The investigative question should provide the population to which the conclusions will be applicable and, in the case of an experiment that uses random assignment, a cause-and-effect conclusion."}]}, {"code": "1.10.B", "text": "Identify a census. [Skill 2.A]", "eks": [{"code": "1.10.B.1", "text": "A census consists of recording information from all items or individuals in a population."}]}, {"code": "1.10.C", "text": "Identify an experiment. [Skill 2.A]", "eks": [{"code": "1.10.C.1", "text": "An experiment is a study in which a researcher assigns conditions, or treatments, to experimental units to explore an investigative question of interest about the population."}, {"code": "1.10.C.2", "text": "The experimental unit is the observational unit to which the treatment is assigned. When experimental units consist of people, they are sometimes referred to as subjects or participants."}, {"code": "1.10.C.3", "text": "An explanatory variable, or factor, is a variable whose different categories, or levels, are imposed on the experimental units. The different categories, or levels, of the explanatory variable are called treatments. When there is more than one explanatory variable, the combinations of the categories, or levels, of the explanatory variables are called treatments."}, {"code": "1.10.C.4", "text": "A response variable is an outcome measured on each experimental unit after the treatment has been administered."}]}, {"code": "1.10.D", "text": "Identify an observational study. [Skill 2.A]", "eks": [{"code": "1.10.D.1", "text": "An observational study is a study where treatments are not imposed. The researcher records the values of the variables of interest in order to explore an investigative question of interest."}, {"code": "1.10.D.2", "text": "A prospective study is one in which the observational units of study are selected at a point in time, and data are gathered both at that time and into the future."}, {"code": "1.10.D.3", "text": "A retrospective study is one in which the observational units of study are selected at a point in time and data from the past are gathered."}, {"code": "1.10.D.4", "text": "A survey is an observational study in which the data are collected from humans using a standard set of questions."}, {"code": "1.10.D.5", "text": "A confounding variable in an observational study provides an alternative explanation for the observed relationship between the explanatory and response variables determined in the study, thereby reducing the possibility of concluding a causal relationship between the explanatory and response variables of interest. To be a confounding variable, a variable must be associated with both the explanatory variable and the response variable."}]}, {"code": "1.10.E", "text": "Justify the appropriateness of generalizations for a statistical study. [Skill 2.B]", "eks": [{"code": "1.10.E.1", "text": "A sample is considered random when all observational units in the sample are selected from the population using some type of random mechanism, such as a random number generator."}, {"code": "1.10.E.2", "text": "When observational units, or experimental units, in a sample are randomly selected from a population, it is appropriate to make generalizations about the entire population of individuals from which the sample was selected."}, {"code": "1.10.E.3", "text": "A sample is not randomly selected when observational units are deliberately chosen or volunteer themselves to be in the sample."}, {"code": "1.10.E.4", "text": "When observational units, or experimental units, in a sample are not randomly selected from a population, it is appropriate to make generalizations only about a population of individuals that are similar to those used in the study."}]}]}], "skills": ["Choose a data collection method (survey, observational study, experiment) that fits the question.", "Define population, sample and parameter versus statistic."], "understandings": ["The way data are collected decides what conclusions are allowed.", "Only a randomized experiment can support cause and effect."], "misconceptions": ["Using observational data to claim causation.", "Mixing up parameter and statistic."], "processes": ["Match the question to the design, then state the population the conclusion applies to."], "exam": ["Conclusions must match the design: generalizing needs random sampling, causation needs random assignment."], "qr": "https://broth11.github.io/ap-stats/unit-1.html#L7", "files": {"F": [{"l": "1.B.1.APStats.Handout", "h": "https://drive.google.com/file/d/1_qZjRCe_MhtCVyNhASdZ2CH9IQ9LGOBe/view", "k": "page", "x": ""}, {"l": "1.B.1.APStats.Handout.Key", "h": "https://drive.google.com/file/d/19T6UeNQy2W-KFWspi62GbK6fuX9aKdmw/view", "k": "page", "x": ""}, {"l": "1.B.1.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1BvqzaChMuaEswROgdIi_SnYEwc1t_lve/view", "k": "page", "x": ""}, {"l": "1.B.1.APStats.MasteryChecks.Key", "h": "https://drive.google.com/file/d/1aaSz_SKz8EtEc06BDFztC7CqQkq8FIop/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=-GVqAyZ7a38", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 1.10", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=10", "k": "brain", "x": ""}, {"l": "Practice Library 1.B.1", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=1-b&question=c01", "k": "brain", "x": ""}]}}, {"id": "L8", "n": 8, "ln": 2, "code": "1.B.2", "part": "1B", "partTitle": "Collecting Data", "title": "Random Sampling", "summary": "Simple, stratified, cluster and systematic random samples each select a sample by chance in a different way. You describe each method and tell bias from variation. The activity uses income data from your own city to ask what middle income means.", "standards": [{"code": "CED 1.11", "text": "Random sampling", "ek": [{"code": "1.11.A", "text": "Identify a sampling method given a description of a study. [Skill 2.A]", "eks": [{"code": "1.11.A.1", "text": "Sampling without replacement is a sampling strategy in which an observational unit from a population can be selected only once. The observational unit is not returned to the population before subsequent selections of observational units are made, so there is no chance that the observational unit can be selected again."}, {"code": "1.11.A.2", "text": "Sampling with replacement is a sampling strategy in which an observational unit from the population can be selected more than once. The observational unit is returned to the population before subsequent selections of observational units are made, so it is possible that the observational unit could be selected again."}, {"code": "1.11.A.3", "text": "In a simple random sample (SRS) of size n, every sample of the size n has the same chance of being selected. This method is the basis for many types of sampling mechanisms. There are several procedures to obtain a simple random sample; for example, using a random number generator or randomly selecting numbered slips of paper."}, {"code": "1.11.A.4", "text": "A stratified random sample involves the division of all individuals in a population into non-overlapping groups, called strata, based on one or more shared attributes or characteristics (homogeneous grouping). Within each stratum a simple random sample is selected, and the selected individuals are combined to form one sample."}, {"code": "1.11.A.5", "text": "A cluster random sample involves the division of a population into smaller groups, called clusters. Ideally, each cluster mirrors the heterogeneity of the population, with clusters similar to one another. A simple random sample of clusters is selected from the population to form the sample of clusters. Data are collected from all observational units in each of the selected clusters."}, {"code": "1.11.A.6", "text": "A systematic random sample is a method in which sample members from a population are selected according to a random starting point and a fixed, periodic interval between successive sampling units."}]}, {"code": "1.11.B", "text": "Justify the appropriateness of a sampling method. [Skill 2.B]", "eks": [{"code": "1.11.B.1", "text": "Each random sampling method has different characteristics that make it more appropriate for sampling populations depending on the question being investigated."}]}]}], "skills": ["Describe simple random, stratified, cluster and systematic samples.", "Carry out a random selection with a random number table or calculator."], "understandings": ["Random selection protects against bias because chance, not the researcher, decides who is chosen.", "Strata are chosen to be similar within, clusters to be mini-populations."], "misconceptions": ["Mixing up strata and clusters.", "Calling a volunteer or convenience sample random."], "processes": ["Label the population, assign numbers, generate random numbers, skip repeats, select."], "exam": ["A sampling description must be specific enough for someone else to repeat it."], "qr": "https://broth11.github.io/ap-stats/unit-1.html#L8", "files": {"F": [{"l": "1.B.2.APStats.Activity", "h": "https://drive.google.com/file/d/1HAleYfBMaJvUm6Ezo7kQAKOM5colAlNE/view", "k": "page", "x": ""}, {"l": "1.B.2.APStats.Activity.Key", "h": "https://drive.google.com/file/d/12TrQTHE80oMfDeCzeRPk_O3PQGXn7W6t/view", "k": "page", "x": ""}, {"l": "1.B.2.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1WgBf9eXCEi6LlAX334xQ2As6tSwlvr4j/view", "k": "page", "x": ""}, {"l": "1.B.2.APStats.MasteryChecks.Key", "h": "https://drive.google.com/file/d/1FtBYdHN7H1iWkyFxqtodZpZcZjKINvgi/view", "k": "page", "x": ""}, {"l": "1.B.2.APStats.PostActivityNotes", "h": "https://drive.google.com/file/d/1YuK4_Xx9II0cq25oFjfolYtEopF9w3vR/view", "k": "page", "x": ""}, {"l": "1.B.2.APStats.PostActivityNotes.Key", "h": "https://drive.google.com/file/d/1UC-rntxsC45Kf9BMj_kJtwP0mnfGYMk-/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=5dycK5ofBXM", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 1.11", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=11", "k": "brain", "x": ""}, {"l": "Practice Library 1.B.2", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=1-b&question=c11", "k": "brain", "x": ""}]}}, {"id": "L9", "n": 9, "ln": 3, "code": "1.B.3", "part": "1B", "partTitle": "Collecting Data", "title": "Bias & Nonrandom Sampling", "summary": "A biased sample misleads however large it is. You identify undercoverage, nonresponse and voluntary response bias, plus response bias from question wording and self-reporting. The activity picks apart the statistics in college recruiting mailers and teaches you to ask what the sample was.", "standards": [{"code": "CED 1.12", "text": "Potential problems with sampling", "ek": [{"code": "1.12.A", "text": "Identify potential sources of bias in sampling methods. [Skill 2.A]", "eks": [{"code": "1.12.A.1", "text": "Bias in a sampling method is a systematic error in the sampling procedure that results in a statistic being consistently larger or consistently smaller than the parameter the statistic is used to estimate."}, {"code": "1.12.A.2", "text": "Voluntary response bias is a bias that may occur when a sample consists entirely of volunteers."}, {"code": "1.12.A.3", "text": "Undercoverage bias may occur when the sampling method fails to include part of the population or a part of the population is less likely to be selected based on the sampling method."}, {"code": "1.12.A.4", "text": "Nonresponse bias may occur because of a failure to obtain responses from some individuals chosen to be sampled. The respondents and nonrespondents could differ significantly in ways that are important for the study."}, {"code": "1.12.A.5", "text": "Response bias may occur when responses to a survey or measurements of observational units tend to differ from the “true” value in one direction. Examples include questions that are confusing or leading (question wording bias) or self-reported responses."}, {"code": "1.12.A.6", "text": "Nonrandom sampling methods (e.g., samples chosen by convenience or voluntary response) introduce potential bias because they do not use random chance to select the individuals."}]}]}], "skills": ["Identify undercoverage, nonresponse, voluntary response and wording bias.", "Explain the direction a bias pushes the result."], "understandings": ["Bias is a flaw in the method, not a matter of sample size.", "A large biased sample is still biased."], "misconceptions": ["Saying the sample is too small when the problem is bias.", "Naming a bias type without the effect on the result."], "processes": ["Name the bias, tie it to the context, then say which way the estimate is pushed."], "exam": ["Name the bias and explain how it makes the result too high or too low."], "qr": "https://broth11.github.io/ap-stats/unit-1.html#L9", "files": {"F": [{"l": "1.B.3.APStats.Handout", "h": "https://drive.google.com/file/d/17gtZT8sfIRCPW-Y_tV-KvUcwMX-PFEc8/view", "k": "page", "x": ""}, {"l": "1.B.3.APStats.Handout.Key", "h": "https://drive.google.com/file/d/16GSw7m0j4KOVFUt7ZK1ZZbSfdXvnMYE-/view", "k": "page", "x": ""}, {"l": "1.B.3.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/10RCiCgskPFQ5CVf1TYn2LqWFXMbrHo3-/view", "k": "page", "x": ""}, {"l": "1.B.3.APStats.MasteryChecks.Key", "h": "https://drive.google.com/file/d/1IHmCqDnfj8C32lEtMan2JngfooNXEXRC/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=EA6xYeSHupQ", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 1.12", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=12", "k": "brain", "x": ""}, {"l": "Practice Library 1.B.3", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=1-b&question=c21", "k": "brain", "x": ""}]}}, {"id": "L10", "n": 10, "ln": 4, "code": "1.B.4", "part": "1B", "partTitle": "Collecting Data", "title": "Experimental Design", "summary": "A well-designed experiment controls extraneous variables with random assignment, a control group, replication, placebos and blinding. You describe the design and say what it allows you to conclude. The activity studies a Yale experiment that sent identical job applications under the names Jennifer and John.", "standards": [{"code": "CED 1.13", "text": "Experimental design (part A)", "ek": [{"code": "1.13.A", "text": "Identify elements of a well- designed experiment. [Skill 2.A]", "eks": [{"code": "1.13.A.1", "text": "A well-designed experiment should include the following: 1.13.A.1.i Comparisons of at least two treatment groups, one of which could be a control group 1.13.A.1.ii Random assignment of treatments to experimental units 1.13.A.1.iii Replication 1.13.A.1.iv Direct control of potential extraneous sources of variation in the response"}, {"code": "1.13.A.2", "text": "A control group is a collection of experimental units that are created for comparison. A control group may be given a treatment different from the treatment of interest to determine if the treatment of interest has an effect (e.g., a treatment with an inactive substance, a placebo, may be given)."}, {"code": "1.13.A.3", "text": "The placebo effect is the difference between the average response to a placebo and the average response to no treatment."}, {"code": "1.13.A.4", "text": "In a single-blind, also called single-masked, experiment, participants do not know which treatment they are receiving, but members of the research team who interact with them know which treatment each participant is receiving, or vice versa."}, {"code": "1.13.A.5", "text": "In a double-blind, also called double-masked, experiment, neither the participants nor the members of the research team who interact with them know which treatment each participant is receiving."}, {"code": "1.13.A.6", "text": "An extraneous source of variation, also referred to as an extraneous variable, is a variable that is known (or believed) to affect the response but is not an explanatory variable being studied."}, {"code": "1.13.A.7", "text": "The purpose of random assignment is to create treatment groups that are as similar as possible with respect to extraneous sources of variation. If random assignment is successful, the respective distributions of each extraneous variable will be approximately the same for all the treatment groups."}, {"code": "1.13.A.8", "text": "A confounding variable in an experiment is a variable that is related to the explanatory variable in such a way that it is difficult to determine which variable, explanatory or confounding, is influencing the change in the response variable. However, in a well-designed experiment, the potential for confounding variables is reduced."}, {"code": "1.13.A.9", "text": "Replication within an experiment means more than one experimental unit is assigned to each treatment."}, {"code": "1.13.A.10", "text": "Direct control in an experiment means keeping the settings of certain potential extraneous sources of variation in the response variable the same from experimental unit to experimental unit."}]}, {"code": "1.13.B", "text": "Identify experimental designs. [Skill 2.A]", "eks": [{"code": "1.13.B.1", "text": "In a completely randomized design, treatments are assigned to experimental units completely at random. Often the number of experimental units assigned to each treatment will be the same, but the sample sizes in each treatment do not have to be the same."}, {"code": "1.13.B.2", "text": "A blocking variable is a source of extraneous variation in the response variable. In a randomized block design, the experimental units are first grouped according to similar values of a blocking variable. These groups are called blocks. Units within the same block are homogeneous with respect to the blocking variable. After the blocks are formed, the treatments are randomly assigned to experimental units within each block so that all treatments occur within every block."}, {"code": "1.13.B.3", "text": "The purpose of blocking is to separate the variation in the response caused by the blocking variable from the rest of the extraneous variation in the response. Blocking allows for more precise comparisons of the response across the treatments. Within a block, the treatments can be compared without having to worry about variation in the response caused by changes in the blocking variable."}, {"code": "1.13.B.4", "text": "A matched pairs design is a randomized block design with only two treatments. Experimental units are arranged in pairs by matching on one or more extraneous sources of variation in the response variable. Each pair receives both treatments by randomly assigning one treatment to one member of the pair and the other treatment to the second member of the pair. Alternatively, each experimental unit may get both treatments while the order of the treatments is randomized."}]}, {"code": "1.13.C", "text": "Justify the appropriateness of a particular experimental design. [Skill 2.B]", "eks": [{"code": "1.13.C.1", "text": "One experimental design may be more appropriate than another experimental design based on the goals of the investigative study, the characteristics of the population, and the sample and variables involved."}]}, {"code": "1.13.D", "text": "Justify the appropriateness of the conclusions based on a well-designed experiment. [Skill 2.B]", "eks": [{"code": "1.13.D.1", "text": "Using random assignment of treatments to experimental units allows for cause-and-effect conclusions between the explanatory and the response variables because the potential for confounding variables is reduced."}, {"code": "1.13.D.2", "text": "Depending on the experimental unit, it may be unethical or difficult to randomly select experimental units to participate in an experiment. In that case, the study’s experimental units are obtained from volunteers and will represent the population of experimental units similar to those who participated in the study."}]}]}], "skills": ["Identify explanatory and response variables, treatments, experimental units and confounding.", "Distinguish an experiment from an observational study."], "understandings": ["Random assignment, not random sampling, creates comparable groups.", "A control group gives a baseline for comparison."], "misconceptions": ["Treating random sampling and random assignment as the same thing.", "Ignoring confounding variables in an observational study."], "processes": ["List units, treatments and response, then say how treatments are assigned at random."], "exam": ["Say what is randomly assigned and why that rules out confounding."], "qr": "https://broth11.github.io/ap-stats/unit-1.html#L10", "files": {"F": [{"l": "1.B.4.APStats.Handout", "h": "https://drive.google.com/file/d/1dEG5btq4rApxC2Yk40iC1LBCi8ody7HC/view", "k": "page", "x": ""}, {"l": "1.B.4.APStats.Handout.Key", "h": "https://drive.google.com/file/d/1SFCu9GeVYDSFRJjM1pKp5MyWLbnWJ0An/view", "k": "page", "x": ""}, {"l": "1.B.4.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1aCVxTTr7jhVbRsSPXEsZbOy5WyGGcqLj/view", "k": "page", "x": ""}, {"l": "1.B.4.APStats.MasteryChecks.Key", "h": "https://drive.google.com/file/d/1unYgIyzGnDCU6nkS3D77y77nz61PGqq5/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=87T-AaEPjLQ", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 1.13", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=13", "k": "brain", "x": ""}, {"l": "Practice Library 1.B.4", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=1-b&question=c31", "k": "brain", "x": ""}]}}, {"id": "L11", "n": 11, "ln": 5, "code": "1.B.5", "part": "1B", "partTitle": "Collecting Data", "title": "Grouping in Experiments", "summary": "Completely randomized, randomized block and matched pairs designs group experimental units in different ways to reduce variability. You choose a design and say why. The activity asks whether social media has hurt mental health, and shows how study design separates association from cause.", "standards": [{"code": "CED 1.13", "text": "Experimental design (parts B to D)", "ek": [{"code": "1.13.A", "text": "Identify elements of a well- designed experiment. [Skill 2.A]", "eks": [{"code": "1.13.A.1", "text": "A well-designed experiment should include the following: 1.13.A.1.i Comparisons of at least two treatment groups, one of which could be a control group 1.13.A.1.ii Random assignment of treatments to experimental units 1.13.A.1.iii Replication 1.13.A.1.iv Direct control of potential extraneous sources of variation in the response"}, {"code": "1.13.A.2", "text": "A control group is a collection of experimental units that are created for comparison. A control group may be given a treatment different from the treatment of interest to determine if the treatment of interest has an effect (e.g., a treatment with an inactive substance, a placebo, may be given)."}, {"code": "1.13.A.3", "text": "The placebo effect is the difference between the average response to a placebo and the average response to no treatment."}, {"code": "1.13.A.4", "text": "In a single-blind, also called single-masked, experiment, participants do not know which treatment they are receiving, but members of the research team who interact with them know which treatment each participant is receiving, or vice versa."}, {"code": "1.13.A.5", "text": "In a double-blind, also called double-masked, experiment, neither the participants nor the members of the research team who interact with them know which treatment each participant is receiving."}, {"code": "1.13.A.6", "text": "An extraneous source of variation, also referred to as an extraneous variable, is a variable that is known (or believed) to affect the response but is not an explanatory variable being studied."}, {"code": "1.13.A.7", "text": "The purpose of random assignment is to create treatment groups that are as similar as possible with respect to extraneous sources of variation. If random assignment is successful, the respective distributions of each extraneous variable will be approximately the same for all the treatment groups."}, {"code": "1.13.A.8", "text": "A confounding variable in an experiment is a variable that is related to the explanatory variable in such a way that it is difficult to determine which variable, explanatory or confounding, is influencing the change in the response variable. However, in a well-designed experiment, the potential for confounding variables is reduced."}, {"code": "1.13.A.9", "text": "Replication within an experiment means more than one experimental unit is assigned to each treatment."}, {"code": "1.13.A.10", "text": "Direct control in an experiment means keeping the settings of certain potential extraneous sources of variation in the response variable the same from experimental unit to experimental unit."}]}, {"code": "1.13.B", "text": "Identify experimental designs. [Skill 2.A]", "eks": [{"code": "1.13.B.1", "text": "In a completely randomized design, treatments are assigned to experimental units completely at random. Often the number of experimental units assigned to each treatment will be the same, but the sample sizes in each treatment do not have to be the same."}, {"code": "1.13.B.2", "text": "A blocking variable is a source of extraneous variation in the response variable. In a randomized block design, the experimental units are first grouped according to similar values of a blocking variable. These groups are called blocks. Units within the same block are homogeneous with respect to the blocking variable. After the blocks are formed, the treatments are randomly assigned to experimental units within each block so that all treatments occur within every block."}, {"code": "1.13.B.3", "text": "The purpose of blocking is to separate the variation in the response caused by the blocking variable from the rest of the extraneous variation in the response. Blocking allows for more precise comparisons of the response across the treatments. Within a block, the treatments can be compared without having to worry about variation in the response caused by changes in the blocking variable."}, {"code": "1.13.B.4", "text": "A matched pairs design is a randomized block design with only two treatments. Experimental units are arranged in pairs by matching on one or more extraneous sources of variation in the response variable. Each pair receives both treatments by randomly assigning one treatment to one member of the pair and the other treatment to the second member of the pair. Alternatively, each experimental unit may get both treatments while the order of the treatments is randomized."}]}, {"code": "1.13.C", "text": "Justify the appropriateness of a particular experimental design. [Skill 2.B]", "eks": [{"code": "1.13.C.1", "text": "One experimental design may be more appropriate than another experimental design based on the goals of the investigative study, the characteristics of the population, and the sample and variables involved."}]}, {"code": "1.13.D", "text": "Justify the appropriateness of the conclusions based on a well-designed experiment. [Skill 2.B]", "eks": [{"code": "1.13.D.1", "text": "Using random assignment of treatments to experimental units allows for cause-and-effect conclusions between the explanatory and the response variables because the potential for confounding variables is reduced."}, {"code": "1.13.D.2", "text": "Depending on the experimental unit, it may be unethical or difficult to randomly select experimental units to participate in an experiment. In that case, the study’s experimental units are obtained from volunteers and will represent the population of experimental units similar to those who participated in the study."}]}]}], "skills": ["Design completely randomized and randomized block experiments.", "Use blinding, placebos and replication and explain what each does."], "understandings": ["Blocking removes variability from a known source and makes comparisons fairer.", "Replication reduces the role of chance in the results."], "misconceptions": ["Blocking by a variable that does not affect the response.", "Confusing blocks with treatments."], "processes": ["Group units into blocks, randomize within each block, apply treatments, compare responses."], "exam": ["Randomize within blocks and say why each design feature is there."], "qr": "https://broth11.github.io/ap-stats/unit-1.html#L11", "files": {"F": [{"l": "1.B.5.APStats.Handout", "h": "https://drive.google.com/file/d/17aNSTtww3Xg3paNxo6hHeQZDn38R_ZJe/view", "k": "page", "x": ""}, {"l": "1.B.5.APStats.Handout.Key", "h": "https://drive.google.com/file/d/1FKPfYS9yJEIre5nqpi4bjvNgYOIuyWXr/view", "k": "page", "x": ""}, {"l": "1.B.5.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1X4Ts91tyrwZ6kVTbpUdW2whK1l3ut9PQ/view", "k": "page", "x": ""}, {"l": "1.B.5.APStats.MasteryChecks.Key", "h": "https://drive.google.com/file/d/1TC7PCUEGd6xgMXDI9LWkptVFfrHkdNAl/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=J3MvI9hLEjU", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 1.13", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=13", "k": "brain", "x": ""}, {"l": "Practice Library 1.B.5", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=1-b&question=c41", "k": "brain", "x": ""}]}}]}</script>

   "topic": "Populations, Samples, & Data.",
   "standards": [
    {
     "code": "CED 1.1",
     "text": "Introducing statistics: what can we learn from data",
     "ek": [
      {
       "code": "1.1.A",
       "text": "Identify components within a statistical study. [Skill 2.A]",
       "eks": [
        {
         "code": "1.1.A.1",
         "text": "A statistical study is a study in which data are collected from a sample to answer an investigative question about a larger population."
        },
        {
         "code": "1.1.A.2",
         "text": "Statistical studies are necessary when the population is too large or it is too difficult to collect data from every item or individual in the population."
        },
        {
         "code": "1.1.A.3",
         "text": "A datum (singular form of data) is a piece of information about an item or individual. A collection of data is called a data set."
        },
        {
         "code": "1.1.A.4",
         "text": "A population consists of all items or individuals of interest. The population size is represented by the symbol N."
        },
        {
         "code": "1.1.A.5",
         "text": "A sample selected for study is a subset of the population from which data are obtained. The number of items in the sample, called the sample size, is represented by the symbol n."
        },
        {
         "code": "1.1.A.6",
         "text": "Each component of a statistical study and the resulting calculations can be related to an aspect of the corresponding real-world context from which the components were derived. This identification of a statistical result with the corresponding contextual component is what is meant by “in context.”"
        }
       ]
      },
      {
       "code": "1.1.B",
       "text": "Determine an investigative question within a statistical study. [Skill 1.A]",
       "eks": [
        {
         "code": "1.1.B.1",
         "text": "An investigative question for a specific study should have a defined purpose and should not be changed based on the data analysis or results."
        },
        {
         "code": "1.1.B.2",
         "text": "An investigative question should be posed so that the required data can be collected and analyzed."
        }
       ]
      }
     ]
    },
    {
     "code": "CED 1.2",
     "text": "Variables",
     "ek": [
      {
       "code": "1.2.A",
       "text": "Identify observational units, variables, parameters, and statistics from a statistical study or data set. [Skill 2.A]",
       "eks": [
        {
         "code": "1.2.A.1",
         "text": "An observational unit is an item or individual from which a datum is collected."
        },
        {
         "code": "1.2.A.2",
         "text": "A variable is a characteristic that may change from one observational unit to another."
        },
        {
         "code": "1.2.A.3",
         "text": "Data collected on numerical and categorical variables measured on observational units, including photographs, sounds, videos, and text, can convey meaningful information."
        },
        {
         "code": "1.2.A.4",
         "text": "A parameter is a numerical attribute or summary of the variable of interest for a population."
        },
        {
         "code": "1.2.A.5",
         "text": "A statistic is a numerical attribute or summary of the variable of interest for a sample. The value of a statistic from a certain sample is often not equal to the unknown value of the population parameter but may provide the basis for making inferences about the population parameter."
        }
       ]
      },
      {
       "code": "1.2.B",
       "text": "Identify types of variables. [Skill 2.A]",
       "eks": [
        {
         "code": "1.2.B.1",
         "text": "A categorical variable, also called a qualitative variable, takes on values that are category names or group labels."
        },
        {
         "code": "1.2.B.2",
         "text": "A quantitative variable, also called a numerical variable, takes on numerical values for a measured or counted quantity and generally has units of measure."
        }
       ]
      },
      {
       "code": "1.2.C",
       "text": "Identify types of quantitative variables. [Skill 2.A]",
       "eks": [
        {
         "code": "1.2.C.1",
         "text": "A discrete quantitative variable can take on a countable number of values. The number of values may be finite or countably infinite, as with the whole numbers."
        },
        {
         "code": "1.2.C.2",
         "text": "A continuous quantitative variable can take on an infinite number of possible values within a given interval. The number of values the variable can take on is measurable but not countable. This variable can take on all possible values between any pair of values."
        }
       ]
      }
     ]
    }
   ],
   "skills": [
    "Write an investigative question and identify the population and sample.",
    "Classify variables as categorical or quantitative, and identify individuals."
   ],
   "explainer": {
    "understandings": [
     "Statistics answers a question about a population using data from individuals.",
     "The type of variable decides which summaries and graphs are allowed."
    ],
    "misconceptions": [
     "Numbers used as labels (zip codes, jersey numbers) are categorical, not quantitative.",
     "Confusing the individuals with the variables recorded on them."
    ],
    "processes": [
     "State the question, identify individuals, then name each variable and its type."
    ],
    "exam": [
     "Name the variable in context and say categorical or quantitative; a bare type earns nothing."
    ]
   },

       "eks": [

         "code": "1.3.A.1",
         "text": "A frequency table shows the number of observational units in each category of a categorical variable."
        },

         "code": "1.3.A.2",
         "text": "A relative frequency table shows the proportion of observational units in each category of a categorical variable."
        }
       ]
      },
      {
       "code": "1.3.B",
       "text": "Describe categorical one-variable tabular representations with summary statistics. [Skill 4.A]",
       "eks": [
        {
         "code": "1.3.B.1",
         "text": "Percentages, relative frequencies, and ratios all provide the same information as proportions."
        },
        {
         "code": "1.3.B.2",
         "text": "Counts and relative frequencies of categorical variables reveal information that can be used to justify claims about the variables in context."
        }
       ]
      }
     ]
    },
    {
     "code": "CED 1.4",
     "text": "Graphical representations for one categorical variable",
     "ek": [

       "text": "Construct categorical one-variable graphical representations. [Skill 3.A]",
       "eks": [
        {
         "code": "1.4.A.1",
         "text": "Bar charts, also called bar graphs, display frequencies (counts) or relative frequencies (proportions) for the categories of a single categorical variable. Each bar on a bar chart represents a category of the categorical variable of interest. The height or length of each bar corresponds to the frequency or relative frequency of the observational units in each category."
        },
        {
         "code": "1.4.A.2",
         "text": "Pie charts are used to display frequencies (counts) or relative frequencies (proportions) for categorical data. Each slice on a pie chart represents a category of the categorical variable of interest. The area of each slice, as a fraction of the total area, corresponds to the relative frequency of observational units falling within each category. The sum of the slices’ areas together will equal 1, or 100% of the total area."
        }
       ]
      },
      {
       "code": "1.4.B",
       "text": "Justify a claim using categorical one-variable graphical representations. [Skill 4.B]",
       "eks": [
        {
         "code": "1.4.B.1",
         "text": "Graphical representations of a categorical variable reveal information that can be used to justify claims about the variable in context."
        }
       ]
      },
      {
       "code": "1.4.C",
       "text": "Compare multiple categorical one-variable tabular and graphical representations. [Skill 4.A]",
       "eks": [
        {
         "code": "1.4.C.1",
         "text": "Frequency and relative frequency tables, bar charts, and pie charts can be used to compare two or more data sets in terms of the same categorical variable."
        }
       ]
      }

   "id": "L3",

   "title": "Describing a Quantitative Variable",
   "topic": "Describing a Quantitative Variable.",
   "standards": [
    {
     "code": "CED 1.5",
     "text": "Graphical representations for one quantitative variable",
     "ek": [
      {
       "code": "1.5.A",
       "text": "Construct quantitative one-variable graphical representations. [Skill 3.A]",
       "eks": [
        {
         "code": "1.5.A.1",
         "text": "Histograms, stem-and-leaf plots, and dotplots provide a visual representation of the distribution of the values of a quantitative variable. These graphs show the frequency or relative frequency of the quantitative variable values or intervals of values and maintain the natural ordering, smallest to largest, of the quantitative variable."
        },
        {
         "code": "1.5.A.2",
         "text": "A histogram places the observed values of the quantitative variable into ordered intervals, or bins, along the horizontal axis. Each bar represents an interval or bin, and the height of each bar shows the frequency or relative frequency of the observations within that interval. Altering the interval widths, or bin widths, can change the appearance of the histogram. Alternatively, a histogram can be constructed with bins on the vertical axis with bars appearing horizontally."
        },
        {
         "code": "1.5.A.3",
         "text": "A stem-and-leaf plot splits each value of the quantitative variable into two parts: a “stem” (the first digit or digits) and a “leaf” (usually the single digit after the stem digit or digits). Both stems and leaves are ordered from smallest to largest."
        },
        {
         "code": "1.5.A.4",
         "text": "A dotplot represents each value of the quantitative variable by a dot. Each dot is placed above the horizontal or beside the vertical axis corresponding to the value of that observation, with nearly identical values stacked on top of each other."
        }
       ]
      }
     ]
    },
    {
     "code": "CED 1.6",
     "text": "Descriptions for one quantitative variable distributions",
     "ek": [
      {
       "code": "1.6.A",
       "text": "Describe distributions of quantitative one-variable graphical representations. [Skill 4.A]",
       "eks": [
        {
         "code": "1.6.A.1",
         "text": "Descriptions of the distribution of one quantitative variable include shape, center, and variability (spread) as well as any unusual features such as outliers, gaps, or clusters in context."
        },
        {
         "code": "1.6.A.2",
         "text": "The shape of the distribution of one quantitative variable is skewed to the right (positively skewed) if the right tail (toward larger values) is longer than the left. The shape of the distribution is skewed to the left (negatively skewed) if the left tail (toward smaller values) is longer than the right. The shape of the distribution is approximately symmetric if the left half is approximately the mirror image of the right half."
        },
        {
         "code": "1.6.A.3",
         "text": "Distributions of one quantitative variable with one main peak are called unimodal. Distributions with two prominent peaks are called bimodal. A distribution in which each frequency or each relative frequency is approximately the same with no prominent peaks is approximately uniform."
        },
        {
         "code": "1.6.A.4",
         "text": "Outliers for one quantitative variable are data points that are unusually small or large relative to the rest of the data."
        },
        {
         "code": "1.6.A.5",
         "text": "A gap is a region in a distribution between two values in which there are no observed data."
        },
        {
         "code": "1.6.A.6",
         "text": "Clusters are concentrations of values usually separated by gaps."
        }
       ]
      },
      {
       "code": "1.6.B",
       "text": "Justify a claim using distributions of quantitative one-variable graphical representations. [Skill 4.B]",
       "eks": [
        {
         "code": "1.6.B.1",
         "text": "Graphical representations of a quantitative variable may reveal information that can be used to justify claims about the variable in context."
        }
       ]
      }
     ]
    }

        {
         "code": "1.7.A.3",
         "text": "The median is the middle value when the data set is ordered from smallest to largest and can be found with and without using technology. One common method for determining the median of a data set with an even number of values is to use the mean of the two middle values. A common method for determining the median of a data set with an odd number of values is to use the value in the middle of all the values."
        },
        {
         "code": "1.7.A.4",
         "text": "In an ordered data set, the smallest value is the minimum value, and the largest value is the maximum value."
        },
        {
         "code": "1.7.A.5",
         "text": "The first quartile, denoted by Q1, is the median value of the lower half of the ordered data set from the minimum value to the position of the median. Approximately 25% of the values in the data set are less than or equal to Q1. The third quartile, denoted by Q3, is the median value of the upper half of the ordered data set from the position of the median to the maximum value. Approximately 75% of the values in the data set are less than or equal to Q3. The second quartile, Q2, is also the median of the data set. Q1 and Q3 form the boundaries for the middle 50% of values in an ordered data set."
        },
        {
         "code": "1.7.A.6",
         "text": "The pth percentile is the value that has p% of the data less than or equal to it when the data set is ordered from smallest to largest. The first and third quartiles are the 25th and 75th percentiles, respectively."
        }
       ]
      },
      {
       "code": "1.7.B",
       "text": "Calculate measures of variability for quantitative data. [Skill 3.B]",
       "eks": [
        {
         "code": "1.7.B.1",
         "text": "Three commonly used measures of variability (or spread) in the distribution of a quantitative variable are the range, interquartile range, and standard deviation."
        },
        {
         "code": "1.7.B.2",
         "text": "The range is the difference between the maximum data value and the minimum data value."
        },
        {
         "code": "1.7.B.3",
         "text": "The interquartile range (IQR) is the difference between the third and first quartiles: Q3 − Q1."
        },
