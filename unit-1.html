 (percentiles, z-scores)"}, {"code": "CED 1.8", "text": "Graphical representations of summary statistics"}], "skills": ["Draw and read boxplots using the five-number summary.", "Compute and interpret percentiles and z-scores."], "understandings": ["A boxplot shows spread through quartiles, and each section holds about a quarter of the data.", "A z-score counts standard deviations from the mean."], "misconceptions": ["Reading box length as the amount of data in it, or reading a boxplot's tall whisker as more data.", "Calling a z-score the percentile."], "processes": ["Find the five-number summary, mark fences, plot outliers separately, then draw whiskers to the last non-outlier."], "exam": ["Percentile and z-score interpretations need a full sentence in context."], "qr": "https://broth11.github.io/ap-stats/unit-1.html#L5", "files": {"F": [{"l": "1.A.5.APStats.Handout", "h": "https://drive.google.com/file/d/1aY1Aa3Gh_tg2OTg_khUYaHAUfL2OEgiJ/view", "k": "page", "x": ""}, {"l": "1.A.5.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1ACjzpzxKKRgZDgEauYfTAdRYhRrGwHdu/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=jy6SqcuHDLA", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 1.7", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=7", "k": "brain", "x": ""}, {"l": "Stats Hub 1.8", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=8", "k": "brain", "x": ""}, {"l": "Practice Library 1.A.5", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=1-a&question=a41", "k": "brain", "x": ""}]}}, {"id": "L6", "n": 6, "ln": 6, "code": "1.A.6", "part": "1A", "partTitle": "Exploring One-Variable Data", "title": "Comparing Graphs & Z-Scores", "summary": "Comparing distributions means addressing shape, center and spread together, and z-scores let you compare values from different scales. You use both to compare players from different basketball eras. The activity is a debate on who is the greatest NBA scorer of all time, settled with data.", "standards": [{"code": "CED 1.9", "text": "Comparisons of the distributions for one quantitative variable"}], "skills": ["Compare two or more distributions on shape, center, spread and outliers.", "Choose a graph that supports the comparison."], "understandings": ["Comparison needs both distributions addressed in the same sentence.", "Side-by-side graphs on a common scale make shape, center and spread directly comparable."], "misconceptions": ["Describing each group separately with no comparing words.", "Comparing only the centers."], "processes": ["Draw on a shared axis, then write one comparing sentence each for shape, center, spread and outliers."], "exam": ["Use words like higher, more variable, both skewed right; this is where FRQ marks are lost."], "qr": "https://broth11.github.io/ap-stats/unit-1.html#L6", "files": {"F": [{"l": "1.A.6.APStats.Data", "h": "https://docs.google.com/spreadsheets/d/1d-dEitDtn2qt2Hq50yDS7hT1VzUSY9UkChQPder99w4/view", "k": "page", "x": "gsheet"}, {"l": "1.A.6.APStats.Data", "h": "https://drive.google.com/file/d/1ycbnpouJ3R7zCEXFX4Bib85J2CngmFOJ/view", "k": "page", "x": "xlsx"}, {"l": "1.A.6.APStats.Handout", "h": "https://drive.google.com/file/d/1wq0rOtkbwLdhWFGEDVo9JwsTomG5R5Qn/view", "k": "page", "x": ""}, {"l": "1.A.6.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/19dfuhtutcGreSz-L_S2HiVHnYopplq7N/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=g0U-eOE9n2s", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 1.9", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=9", "k": "brain", "x": ""}, {"l": "Practice Library 1.A.6", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=1-a&question=a51", "k": "brain", "x": ""}]}}, {"id": "L7", "n": 7, "ln": 1, "code": "1.B.1", "part": "1B", "partTitle": "Collecting Data", "title": "Types of Studies", "summary": "The way a study is designed decides what conclusions it can support. You compare observational studies and experiments, spot confounding variables, and judge when causal claims and generalizing are allowed. The activity uses Covid-19 data to ask how we know vaccines work.", "standards": [{"code": "CED 1.10", "text": "The investigative question revisited and data collection"}], "skills": ["Choose a data collection method (survey, observational study, experiment) that fits the question.", "Define population, sample and parameter versus statistic."], "understandings": ["The way data are collected decides what conclusions are allowed.", "Only a randomized experiment can support cause and effect."], "misconceptions": ["Using observational data to claim causation.", "Mixing up parameter and statistic."], "processes": ["Match the question to the design, then state the population the conclusion applies to."], "exam": ["Conclusions must match the design: generalizing needs random sampling, causation needs random assignment."], "qr": "https://broth11.github.io/ap-stats/unit-1.html#L7", "files": {"F": [{"l": "1.B.1.APStats.Handout", "h": "https://drive.google.com/file/d/1_qZjRCe_MhtCVyNhASdZ2CH9IQ9LGOBe/view", "k": "page", "x": ""}, {"l": "1.B.1.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1BvqzaChMuaEswROgdIi_SnYEwc1t_lve/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=-GVqAyZ7a38", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 1.10", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=10", "k": "brain", "x": ""}, {"l": "Practice Library 1.B.1", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=1-b&question=c01", "k": "brain", "x": ""}]}}, {"id": "L8", "n": 8, "ln": 2, "code": "1.B.2", "part": "1B", "partTitle": "Collecting Data", "title": "Random Sampling", "summary": "Simple, stratified, cluster and systematic random samples each select a sample by chance in a different way. You describe each method and tell bias from variation. The activity uses income data from your own city to ask what middle income means.", "standards": [{"code": "CED 1.11", "text": "Random sampling"}], "skills": ["Describe simple random, stratified, cluster and systematic samples.", "Carry out a random selection with a random number table or calculator."], "understandings": ["Random selection protects against bias because chance, not the researcher, decides who is chosen.", "Strata are chosen to be similar within, clusters to be mini-populations."], "misconceptions": ["Mixing up strata and clusters.", "Calling a volunteer or convenience sample random."], "processes": ["Label the population, assign numbers, generate random numbers, skip repeats, select."], "exam": ["A sampling description must be specific enough for someone else to repeat it."], "qr": "https://broth11.github.io/ap-stats/unit-1.html#L8", "files": {"F": [{"l": "1.B.2.APStats.Activity", "h": "https://drive.google.com/file/d/1HAleYfBMaJvUm6Ezo7kQAKOM5colAlNE/view", "k": "page", "x": ""}, {"l": "1.B.2.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1WgBf9eXCEi6LlAX334xQ2As6tSwlvr4j/view", "k": "page", "x": ""}, {"l": "1.B.2.APStats.PostActivityNotes", "h": "https://drive.google.com/file/d/1YuK4_Xx9II0cq25oFjfolYtEopF9w3vR/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=5dycK5ofBXM", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 1.11", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=11", "k": "brain", "x": ""}, {"l": "Practice Library 1.B.2", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=1-b&question=c11", "k": "brain", "x": ""}]}}, {"id": "L9", "n": 9, "ln": 3, "code": "1.B.3", "part": "1B", "partTitle": "Collecting Data", "title": "Bias & Nonrandom Sampling", "summary": "A biased sample misleads however large it is. You identify undercoverage, nonresponse and voluntary response bias, plus response bias from question wording and self-reporting. The activity picks apart the statistics in college recruiting mailers and teaches you to ask what the sample was.", "standards": [{"code": "CED 1.12", "text": "Potential problems with sampling"}], "skills": ["Identify undercoverage, nonresponse, voluntary response and wording bias.", "Explain the direction a bias pushes the result."], "understandings": ["Bias is a flaw in the method, not a matter of sample size.", "A large biased sample is still biased."], "misconceptions": ["Saying the sample is too small when the problem is bias.", "Naming a bias type without the effect on the result."], "processes": ["Name the bias, tie it to the context, then say which way the estimate is pushed."], "exam": ["Name the bias and explain how it makes the result too high or too low."], "qr": "https://broth11.github.io/ap-stats/unit-1.html#L9", "files": {"F": [{"l": "1.B.3.APStats.Handout", "h": "https://drive.google.com/file/d/17gtZT8sfIRCPW-Y_tV-KvUcwMX-PFEc8/view", "k": "page", "x": ""}, {"l": "1.B.3.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/10RCiCgskPFQ5CVf1TYn2LqWFXMbrHo3-/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=EA6xYeSHupQ", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 1.12", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=12", "k": "brain", "x": ""}, {"l": "Practice Library 1.B.3", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=1-b&question=c21", "k": "brain", "x": ""}]}}, {"id": "L10", "n": 10, "ln": 4, "code": "1.B.4", "part": "1B", "partTitle": "Collecting Data", "title": "Experimental Design", "summary": "A well-designed experiment controls extraneous variables with random assignment, a control group, replication, placebos and blinding. You describe the design and say what it allows you to conclude. The activity studies a Yale experiment that
