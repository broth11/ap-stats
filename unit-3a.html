ns for sample proportions (parts B and C)", "ek": [{"code": "3.2.A", "text": "Calculate the mean and standard deviation of a sampling distribution for a sample proportion. [Skill 3.D]", "eks": [{"code": "3.2.A.1", "text": "For a population with population proportion $p$, when the sampled values are independent, the sampling distribution of a sample proportion $\\hat{p}$ has a mean $\\mu_{\\hat{p}}=p$ and a standard deviation $\\sigma_{\\hat{p}}=\\sqrt{\\dfrac{p(1-p)}{n}}$."}]}, {"code": "3.2.B", "text": "Justify the appropriateness of conditions for the sampling distribution of a sample proportion. [Skill 4.E]", "eks": [{"code": "3.2.B.1", "text": "Sampling without replacement requires that two conditions be met:\n3.2.B.1.i The randomization condition—the data should be collected using a random sample.\n3.2.B.1.ii The 10% condition—the population size must be at least 10 times larger than the sample size ($n\\le 10\\%N$), where $N$ is the size of the population and $n$ is the sample size."}, {"code": "3.2.B.2", "text": "The sampling distribution of the sample proportion $\\hat{p}$ is approximately normal provided the sample size is large enough. To ensure the sample size is large enough, the following condition must be met: $np\\ge 10$ and $n(1-p)\\ge 10$, where $np$ is the expected number of successes and $n(1-p)$ is the expected number of failures."}]}, {"code": "3.2.C", "text": "Interpret the mean, standard deviation, and probabilities for a sampling distribution of a sample proportion. [Skill 4.D]", "eks": [{"code": "3.2.C.1", "text": "The mean, standard deviation, and probabilities for a sampling distribution of a sample proportion should be interpreted in the context of a specific population."}]}]}], "skills": ["Check the large counts and independence conditions.", "Compute probabilities for p-hat using a normal model."], "understandings": ["The sampling distribution of p-hat is approximately normal when np and n(1 - p) are both at least 10.", "The 10 percent  "text": "The parameter for a confidence interval for a population proportion should reference the proportion, the response variable, and the population in context."}]}, {"code": "3.3.B", "text": "Justify the appropriateness of constructing a confidence interval for a population proportion by verifying conditions. [Skill 4.E]", "eks": [{"code": "3.3.B.1", "text": "A one-sample $z$-interval for a population proportion requires that three conditions be met:\n3.3.B.1.i The randomization condition—the data should be collected using a random sample.\n3.3.B.1.ii The 10% condition—when sampling without replacement, the population size must be at least 10 times larger than the sample size ($n\\le 10\\%N$), where $N$ is the size of the population and $n$ is the sample size.\n3.3.B.1.iii The normality condition—the observed number of successes, $n\\hat{p}$, and the observed number of failures, $n(1-\\hat{p})$, should be at least 10."}]}, {"code": "3.3.C", "text": "Calculate an appropriate confidence interval for a population proportion. [Skill 3.E]", "eks": [{"code": "3.3.C.1", "text": "$z^{*}$ denotes a critical value, such that $-z^{*}$ and $z^{*}$ represent the boundaries enclosing the middle $C$% of the standard normal distribution, in which $C$% is an approximate confidence level with which the population proportion is estimated."}, {"code": "3.3.C.2", "text": "An interval estimate can be constructed as point estimate $\\pm$ (margin of error). For a population proportion, the one-sample $z$-interval estimate is $\\hat{p}\\pm z^{*}\\sqrt{\\dfrac{\\hat{p}(1-\\hat{p})}{n}}$."}]}, {"code": "3.3.D", "text": "Calculate the standard error and margin of error of a sample statistic for a confidence interval for a population proportion, and estimate a given sample size from the margin of error. [Skill 3.E]", "eks": [{"code": "3.3.D.1", "text": "The standard error ($SE$) of a statistic is an estimate of the standard deviation of the sampling distribution of the statistic. The standard error of the sample proportion $\\hat{p}$ is $SE_{\\hat{p}}=\\sqrt{\\dfrac{\\hat{p}(1-\\hat{p})}{n}}$."}, {"code": "3.3.D.2", "text": "The standard error quantifies the typical amount that a statistic will vary from the value of the corresponding population parameter."}, {"code": "3.3.D.3", "text": "The margin of error of $\\hat{p}$ is half the width of the confidence interval and is calculated as the critical value ($z^{*}$) times the standard error ($SE$) of $\\hat{p}$, which equals $z^{*}\\sqrt{\\dfrac{\\hat{p}(1-\\hat{p})}{n}}$."}, {"code": "3.3.D.4", "text": "The formula for the margin of error ($MOE$) can be rearranged to solve for $n$, $n=\\dfrac{(z^{*})^{2}\\hat{p}(1-\\hat{p})}{(MOE)^{2}}$, the minimum sample size needed to achieve a given margin of error. For this purpose, if $\\hat{p}$ is not defined or unable to be calculated, use $\\hat{p}=0.5$ in order to find the upper bound for the sample size that will result in a given margin of error."}]}]}, {"code": "CED 3.4", "text": "Justifying a claim based on a confidence interval for a population proportion", "ek": [{"code": "3.4.A", "text": "Interpret a confidence interval in context for a population proportion. [Skill 4.F]", "eks": [{"code": "3.4.A.1", "text": "Because the confidence interval for a population proportion is calculated based on a sample from a population, the computed interval may or may not contain the value of the population proportion."}, {"code": "3.4.A.2", "text": "The interpretation of the confidence level is that in repeated random sampling with the same sample size, approximately C% of confidence intervals calculated will capture the population proportion, with C representing the numerical value of the confidence level used."}, {"code": "3.4.A.3", "text": "When interpreting a C% confidence interval for a population proportion, we say we are C% confident that the interval (a, b) contains the true value of the parameter for the population, where a represents the lower limit and b represents the upper limit. An interpretation of a confidence interval for a population proportion includes a reference to the parameter with details about the population it represents in the context of the study."}]}, {"code": "3.4.B", "text": "Justify a claim based on a confidence interval for a population proportion. [Skill 4.G]", "eks": [{"code": "3.4.B.1", "text": "A confidence interval for a population proportion provides a range of plausible values that may serve as convincing evidence to support a particular claim about the population proportion."}]}, {"code": "3.4.C", "text": "Identify the relationships among sample size, confidence interval width, confidence level, and margin of error for a population proportion. [Skill 2.D]", "eks": [{"code": "3.4.C.1", "text": "For a given sample, increasing the confidence level will result in the following: 3.4.C.1.i The critical value will increase. 3.4.C.1.ii The margin of error will increase. 3.4.C.1.iii The width of the confidence interval will increase."}, {"code": "3.4.C.2", "text": "Increasing the sample size decreases the standard error. Thus, when all other things remain the same, the width of a confidence interval for a population proportion tends to decrease as the sample size increases. For a confidence interval for a population proportion with a given confidence level, the width of the interval is approximately proportional to $\\dfrac{1}{\\sqrt{n}}$."}]}]}], "skills": ["Find the sample size for a given margin of error.", "Use an interval to support or reject a claim."], "understandings": ["A claimed value outside the interval is not plausible at that confidence level.", "Margin of error shrinks with the square root of n."], "misconceptions": ["Rounding the sample size down.", "Claiming a value inside the interval is proven."], "processes": ["Set the margin of error formula, solve for n, round up."], "exam": ["Link the claimed value to the interval, then conclude about plausibility."], "qr": "https://broth11.github.io/ap-stats/unit-3a.html#L5", "files": {"F": [{"l": "3.A.5.APStats.Handout", "h": "https://drive.google.com/file/d/10uW9bl0Cvmn1mcJG_ObgiKJ5s3SDQc0Q/view", "k": "page", "x": ""}, {"l": "3.A.5.APStats.Handout.Key", "h": "https://drive.google.com/file/d/16vnnfX_6qLpv_3wFEifsM8guywoHszZu/view", "k": "page", "x": ""}, {"l": "3.A.5.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1veL1KZrq3z41_hrakTLsue587wvy_rDf/view", "k": "page", "x": ""}, {"l": "3.A.5.APStats.MasteryChecks.Key", "h": "https://drive.google.com/file/d/1giDOzxmv_uErqEgu4J3uxB4AiK6VP3Aw/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=UX-b391cBf8", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 3.3", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=58", "k": "brain", "x": ""}, {"l": "Stats Hub 3.4", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=34", "k": "brain", "x": ""}, {"l": "Practice Library 3.A.5", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=3-a&question=u3a41", "k": "brain", "x": ""}]}}, {"id": "L6", "n": 6, "ln": 6, "code": "3.A.6", "part": "3A", "partTitle": "Inference for One Proportion", "title": "Introduction to Hypothesis Tests", "summary": "A hypothesis test weighs a claim against the evidence. You write null and alternative hypotheses, estimate a p-value from a simulation, and compare it to a significance level. The activity uses data from the NBA bubble to ask whether home teams had an advantage, and Part A runs in an Amplify simulation.", "standards": [{"code": "CED 3.5", "text": "Setting up a test for a population proportion (parts A and B)", "ek": [{"code": "3.5.A", "text": "Identify an appropriate testing method for a population proportion including the parameter for the population proportion. [Skill 2.C]", "eks": [{"code": "3.5.A.1", "text": "A hypothesis test is a statistical inference procedure that is used to make a decision about the value of a population parameter. The appropriate hypothesis testing procedure is a one-sample z-test for a population proportion."}, {"code": "3.5.A.2", "text": "The parameter for a hypothesis test for a population proportion should reference the population parameter, the response variable, and the population in context."}]}, {"code": "3.5.B", "text": "Identify the null and alternative hypotheses for a population proportion. [Skill 2.E]", "eks": [{"code": "3.5.B.1", "text": "In the hypothesis testing procedure, the null hypothesis, $H_0$, is the statement about a parameter that is assumed to be correct unless there is convincing statistical evidence suggesting otherwise. It is the status quo condition. The alternative hypothesis, $H_a$, is the claim or belief about a parameter for which evidence is being collected. A researcher’s claim or belief about the population parameter is represented by the alternative hypothesis."}, {"code": "3.5.B.2", "text": "The null hypothesis contains an equality reference ($=$, $\\ge$, or $\\le$). Although the null hypothesis for a one-sided test may include an inequality symbol, in AP Statistics it is tested at the boundary of equality. The alternative hypothesis with $<$ or $>$ is called one-sided, and the alternative hypothesis with $\\ne$ is called two-sided."}, {"code": "3.5.B.3", "text": "The null hypothesis for a one-sample $z$-test for a population proportion is as follows: $H_0: p=p_0$, where $p_0$ is the null hypothesized value for the population proportion. A one-sided alternative hypothesis for a one-sample $z$-test for a population proportion is either $H_a: p<p_0$ or $H_a: p>p_0$. A two-sided alternative hypothesis is $H_a: p\\ne p_0$."}]}, {"code": "3.5.C", "text": "Justify the appropriateness of a hypothesis test for a population proportion by verifying conditions. [Skill 4.E]", "eks": [{"code": "3.5.C.1", "text": "A one-sample $z$-test for a population proportion requires that three conditions be met:\n3.5.C.1.i The randomization condition—the data should be collected using a random sample.\n3.5.C.1.ii The 10% condition—when sampling without replacement, the population size must be at least 10 times larger than the sample size ($n\\le 10\\%N$), where $N$ is the size of the population and $n$ is the sample size.\n3.5.C.1.iii The normality condition—the expected number of successes, $np_0$, and the expected number of failures, $n(1-p_0)$, should be at least 10."}]}]}], "skills": ["State null and alternative hypotheses in symbols and words.", "Choose a one-sided or two-sided alternative."], "understandings": ["The null is the claim assumed true, written with equality in terms of the parameter.", "The alternative comes from the research question, not the data."], "misconceptions": ["Writing hypotheses with p-hat.", "Choosing the direction after seeing the data."], "processes": ["Define p in context, write H0 and Ha, then plan the test."], "exam": ["Hypotheses in terms of the parameter with context; p-hat in a hypothesis loses the mark."], "qr": "https://broth11.github.io/ap-stats/unit-3a.html#L6", "files": {"F": [{"l": "3.A.6.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1Tid2SDrP2qoISZKbPGrKCmxV2PIxmS5o/view", "k": "page", "x": ""}, {"l": "3.A.6.APStats.MasteryChecks.Key", "h": "https://drive.google.com/file/d/18pYnJX2QtVv24dl-LkNEt1ijRuuvWCSq/view", "k": "page", "x": ""}, {"l": "3.A.6.PartA.APStats.Handout", "h": "https://drive.google.com/file/d/1Nx1m2m0YIsYpl-mkJkHrGb0L_yD6u98A/view", "k": "page", "x": ""}, {"l": "3.A.6.PartA.APStats.Handout.Key", "h": "https://drive.google.com/file/d/1K7nSR_uQAuZCjDvdZqILW46LApTOIRWi/view", "k": "page", "x": ""}, {"l": "3.A.6.PartB.APStats.Handout", "h": "https://drive.google.com/file/d/1o8GpHm6QGbKJhEPulr-bsGnVDBGYkuJx/view", "k": "page", "x": ""}, {"l": "3.A.6.PartB.APStats.Handout.Key", "h": "https://drive.google.com/file/d/1vAJ19B-Uii8FJER_g4psxL9Mc4hHOlKs/view", "k": "page", "x": ""}], "V": [{"l": "Lesson video, Part A (YouTube)", "h": "https://www.youtube.com/watch?v=EfnUlngEqkE", "k": "video", "x": ""}, {"l": "Lesson video, Part B (YouTube)", "h": "https://www.youtube.com/watch?v=xLKlJ6yACWM", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 3.5", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=35", "k": "brain", "x": ""}, {"l": "Practice Library 3.A.6", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=3-a&question=u3a51", "k": "brain", "x": ""}]}}, {"id": "L7", "n": 7, "ln": 7, "code": "3.A.7", "part": "3A", "partTitle": "Inference for One Proportion", "title": "Hypothesis Test for One Proportion", "summary": "A one-sample z-test for a proportion carries out the full test: state hypotheses, check conditions, calculate the test statistic and p-value, and conclude in context. The activity returns to the NBA bubble and asks whether there is convincing evidence of a home advantage.", "standards": [{"code": "CED 3.5", "text": "Setting up a test for a population proportion (part C)", "ek": [{"code": "3.5.A", "text": "Identify an appropriate testing method for a population proportion including the parameter for the population proportion. [Skill 2.C]", "eks": [{"code": "3.5.A.1", "text": "A hypothesis test is a statistical inference procedure that is used to make a decision about the value of a population parameter. The appropriate hypothesis testing procedure is a one-sample z-test for a population proportion."}, {"code": "3.5.A.2", "text": "The parameter for a hypothesis test for a population proportion should reference the population parameter, the response variable, and the population in context."}]}, {"code": "3.5.B", "text": "Identify the null and alternative hypotheses for a population proportion. [Skill 2.E]", "eks": [{"code": "3.5.B.1", "text": "In the hypothesis testing procedure, the null hypothesis, $H_0$, is the statement about a parameter that is assumed to be correct unless there is convincing statistical evidence suggesting otherwise. It is the status quo condition. The alternative hypothesis, $H_a$, is the claim or belief about a parameter for which evidence is being collected. A researcher’s claim or belief about the population parameter is represented by the alternative hypothesis."}, {"code": "3.5.B.2", "text": "The null hypothesis contains an equality reference ($=$, $\\ge$, or $\\le$). Although the null hypothesis for a one-sided test may include an inequality symbol, in AP Statistics it is tested at the boundary of equality. The alternative hypothesis with $<$ or $>$ is called one-sided, and the alternative hypothesis with $\\ne$ is called two-sided."}, {"code": "3.5.B.3", "text": "The null hypothesis for a one-sample $z$-test for a population proportion is as follows: $H_0: p=p_0$, where $p_0$ is the null hypothesized value for the population proportion. A one-sided alternative hypothesis for a one-sample $z$-test for a population proportion is either $H_a: p<p_0$ or $H_a: p>p_0$. A two-sided alternative hypothesis is $H_a: p\\ne p_0$."}]}, {"code": "3.5.C", "text": "Justify the appropriateness of a hypothesis test for a population proportion by verifying conditions. [Skill 4.E]", "eks": [{"code": "3.5.C.1", "text": "A one-sample $z$-test for a population proportion requires that three conditions be met:\n3.5.C.1.i The randomization condition—the data should be collected using a random sample.\n3.5.C.1.ii The 10% condition—when sampling without replacement, the population size must be at least 10 times larger than the sample size ($n\\le 10\\%N$), where $N$ is the size of the population and $n$ is the sample size.\n3.5.C.1.iii The normality condition—the expected number of successes, $np_0$, and the expected number of failures, $n(1-p_0)$, should be at least 10."}]}]}, {"code": "CED 3.6", "text": "p-values", "ek": [{"code": "3.6.A", "text": "Interpret the p-value of a hypothesis test for a population proportion. [Skill 4.F]", "eks": [{"code": "3.6.A.1", "text": "Given the null hypothesis is true, there is a probability distribution of the test statistic called the null distribution. Using the null distribution, the $p$-value is the probability of obtaining a test statistic as extreme or more extreme (i.e., in the direction of the alternative hypothesis) than the test statistic that is observed given that the null hypothesis is true. That is, when $x$ is the test statistic, the $p$-value is determined by finding the following:\n3.6.A.1.i The probability at or above the observed value of the test statistic ($P(z\\ge x)$), if the alternative is $>$\n3.6.A.1.ii The probability at or below the observed value of the test statistic ($P(z\\le x)$), if the alternative is $<$\n3.6.A.1.iii The probability less than or equal to the negative of the absolute value of the test statistic plus the probability greater than or equal to the absolute value of the test statistic, ($P(z\\le -|x|)+P(z\\ge |x|)$), if the alternative is $\\ne$"}, {"code": "3.6.A.2", "text": "If the distribution of the test statistic has been simulated, the $p$-value is the proportion of values in the null distribution that are as extreme or more extreme than the observed value of the test statistic. This is as follows:\n3.6.A.2.i The proportion at or above the observed value of the test statistic, if the alternative is $>$\n3.6.A.2.ii The proportion at or below the observed value of the test statistic, if the alternative is $<$\n3.6.A.2.iii The proportion less than or equal to the negative of the absolute value of the test statistic plus the proportion greater than or equal to the absolute value of the test statistic, if the alternative is $\\ne$"}, {"code": "3.6.A.3", "text": "An interpretation of the p-value of a hypothesis test for a population proportion should include a statement that the p-value is computed by assuming the null hypothesis is true (i.e., by assuming the true population proportion is equal to the particular value stated in the null hypothesis in context)."}, {"code": "3.6.A.4", "text": "Small p-values indicate that the observed value of the test statistic would be unusual if the null hypothesis were true and therefore provide evidence for the alternative hypothesis. The lower the p-value, the more convincing the statistical evidence for the alternative hypothesis."}, {"code": "3.6.A.5", "text": "p-values that are not small indicate that the observed value of the test statistic would not be unusual if the null hypothesis were true and therefore do not provide convincing statistical evidence for the alternative hypothesis, nor do they provide evidence that the null hypothesis is true."}]}]}, {"code": "CED 3.7", "text": "Carrying out a test for a population proportion", "ek": [{"code": "3.7.A", "text": "Calculate an appropriate test statistic and p-value for testing a hypothesis about a population proportion. [Skill 3.E]", "eks": [{"code": "3.7.A.1", "text": "The test statistic for testing a population proportion is $z=\\dfrac{\\hat{p}-p_0}{\\sqrt{\\dfrac{p_0(1-p_0)}{n}}}$. The $z$-statistic has a standard normal distribution when the null hypothesis is true."}, {"code": "3.7.A.2", "text": "The distribution of the test statistic assuming the null hypothesis is true (null distribution) can be approximated by a probability model (e.g., a theoretical distribution such as the standard normal distribution)."}, {"code": "3.7.A.3", "text": "The p-value of a one-sample z-test for a population proportion is found from the standard normal distribution using a table or technology."}]}, {"code": "3.7.B", "text": "Justify a claim about the population based on the results of a hypothesis test for a population proportion. [Skill 4.G]", "eks": [{"code": "3.7.B.1", "text": "The significance level of a hypothesis test, denoted by $\\alpha$, is the predetermined probability of rejecting the null hypothesis given that it is true. The significance level may be given or determined by the researcher. The relationship between a $p$-value and the significance level of a hypothesis test determines whether a result is statistically significant."}, {"code": "3.7.B.2", "text": "A formal decision in a hypothesis test explicitly compares the $p$-value to the significance level, $\\alpha$. If the $p$-value $\\le\\alpha$, then reject the null hypothesis, $H_0: p=p_0$. If the $p$-value $>\\alpha$, then fail to reject the null hypothesis."}, {"code": "3.7.B.3", "text": "Rejecting the null hypothesis means there is convincing statistical evidence to support the alternative hypothesis. Failing to reject the null hypothesis means there is not convincing statistical evidence to support the alternative hypothesis."}, {"code": "3.7.B.4", "text": "A hypothesis test can lead to rejecting or not rejecting the null hypothesis but can never lead to concluding or proving that the null hypothesis is true. Lack of statistical evidence for the alternative hypothesis is not the same as evidence for the null hypothesis."}, {"code": "3.7.B.5", "text": "The results of a hypothesis test for a population proportion can serve as the statistical reasoning to support the answer to an investigative question about the population that was sampled."}, {"code": "3.7.B.6", "text": "A conclusion for the hypothesis test for a population proportion is stated in context consistent with, and in terms of, the alternative hypothesis using non-definitive language. The conclusion should contain a reference to the parameter and the population."}]}]}], "skills": ["Compute and interpret a p-value.", "Carry out a one-proportion z test and conclude."], "understandings": ["The p-value is the probability of a result at least this extreme if the null is true.", "A small p-value is evidence against the null, not proof the alternative is true."], "misconceptions": ["Interpreting the p-value as the probability the null is true.", "Concluding the null is true when the p-value is large."], "processes": ["State, plan, check conditions with the hypothesized p, compute with 1-PropZTest, conclude."], "exam": ["Conclusion compares the p-value with alpha, then states in context; skipping either loses marks."], "qr": "https://broth11.github.io/ap-stats/unit-3a.html#L7", "files": {"F": [{"l": "3.A.7.APStats.Handout", "h": "https://drive.google.com/file/d/18PrZPF6KFZGkGTkmWXA4QkvZcLfc4IY2/view", "k": "page", "x": ""}, {"l": "3.A.7.APStats.Handout.Key", "h": "https://drive.google.com/file/d/18HrDsH5_olEooE2SPSoK1mGF_OY1G8w9/view", "k": "page", "x": ""}, {"l": "3.A.7.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1gTg8FFixPXdohHqsC2-9Jaj2fzYrInnn/view", "k": "page", "x": ""}, {"l": "3.A.7.APStats.MasteryChecks.Key", "h": "https://drive.google.com/file/d/1ikvHnBydyxRaui1b4QswQ3vO8iMOPUQT/view", "k": "page", "x": ""}, {"l": "3.A.7.APStats.ThreeNewScenarios", "h": "https://drive.google.com/file/d/1vs6e2hnCxhwb6hp91Tsh64w0YL_Nn0Eh/view", "k": "page", "x": ""}, {"l": "AP Statistics 3.A.7 - One-Proportion Hypothesis Tests", "h": "https://drive.google.com/file/d/1CkHBPyKQ-YfDWF_8X8Q_jIQ1KqsQRDsc/view", "k": "page", "x": ""}, {"l": "AP Stats 3A7 Three New Scenarios Answer Key", "h": "https://drive.google.com/file/d/1lbg9IfTTwzZAKxGgEroEW7HCcX2KrLf-/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=Fzb_m7694ZU", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 3.5", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=35", "k": "brain", "x": ""}, {"l": "Stats Hub 3.6 & 3.7", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=36", "k": "brain", "x": ""}, {"l": "Practice Library 3.A.7", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=3-a&question=u3a61", "k": "brain", "x": ""}]}}, {"id": "L8", "n": 8, "ln": 8, "code": "3.A.8", "part": "3A", "partTitle": "Inference for One Proportion", "title": "Errors & Power", "summary": "A Type I error rejects a true null, a Type II error fails to reject a false null, and power is the chance of detecting a real effect. You describe each in context and tell study design problems from statistical error. The activity looks at the vaccine and autism claim and the measles outbreaks that followed.", "standards": [{"code": "CED 3.8", "text": "Potential errors when performing tests", "ek": [{"code": "3.8.A", "text": "Identify Type I and Type II errors. [Skill 2.D]", "eks": [{"code": "3.8.A.1", "text": "A Type I error occurs when there is convincing statistical evidence that the alternative hypothesis is true (due to the small p-value), but it is not."}, {"code": "3.8.A.2", "text": "A Type II error occurs when there is not convincing statistical evidence that the alternative hypothesis is true (due to the large p-value), but it is."}, {"code": "3.8.A.3", "text": "The power of a hypothesis test is the probability that a hypothesis test will correctly reject the false null hypothesis."}]}, {"code": "3.8.B", "text": "Calculate the probability of Type I and Type II errors. [Skill 3.C]", "eks": [{"code": "3.8.B.1", "text": "The probability of making a Type I error is defined as the significance level, α . For a given study and hypothesis test, the probability of making a Type I error is typically set to a small value (e.g., 0.01, 0.05, 0.10) prior to collecting the data."}, {"code": "3.8.B.2", "text": "The probability of making a Type II error is $1-\\text{power}$."}]}, {"code": "3.8.C", "text": "Identify the factors that affect the probability of errors in hypothesis testing. [Skill 2.D]", "eks": [{"code": "3.8.C.1", "text": "For a given study and hypothesis test, the probability of a Type II error should ideally be small, and thus, the power will be large (e.g., $P(\\text{Type II error})=0.20$ and $\\text{power}=0.80$). The probability of a Type II error decreases and the power increases when any one of the following occurs, provided the others do not change:\n3.8.C.1.i Sample size(s) increases.\n3.8.C.1.ii Standard error decreases.\n3.8.C.1.iii True parameter value is farther from the null hypothesis.\n3.8.C.1.iv Significance level ($\\alpha$) of a test increases."}]}, {"code": "3.8.D", "text": "Interpret Type I and Type II errors. [Skill 4.D]", "eks": [{"code": "3.8.D.1", "text": "In some studies, making a Type I error may have more serious consequences than making a Type II error. In other studies, making a Type II error may have more serious consequences than making a Type I error. The consequences of each error should be considered prior to conducting the study."}, {"code": "3.8.D.2", "text": "Because the significance level, $\\alpha$, is the probability of making a Type I error, the consequences of a Type I error influence decisions about a significance level."}, {"code": "3.8.D.3", "text": "Because sample size influences the probability of making a Type II error, the consequences of a Type II error influence decisions about how large the sample size should be."}]}]}], "skills": ["Describe Type I and Type II errors in context.", "Explain power and how to increase it."], "understandings": ["Alpha is the probability of a Type I error; power is one minus the probability of a Type II error.", "Larger samples increase power."], "misconceptions": ["Describing the error without context.", "Mixing up which error follows from rejecting or failing to reject."], "processes": ["State the error as a conclusion that is wrong, in context."], "exam": ["Define each error in the context of the problem."], "qr": "https://broth11.github.io/ap-stats/unit-3a.html#L8", "files": {"F": [{"l": "3.A.8.APStats.Handout", "h": "https://drive.google.com/file/d/1ti3zINqB9s152dCskbpjpJdrU49fcLWO/view", "k": "page", "x": ""}, {"l": "3.A.8.APStats.Handout.Key", "h": "https://drive.google.com/file/d/1U13wqfq-7hzSl2ExNFTiT7nmfDjle2b8/view", "k": "page", "x": ""}, {"l": "3.A.8.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1KdEriVPuDdY1hLdkbvVUkPxUnWjurBlU/view", "k": "page", "x": ""}, {"l": "3.A.8.APStats.MasteryChecks.Key", "h": "https://drive.google    "topic": "Errors & Power.",
   "standards": [
    {
     "code": "CED 3.8",
     "text": "Potential errors when performing tests",
     "ek": [
      {
       "code": "3.8.A",
       "text": "Identify Type I and Type II errors. [Skill 2.D]",
       "eks": [
        {
         "code": "3.8.A.1",
         "text": "A Type I error occurs when there is convincing statistical evidence that the alternative hypothesis is true (due to the small p-value), but it is not."
        },
        {
         "code": "3.8.A.2",
         "text": "A Type II error occurs when there is not convincing statistical evidence that the alternative hypothesis is true (due to the large p-value), but it is."
        },
        {
         "code": "3.8.A.3",
         "text": "The power of a hypothesis test is the probability that a hypothesis test will correctly reject the false null hypothesis."
        }
       ]
      },
      {
       "code": "3.8.B",
       "text": "Calculate the probability of Type I and Type II errors. [Skill 3.C]",
       "eks": [
        {
         "code": "3.8.B.1",
         "text": "The probability of making a Type I error is defined as the significance level, α . For a given study and hypothesis test, the probability of making a Type I error is typically set to a small value (e.g., 0.01, 0.05, 0.10) prior to collecting the data."
        },
        {
         "code": "3.8.B.2",
         "text": "The probability of making a Type II error is $1-\\text{power}$."
        }
       ]
      },
      {
       "code": "3.8.C",
       "text": "Identify the factors that affect the probability of errors in hypothesis testing. [Skill 2.D]",
       "eks": [
        {
         "code": "3.8.C.1",
         "text": "For a given study and hypothesis test, the probability of a Type II error should ideally be small, and thus, the power will be large (e.g., $P(\\text{Type II error})=0.20$ and $\\text{power}=0.80$). The probability of a Type II error decreases and the power increases when any one of the following occurs, provided the others do not change:\n3.8.C.1.i Sample size(s) increases.\n3.8.C.1.ii Standard error decreases.\n3.8.C.1.iii True parameter value is farther from the null hypothesis.\n3.8.C.1.iv Significance level ($\\alpha$) of a test increases."
        }
       ]
      },
      {
       "code": "3.8.D",
       "text": "Interpret Type I and Type II errors. [Skill 4.D]",
       "eks": [
        {
         "code": "3.8.D.1",
         "text": "In some studies, making a Type I error may have more serious consequences than making a Type II error. In other studies, making a Type II error may have more serious consequences than making a Type I error. The consequences of each error should be considered prior to conducting the study."
