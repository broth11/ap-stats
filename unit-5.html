<title>Unit 5 · Regression Analysis</title>
<style>button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}

:root{--ink:#0b0b0b;--paper:#f6f3ec;--grid:#e4dfd2;--orange:#ff4d00;--blue:#4b5cff;--indigo:#6366f1;--indigo-h:#4f46e5;--sh:4px 4px 0 var(--ink);--sans:ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 var(--sans);color:var(--ink);background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;padding:28px 16px 64px}
.wrap{max-width:1296px;margin:0 auto}
.hero{position:relative;background:var(--orange);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.08) 0 10px,transparent 10px 20px);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:26px 28px 24px;margin-bottom:34px}
.hero .eyebrow{font:800 13px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#fff}
.hero h1{font:900 clamp(30px,5vw,54px)/1.02 var(--sans);text-transform:uppercase;letter-spacing:.01em;color:#fff;margin:8px 0 12px;max-width:16ch;text-shadow:3px 3px 0 var(--ink)}
.hero p{max-width:62ch;background:#fff;border:2px solid var(--ink);box-shadow:var(--sh);padding:10px 14px;font-weight:500}
.sticker{position:absolute;right:22px;top:20px;background:#fff;border:2px solid var(--ink);box-shadow:var(--sh);padding:6px 14px;font:900 15px var(--sans);letter-spacing:.1em;text-transform:uppercase;transform:rotate(4deg)}
.units{display:flex;gap:8px;margin:0 0 26px;flex-wrap:wrap}
.units a{font:800 13px var(--mono);border:2px solid var(--ink);background:#fff;padding:6px 14px;box-shadow:3px 3px 0 var(--ink);color:var(--ink);text-decoration:none;transition:transform .15s,box-shadow .15s}
.units a:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.units a.on{background:var(--blue);color:#fff}
.card{background:#fff;border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:20px 22px 18px;margin-bottom:34px;background-image:linear-gradient(#f1eee6 1px,transparent 1px);background-size:100% 26px}
.card-top{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.num{font:900 44px/1 var(--sans);background:var(--blue);color:#fff;border:3px solid var(--ink);box-shadow:var(--sh);padding:8px 12px;min-width:76px;text-align:center}
h2{font:900 clamp(19px,2.4vw,26px)/1.1 var(--sans);text-transform:uppercase;letter-spacing:.01em}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.lab{font:800 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#555;margin-right:2px}
.chip{font:800 12px var(--mono);border:2px solid var(--ink);background:#e9ecff;padding:1px 8px;box-shadow:2px 2px 0 var(--ink)}
.card-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:30px;margin-top:18px}
h3{font:800 11.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#555;margin-bottom:7px}
ul{list-style:none;padding:0}li{position:relative;padding-left:20px;margin-bottom:6px;font-size:14px}
li::before{content:"";position:absolute;left:0;top:.38em;width:9px;height:9px;background:var(--orange);border:2px solid var(--ink)}
.card-body p{font-size:14.5px}
code{font:.92em var(--mono);background:#eee;padding:0 4px}
.cut{height:0;margin:18px 0 14px;border-top:2px dashed #999}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.col h3{margin-bottom:10px}.fbtns{display:grid;grid-template-columns:1fr;gap:10px}
.fbtn{display:flex;align-items:center;gap:10px;min-height:42px;padding:8px 12px;font:800 13px/1.2 var(--sans);text-transform:uppercase;letter-spacing:.03em;color:var(--ink);text-decoration:none;background:#fff;border:2px solid var(--ink);border-radius:4px;box-shadow:var(--sh);transition:transform .12s,box-shadow .12s,background .12s;min-width:0}
.fbtn span{min-width:0;overflow-wrap:anywhere}
.fbtn em{font:700 10px var(--mono);font-style:normal;color:#666}
.fbtn svg{flex:none;color:var(--blue)}
.fbtn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink);background:var(--blue);color:#fff}
.fbtn:hover svg{color:#fff}.fbtn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.none{color:#777;font-size:13px}
.foot{font:700 12px var(--mono);color:#555;text-align:center;margin-top:10px}
@media(max-width:760px){.cols{grid-template-columns:1fr;gap:16px}.card-top{grid-template-columns:auto 1fr}.card-body{grid-template-columns:1fr;gap:16px}.fbtns{grid-template-columns:1fr}.fbtn{min-height:46px}.sticker{position:static;display:inline-block;margin-bottom:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01s!important}}
body{padding-top:0}
.topbar{position:sticky;top:0;z-index:20;background:var(--ink);border-bottom:3px solid var(--ink);margin:0 -16px 26px;padding:0 16px}
.topbar-in{max-width:1296px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 0}
.topbar .course{font:900 14px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:#fff;margin-right:auto}
.topbar nav{display:flex;gap:8px}
.topbar .u{font:800 13px var(--mono);min-width:44px;text-align:center;border:2px solid #fff;background:#fff;color:var(--ink);padding:5px 12px;text-decoration:none;box-shadow:3px 3px 0 var(--orange);transition:transform .12s,box-shadow .12s}
.topbar .u:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--orange)}
.topbar .u.on{background:var(--blue);color:#fff}
.part{display:flex;align-items:stretch;margin:44px 0 22px;border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);background:#fff;scroll-margin-top:84px}

.part .pt{padding:10px 18px;display:flex;flex-direction:column;justify-content:center}

.part .pt span{font:800 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#555;margin-top:3px}
.jump{display:flex;gap:8px;margin:0 0 -18px;flex-wrap:wrap}
.jump button{font:800 13px var(--mono);border:2px solid var(--ink);background:#fff;padding:5px 12px;box-shadow:3px 3px 0 var(--ink);color:var(--ink);text-decoration:none}
.jump button:hover{background:var(--blue);color:#fff}

div.card-top{cursor:pointer}
div.card-top:hover h2,.lr-head:hover h2{color:var(--blue)}
.code-tag{display:block;font:800 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin-bottom:3px}
.card .chips{margin:12px 0 0}
div.blk{display:block;cursor:pointer;padding:8px 10px;margin:-8px -10px;border:2px solid transparent;transition:border-color .12s,background .12s}
div.blk:hover{border-color:var(--ink);background:#fffbe6}
.more{font:800 11px var(--mono);color:#555;margin-top:2px}
.lens{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 24px}
.tab{font:800 13px var(--mono);border:2px solid var(--ink);background:#fff;padding:6px 13px;box-shadow:3px 3px 0 var(--ink);color:var(--ink);text-decoration:none;transition:transform .12s,box-shadow .12s,background .12s}
.tab:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.tab.on{background:var(--blue);color:#fff}
.jump{margin:0 0 -18px}
.lr-head{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;cursor:pointer;margin-bottom:14px}

.sheet{position:fixed;inset:0;z-index:40;overflow:auto;background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;padding:0 16px 60px;outline:none}

.back{font:800 13px var(--mono);border:2px solid var(--ink);background:#fff;padding:6px 12px;box-shadow:3px 3px 0 var(--ink);color:var(--ink);text-decoration:none}
.back:hover{background:var(--blue);color:#fff}
.pager{display:flex;gap:8px}.pager button,.pager .off{font:800 13px var(--mono);border:2px solid var(--ink);background:#fff;padding:6px 12px;box-shadow:3px 3px 0 var(--ink);color:var(--ink);text-decoration:none}
.pager .off{opacity:.35;box-shadow:none}.pager button:hover{background:var(--blue);color:#fff}
.s-head{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;background:var(--orange);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:20px 24px;margin:8px 0 30px}

.s-grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:30px;align-items:start;margin-bottom:26px}

.s-main>.sec{margin-bottom:0}.s-main>.sec+.quad+.sec{margin-top:0}
.sec.focus{outline:4px solid var(--blue);outline-offset:3px}
.s-side .sec{margin-bottom:0}
@media(max-width:860px){.s-grid{grid-template-columns:1fr}.quad{grid-template-columns:1fr}.lr-body ul{columns:1}.s-head{grid-template-columns:1fr}}

a,a:hover,a:focus,a:visited,a:active{text-decoration:none!important}

*{text-decoration:none!important;text-decoration-color:transparent!important}

button.fbtn{width:100%;text-align:left}

.card{position:relative}
.card-top,.lr-head{padding-right:128px}

<script id="data" type="application/json">{"unit": 5, "teacher": false, "extra": null, "ced": "ced-5.html", "title": "Regression Analysis", "overview": "Describes the relationship between two quantitative variables with scatterplots, correlation and linear regression models.", "parts": [{"code": "5", "title": "Regression Analysis"}], "lessons": [{"id": "L1", "n": 1, "ln": 1, "code": "5.1", "part": "5", "partTitle": "Regression Analysis", "title": "Describing Two Quantitative Variables", "summary": "A scatterplot shows form, direction and strength, and the correlation coefficient r measures the strength of a linear relationship. You describe scatterplots and interpret r, and separate correlation from causation. The activity asks whether raising attendance would raise test scores.", "standards": [{"code": "CED 5.1", "text": "Graphical representations between two quantitative variables", "ek": [{"code": "5.1.A", "text": "Construct scatterplots depicting the relationship between two quantitative variables. [Skill 3.A]", "eks": [{"code": "5.1.A.1", "text": "A bivariate quantitative data set consists of observations of ordered pairs from two quantitative variables, collected from the same individuals in a sample or population, and can be used to construct a scatterplot."}, {"code": "5.1.A.2", "text": "A scatterplot shows the relationship between two quantitative variables for each observation, one corresponding to the value on the x-axis and one corresponding to the value on the y-axis. The explanatory variable is placed on the x-axis and is the variable whose values are used to explain or predict the corresponding values for the response variable, which is placed on the y-axis."}]}, {"code": "5.1.B", "text": "Describe the characteristics of a scatterplot. [Skill 4.A]", "eks": [{"code": "5.1.B.1", "text": "A description of the association shown in a scatterplot includes form, direction, strength, and unusual features."}, {"code": "5.1.B.2", "text": "The form of the association shown in a scatterplot, if any, can be described as linear or non-linear."}, {"code": "5.1.B.3", "text": "The direction of the association shown in a scatterplot, if any, can be described as positive or negative. A positive association means that as values of the explanatory variable increase, the values of the response variable tend to increase. A negative association means that as values of the explanatory variable increase, the values of the response variable tend to decrease."}, {"code": "5.1.B.4", "text": "The strength of the association shown in a scatterplot is how closely the points follow the general pattern. Strength can be described as strong, moderate, or weak."}, {"code": "5.1.B.5", "text": "Unusual features of a scatterplot include clusters of individual points or points that don’t fit in the general pattern of association between the two variables."}]}, {"code": "5.1.C", "text": "Justify a claim using scatterplots depicting the relationship between two quantitative variables. [Skill 4.B]", "eks": [{"code": "5.1.C.1", "text": "Scatterplots depicting the relationship between two numeric variables may reveal information that can be used to justify claims about the variable in context."}]}]}, {"code": "CED 5.2", "text": "Correlation (introduction)", "ek": [{"code": "5.2.A", "text": "Interpret the correlation for a linear relationship. [Skill 4.D]", "eks": [{"code": "5.2.A.1", "text": "The correlation coefficient, r, summarizes the strength and direction of the linear association between two quantitative variables. The correlation coefficient r is unit-free and always between −1 and 1, inclusive. A negative correlation coefficient value indicates a negative association, and a positive correlation coefficient value indicates a positive association."}, {"code": "5.2.A.2", "text": "The strength of the linear association is determined by how close the correlation coefficient is to −1 or 1. A value of r = 0 indicates that there is no linear association. A value of r = -1 or r = 1 indicates that there is a perfect linear association."}, {"code": "5.2.A.3", "text": "A correlation coefficient close to −1 or 1 does not necessarily mean that a linear model is appropriate."}, {"code": "5.2.A.4", "text": "A perceived or real relationship between two variables does not mean that changes in one variable cause changes in the other. That is, correlation does not necessarily imply causation."}]}]}], "skills": ["Make and describe scatterplots: direction, form, strength and unusual features.", "Identify explanatory and response variables."], "understandings": ["A scatterplot shows the form, direction and strength of an association.", "Explanatory goes on the x-axis."], "misconceptions": ["Swapping explanatory and response variables.", "Describing a plot with only direction."], "processes": ["Plot, then describe direction, form, strength, unusual points, in context."], "exam": ["Describe the association in context; a list of words without context earns partial credit."], "qr": "https://broth11.github.io/ap-stats/unit-5.html#L1", "files": {"F": [{"l": "5.1.APStats.Handout", "h": "https://drive.google.com/file/d/1UsEJ-KJZYw6zFpUGYXeTLp-wZjjq6tKt/view", "k": "page", "x": ""}, {"l": "5.1.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1qDg_2XA_Xg1iaKW82gBzlZ2F4M5PgEw-/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=EVIdV8JGbm4", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 5.1", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=51", "k": "brain", "x": ""}, {"l": "Stats Hub 5.2", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=52", "k": "brain", "x": ""}, {"l": "Practice Library (AP Statistics)", "h": "https://broth11.github.io/practice-library/#course=ap-statistics", "k": "brain", "x": ""}]}}, {"id": "L2", "n": 2, "ln": 2, "code": "5.2", "part": "5", "partTitle": "Regression Analysis", "title": "Linear Regression & Residuals", alues)."}, {"code": "5.4.C.2", "text": "Residual plots can be used to investigate the appropriateness of the linear regression model for the observed data."}, {"code": "5.4.C.3", "text": "The linear regression model should only be fit to the data if the data exhibit a linear trend. Apparent randomness in a residual plot for a linear regression model is confirmation of a linear form in the association between the two variables and indicates that the simple linear regression model is an appropriate model for the data."}, {"code": "5.4.C.4", "text": "Curvature in the residual plot for a linear regression model suggests that the linear model is not the most appropriate model for the data."}]}]}], "skills": ["Interpret r and know its properties.", "Write and interpret a least-squares line."], "understandings": ["r measures the strength of a linear association only.", "Correlation does not imply causation."], "misconceptions": ["Using r for a curved pattern.", "Interpreting r as the percent of points on the line."], "processes": ["Run LinReg, read r and the equation, then interpret slope and intercept."], "exam": ["Interpret slope as the predicted change in y for each one unit increase in x, in context."], "qr": "https://broth11.github.io/ap-stats/unit-5.html#L2", "files": {"F": [{"l": "5.2.APStats.Handout", "h": "https://drive.google.com/file/d/12yMQPY_ffp-4yJmlFwf-8_rooBrYtxCO/view", "k": "page", "x": ""}, {"l": "5.2.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/16elZzWGzwcA9m3Y3E4M9jleCnR8erOHr/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=i8StYTogxm0", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 5.3", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=53", "k": "brain", "x": ""}, {"l": "Stats Hub 5.4", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=54", "k": "brain", "x": ""}, {"l": "Practice Library (AP Statistics)", "h": "https://broth11.github.io/pract le. If the residual is negative, the model overpredicts (overestimates) the value of the response variable."}]}, {"code": "5.4.C", "text": "Describe the form of association of bivariate data using residual plots. [Skill 4.A]", "eks": [{"code": "5.4.C.1", "text": "A residual plot is a scatterplot of the residuals versus the predicted response values (or the explanatory variable values)."}, {"code": "5.4.C.2", "text": "Residual plots can be used to investigate the appropriateness of the linear regression model for the observed data."}, {"code": "5.4.C.3", "text": "The linear regression model should only be fit to the data if the data exhibit a linear trend. Apparent randomness in a residual plot for a linear regression model is confirmation of a linear form in the association between the two variables and indicates that the simple linear regression model is an appropriate model for the data."}, {"code": "5.4.C.4", "text": "Curvature in the residual plot for a linear regression model suggests that the linear model is not the most appropriate model for the data."}]}]}, {"code": "CED 5.5", "text": "Least-squares regression", "ek": [{"code": "5.5.A", "text": "Calculate the coefficients for the least-squares regression line model. [Skill 3.B]", "eks": [{"code": "5.5.A.1", "text": "", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAmAAAACNCAAAAAA1RZl5AAAiEElEQVR42u2deVxU9frHPwPMgAOCo6AimJY7eVsUxVzQXMZQMTUVMnfDzLrmUlZqFioVZmplaZq5ZJnhCoq5YKGgIMtdfN2yW2Z7Wd32+rmEn98fZ/uemTMwEHaz+33+mbN8l+fhPJwzc877+RwbIU3apbMA+SeQJhNMmkwwadJ8J1ixakBxZY1LfO8q9d5UfCn9Lrl0Q+867pfrJTJ5/DKSnK+trMpDEX2bM8PXnsxw83pyEvOQz0tnvl2pzJrPNrlIku4kc5PnAqMH5aKIfE3b8prXMFtJ0rmE0qq2AABIJ9neTfKOypNxUY9qZG7vzMRL+H9RLVcqs4njzOuPj/0sJykzAXtHqhv0BcNGPitPTP5akLYQHKotbQ8ZAADIPj9cb5Z1MQXADGVlSwpQeipFWck5f4ve6vjpBn2NoWcDAIo+bNVBGSIkGQCw/+sG/ZUGBd3VlocThf2HvkwVHTz4nys7A0Dpu8HDhE/FldwfVS+w/0fDjfwzI4GD3ysb8j+PUXKx9N2m6nxiYEgR4gOAL1oqrv+A/J4AjAVjLuBn86Saj9J8XCJJsuNQkszD4sho+5UkN0Zcc32d+cq+9OD21wXeQboymB49zxkZ+PL40KjA  response variable for a one- unit increase in the explanatory variable, and it should be interpreted in context."}, {"code": "5.5.B.3", "text": "The y-intercept in the least-squares regression line is the predicted value of the response variable when the explanatory variable is equal to 0, and it should be interpreted in context. Sometimes, the y-intercept of the line does not have a reasonable interpretation in context because x = 0 might be beyond the interval of x-values used to determine the regression line (extrapolation). At other times, the y-intercept of the line does not have a logical interpretation in context because it might be a negative value for a response variable that has no negative values, such as height."}]}]}], "skills": ["Compute and interpret residuals and use residual plots.", "Interpret r-squared and standard deviation of residuals."], "understandings": ["A residual is actual minus predicted; a pattern in the residual plot means the line is not appropriate.", "Extrapolation is unreliable."], "misconceptions": ["Subtracting in the wrong direction.", "Claiming a pattern-free residual plot means the relationship is strong."], "processes": ["Predict y-hat, subtract from y, plot residuals, check for pattern."], "exam": ["Interpret r-squared as the percent of variation in y explained by the linear model with x."], "qr": "https://broth11.github.io/ap-stats/unit-5.html#L3", "files": {"F": [{"l": "5.3.APStats.Handout", "h": "https://drive.google.com/file/d/1XqCWIuSTGTHaTSN3ZQfex5iW-YAHeTBg/view", "k": "page", "x": ""}, {"l": "5.3.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1PNBBXaUd-5AnXHROgtOB3vs9Ai9bmC86/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=3SN30w52VjA", "k": "video", "x": ""}, {"l": "Optional video (regression output)", "h": "https://www.youtube.com/watch?v=e8hxeiv9R6c", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 5.4", "h": "https://broth11.github.io/          "code": "5.4.B.1",
         "text": "If the residual is positive, the model underpredicts (underestimates) the value of the response variable. If the residual is negative, the model overpredicts (overestimates) the value of the response variable."
        }
       ]
      },
      {
       "code": "5.4.C",
       "text": "Describe the form of association of bivariate data using residual plots. [Skill 4.A]",
       "eks": [
        {
         "code": "5.4.C.1",
         "text": "A residual plot is a scatterplot of the residuals versus the predicted response values (or the explanatory variable values)."
        },
        {
         "code": "5.4.C.2",
         "text": "Residual plots can be used to investigate the appropriateness of the linear regression model for the observed data."
        },
        {
         "code": "5.4.C.3",
         "text": "The linear regression model should only be fit to the data if the data exhibit a linear trend. Apparent randomness in a residual plot for a linear regression model is confirmation of a linear form in the association between the two variables and indicates that the simple linear regression model is an appropriate model for the data."
        },
        {
         "code": "5.4.C.4",
         "text": "Curvature in the residual plot for a linear regression model suggests that the linear model is not the most appropriate model for the data."
        }

      {
       "code": "5.4.B",
       "text": "Interpret the differences between the observed and predicted values. [Skill 4.D]",
       "eks": [
        {
         "code": "5.4.B.1",
         "text": "If the residual is positive, the model underpredicts (underestimates) the value of the response variable. If the residual is negative, the model overpredicts (overestimates) the value of the response variable."
        }
       ]
      },
      {
       "code": "5.4.C",
       "text": "Describe the form of association of bivariate data using residual plots. [Skill 4.A]",
       "eks": [
        {
         "code": "5.4.C.1",
         "text": "A residual plot is a scatterplot of the residuals versus the predicted response values (or the explanatory variable values)."
        },
        {
         "code": "5.4.C.2",
         "text": "Residual plots can be used to investigate the appropriateness of the linear regression model for the observed data."
        },
        {
         "code": "5.4.C.3",
         "text": "The linear regression model should only be fit to the data if the data exhibit a linear trend. Apparent randomness in a residual plot for a linear regression model is confirmation of a linear form in the association between the two variables and indicates that the simple linear regression model is an appropriate model for the data."
        },
        {
         "code": "5.4.C.4",
         "text": "Curvature in the residual plot for a linear regression model suggests that the linear model is not the most appropriate model for the data."
        }
       ]
      }
     ]
    },
    {

     "text": "Least-squares regression",
     "ek": [
      {
       "code": "5.5.A",
       "text": "Calculate the coefficients for the least-squares regression line model. [Skill 3.B]",
       "eks": [
        {

       "text": "Interpret coefficients for the least-squares regression line model. [Skill 4.D]",
       "eks": [
        {
         "code": "5.5.B.1",
         "text": "The coefficients of the least-squares regression line model (line of best fit) are the slope, b, and the y-intercept, a, because they are based on a sample of values."
        },
        {
         "code": "5.5.B.2",
         "text": "The slope of the least-squares regression line can be interpreted as the predicted increase or decrease in the response variable for a one- unit increase in the explanatory variable, and it should be interpreted in context."
        },
        {
         "code": "5.5.B.3",
         "text": "The y-intercept in the least-squares regression line is the predicted value of the response variable when the explanatory variable is equal to 0, and it should be interpreted in context. Sometimes, the y-intercept of the line does not have a reasonable interpretation in context because x = 0 might be beyond the interval of x-values used to determine the regression line (extrapolation). At other times, the y-intercept of the line does not have a logical interpretation in context because it might be a negative value for a response variable that has no negative values, such as height."
        }
       ]
