<script id="data" type="application/json">{"unit": 5, "teacher": false, "extra": null, "ced": "ced-5.html", "title": "Regression Analysis", "overview": "Describes the relationship between two quantitative variables with scatterplots, correlation and linear regression models.", "parts": [{"code": "5", "title": "Regression Analysis"}], "lessons": [{"id": "L1", "n": 1, "ln": 1, "code": "5.1", "part": "5", "partTitle": "Regression Analysis", "title": "Describing Two Quantitative Variables", "summary": "A scatterplot shows form, direction and strength, and the correlation coefficient r measures the strength of a linear relationship. You describe scatterplots and interpret r, and separate correlation from causation. The activity asks whether raising attendance would raise test scores.", "standards": [{"code": "CED 5.1", "text": "Graphical representations between two quantitative variables", "ek": [{"code": "5.1.A", "text": "Construct scatterplots depicting the relationship between two quantitative variables. [Skill 3.A]", "eks": [{"code": "5.1.A.1", "text": "A bivariate quantitative data set consists of observations of ordered pairs from two quantitative variables, collected from the same individuals in a sample or population, and can be used to construct a scatterplot."}, {"code": "5.1.A.2", "text": "A scatterplot shows the relationship between two quantitative variables for each observation, one corresponding to the value on the x-axis and one corresponding to the value on the y-axis. The explanatory variable is placed on the x-axis and is the variable whose values are used to explain or predict the corresponding values for the response variable, which is placed on the y-axis."}]}, {"code": "5.1.B", "text": "Describe the characteristics of a scatterplot. [Skill 4.A]", "eks": [{"code": "5.1.B.1", "text": "A description of the association shown in a scatterplot includes form, direction, strength, and unusual features."}, {"code": "5.1.B.2", "text": "The form of the association shown in a scatterplot, if any, can be described as linear or non-linear."}, {"code": "5.1.B.3", "text": "The direction of the association shown in a scatterplot, if any, can be described as positive or negative. A positive association means that as values of the explanatory variable increase, the values of the response variable tend to increase. A negative association means that as values of the explanatory variable increase, the values of the response variable tend to decrease."}, {"code": "5.1.B.4", "text": "The strength of the association shown in a scatterplot is how closely the points follow the general pattern. Strength can be described as strong, moderate, or weak."}, {"code": "5.1.B.5", "text": "Unusual features of a scatterplot include clusters of individual points or points that don’t fit in the general pattern of association between the two variables."}]}, {"code": "5.1.C", "text": "Justify a claim using scatterplots depicting the relationship between two quantitative variables. [Skill 4.B]", "eks": [{"code": "5.1.C.1", "text": "Scatterplots depicting the relationship between two numeric variables may reveal information that can be used to justify claims about the variable in context."}]}]}, {"code": "CED 5.2", "text": "Correlation (introduction)", "ek": [{"code": "5.2.A", "text": "Interpret the correlation for a linear relationship. [Skill 4.D]", "eks": [{"code": "5.2.A.1", "text": "The correlation coefficient, r, summarizes the strength and direction of the linear association between two quantitative variables. The correlation coefficient r is unit-free and always between −1 and 1, inclusive. A negative correlation coefficient value indicates a negative association, and a positive correlation coefficient value indicates a positive association."}, {"code": "5.2.A.2", "text": "The strength of the linear association is determined by how close the correlation coefficient is to −1 or 1. A value of r = 0 indicates that there is no linear association. A value of r = -1 or r = 1 indicates that there is a perfect linear association."}, {"code": "5.2.A.3", "text": "A correlation coefficient close to −1 or 1 does not necessarily mean that a linear model is appropriate."}, {"code": "5.2.A.4", "text": "A perceived or real relationship between two variables does not mean that changes in one variable cause changes in the other. That is, correlation does not necessarily imply causation."}]}]}], "skills": ["Make and describe scatterplots: direction, form, strength and unusual features.", "Identify explanatory and response variables."], "understandings": ["A scatterplot shows the form, direction and strength of an association.", "Explanatory goes on the x-axis."], "misconceptions": ["Swapping explanatory and response variables.", "Describing a plot with only direction."], "processes": ["Plot, then describe direction, form, strength, unusual points, in context."], "exam": ["Describe the association in context; a list of words without context earns partial credit."], "qr": "https://broth11.github.io/ap-stats/unit-5.html#L1", "files": {"F": [{"l": "5.1.APStats.Handout", "h": "https://drive.google.com/file/d/1UsEJ-KJZYw6zFpUGYXeTLp-wZjjq6tKt/view", "k": "page", "x": ""}, {"l": "5.1.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1qDg_2XA_Xg1iaKW82gBzlZ2F4M5PgEw-/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=EVIdV8JGbm4", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 5.1", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=51", "k": "brain", "x": ""}, {"l": "Stats Hub 5.2", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=52", "k": "brain", "x": ""}, {"l": "Practice Library (AP Statistics)", "h": "https://broth11.github.io/practice-library/#course=ap-statistics", "k": "brain", "x": ""}]}}, {"id": "L2", "n": 2, "ln": 2, "code": "5.2", "part": "5", "partTitle": "Regression Analysis", "title": "Linear Regression & Residuals", "summary": "A linear regression model predicts y from x with a slope and a y-intercept. You interpret both, make predictions by interpolation and avoid extrapolation, and read residual plots. The activity asks how colleges should evaluate standardized test scores.", "standards": [{"code": "CED 5.3", "text": "Linear regression models (correlation and the line)", "ek": [{"code": "5.3.A", "text": "Calculate a predicted response value using a linear regression model. [Skill 3.B]", "eks": [{"code": "5.3.A.1", "text": "If the form of the relationship between x and y appears linear, we can approximate the relationship between x and y using a linear regression model, which is a linear equation that uses an explanatory variable, x, to predict the response variable, y."}, {"code": "5.3.A.2", "text": "In a linear regression model, the predicted response value, denoted by $\\hat{y}$, is calculated as $\\hat{y}=a+bx$, where $a$ is the $y$-intercept, $b$ is the slope of the regression line, and $x$ is the explanatory variable."}, {"code": "5.3.A.3", "text": "Extrapolation is predicting a response value using a value for the explanatory variable that is beyond the interval of x-values used to determine the regression line. The predicted value is less reliable the further the estimate is extrapolated."}, {"code": "5.3.A.4", "text": "Interpolation is predicting a response value using a value for the explanatory variable that is within the interval of x-values used to determine the regression line."}]}]}, {"code": "CED 5.4", "text": "Residuals (introduction)", "ek": [{"code": "5.4.A", "text": "Calculate the differences between the observed and predicted values. [Skill 3.B]", "eks": [{"code": "5.4.A.1", "text": "A residual is the difference between the observed response value and the predicted response value for the given value of the explanatory variable: $\\text{residual}=y-\\hat{y}$ or ($\\text{residual}=\\text{observed } y-\\text{predicted } y$)."}]}, {"code": "5.4.B", "text": "Interpret the differences between the observed and predicted values. [Skill 4.D]", "eks": [{"code": "5.4.B.1", "text": "If the residual is positive, the model underpredicts (underestimates) the value of the response variable. If the residual is negative, the model overpredicts (overestimates) the value of the response variable."}]}, {"code": "5.4.C", "text": "Describe the form of association of bivariate data using residual plots. [Skill 4.A]", "eks": [{"code": "5.4.C.1", "text": "A residual plot is a scatterplot of the residuals versus the predicted response values (or the explanatory variable values)."}, {"code": "5.4.C.2", "text": "Residual plots can be used to investigate the appropriateness of the linear regression model for the observed data."}, {"code": "5.4.C.3", "text": "The linear regression model should only be fit to the data if the data exhibit a linear trend. Apparent randomness in a residual plot for a linear regression model is confirmation of a linear form in the association between the two variables and indicates that the simple linear regression model is an appropriate model for the data."}, {"code": "5.4.C.4", "text": "Curvature in the residual plot for a linear regression model suggests that the linear model is not the most appropriate model for the data."}]}]}], "skills": ["Interpret r and know its properties.", "Write and interpret a least-squares line."], "understandings": ["r measures the strength of a linear association only.", "Correlation does not imply causation."], "misconceptions": ["Using r for a curved pattern.", "Interpreting r as the percent of points on the line."], "processes": ["Run LinReg, read r and the equation, then interpret slope and intercept."], "exam": ["Interpret slope as the predicted change in y for each one unit increase in x, in context."], "qr": "https://broth11.github.io/ap-stats/unit-5.html#L2", "files": {"F": [{"l": "5.2.APStats.Handout", "h": "https://drive.google.com/file/d/12yMQPY_ffp-4yJmlFwf-8_rooBrYtxCO/view", "k": "page", "x": ""}, {"l": "5.2.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/16elZzWGzwcA9m3Y3E4M9jleCnR8erOHr/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=i8StYTogxm0", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 5.3", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=53", "k": "brain", "x": ""}, {"l": "Stats Hub 5.4", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=54", "k": "brain", "x": ""}, {"l": "Practice Library (AP Statistics)", "h": "https://broth11.github.io/practice-library/#course=ap-statistics", "k": "brain", "x": ""}]}}, {"id": "L3", "n": 3, "ln": 3, "code": "5.3", "part": "5", "partTitle": "Regression Analysis", "title": "Least-Squares Regression", "summary": "The least-squares regression line minimizes the sum of squared residuals. You read computer output, interpret the slope and y-intercept, and interpret r-squared as the share of variation explained. The activity models the link between neighborhood income and access to organic food.", "standards": [{"code": "CED 5.4", "text": "Residuals", "ek": [{"code": "5.4.A", "text": "Calculate the differences between the observed and predicted values. [Skill 3.B]", "eks": [{"code": "5.4.A.1", "text": "A residual is the difference between the observed response value and the predicted response value for the given value of the explanatory variable: $\\text{residual}=y-\\hat{y}$ or ($\\text{residual}=\\text{observed } y-\\text{predicted } y$)."}]}, {"code": "5.4.B", "text": "Interpret the differences between the observed and predicted values. [Skill 4.D]", "eks": [{"code": "5.4.B.1", "text": "If the residual is positive, the model underpredicts (underestimates) the value of the response variable. If the residual is negative, the model overpredicts (overestimates) the value of the response variable."}]}, {"code": "5.4.C", "text": "Describe the form of association of bivariate data using residual plots. [Skill 4.A]", "eks": [{"code": "5.4.C.1", "text": "A residual plot is a scatterplot of the residuals versus the predicted response values (or the explanatory variable values)."}, {"code": "5.4.C.2", "text": "Residual plots can be used to investigate the appropriateness of the linear regression model for the observed data."}, {"code": "5.4.C.3", "text": "The linear regression model should only be fit to the data if the data exhibit a linear trend. Apparent randomness in a residual plot for a linear regression model is confirmation of a linear form in the association between the two variables and indicates that the simple linear regression model is an appropriate model for the data."}, {"code": "5.4.C.4", "text": "Curvature in the residual plot for a linear regression model suggests that the linear model is not the most appropriate model for the data."}]}]}, {"code": "CED 5.5", "text": "Least-squares regression", "ek": [{"code": "5.5.A", "text": "Calculate the coefficients for the least-squares regression line model. [Skill 3.B]", "eks": [{"code": "5.5.A.1", "text": "The simple linear regression model is fit to the data by minimizing the sum of the squares of the residuals. Because of this, the resulting equation is often called the least-squares regression line ($LSRL$) and is calculated using technology. This regression line will pass through the point $(\\bar{x},\\bar{y})$."}, {"code": "5.5.A.2", "text": "The slope of the regression line, b, is calculated using technology."}, {"code": "5.5.A.3", "text": "The y-intercept of the regression line, a, is calculated using technology."}, {"code": "5.5.A.4", "text": "In simple linear regression, the correlation coefficient, r, is calculated using technology."}, {"code": "5.5.A.5", "text": "In simple linear regression, the square of the correlation coefficient, $r^{2}$, is called the coefficient of determination. The value of $r^{2}$ is the proportion of variation in the response variable that is explained by the linear relationship with the explanatory variable."}]}, {"code": "5.5.B", "text": "Interpret coefficients for the least-squares regression line model. [Skill 4.D]", "eks": [{"code": "5.5.B.1", "text": "The coefficients of the least-squares regression line model (line of best fit) are the slope, b, and the y-intercept, a, because they are based on a sample of values."}, {"code": "5.5.B.2", "text": "The slope of the least-squares regression line can be interpreted as the predicted increase or decrease in the response variable for a one-unit increase in the explanatory variable, and it should be interpreted in context."}, {"code": "5.5.B.3", "text": "The y-intercept in the least-squares regression line is the predicted value of the response variable when the explanatory variable is equal to 0, and it should be interpreted in context. Sometimes, the y-intercept of the line does not have a reasonable interpretation in context because x = 0 might be beyond the interval of x-values used to determine the regression line (extrapolation). At other times, the y-intercept of the line does not have a logical interpretation in context because it might be a negative value for a response variable that has no negative values, such as height."}]}]}], "skills": ["Compute and interpret residuals and use residual plots.", "Interpret r-squared and standard deviation of residuals."], "understandings": ["A residual is actual minus predicted; a pattern in the residual plot means the line is not appropriate.", "Extrapolation is unreliable."], "misconceptions": ["Subtracting in the wrong direction.", "Claiming a pattern-free residual plot means the relationship is strong."], "processes": ["Predict y-hat, subtract from y, plot residuals, check for pattern."], "exam": ["Interpret r-squared as the percent of variation in y explained by the linear model with x."], "qr": "https://broth11.github.io/ap-stats/unit-5.html#L3", "files": {"F": [{"l": "5.3.APStats.Handout", "h": "https://drive.google.com/file/d/1XqCWIuSTGTHaTSN3ZQfex5iW-YAHeTBg/view", "k": "page", "x": ""}, {"l": "5.3.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1PNBBXaUd-5AnXHROgtOB3vs9Ai9bmC86/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=3SN30w52VjA", "k": "video", "x": ""}, {"l": "Optional video (regression output)", "h": "https://www.youtube.com/watch?v=e8hxeiv9R6c", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 5.4", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=54", "k": "brain", "x": ""}, {"l": "Stats Hub 5.5", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=55", "k": "brain", "x": ""}, {"l": "Practice Library (AP Statistics)", "h": "https://broth11.github.io/practice-library/#course=ap-statistics", "k": "brain", "x": ""}]}}]}</script>
