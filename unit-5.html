<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unit 5 · Regression Analysis</title>
<style>button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}

:root{--ink:#0b0b0b;--paper:#f6f3ec;--grid:#e4dfd2;--orange:#ff4d00;--blue:#4b5cff;--indigo:#6366f1;--indigo-h:#4f46e5;--sh:4px 4px 0 var(--ink);--sans:ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 var(--sans);color:var(--ink);background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;padding:28px 16px 64px}
.wrap{max-width:1080px;margin:0 auto}
.hero{position:relative;background:var(--orange);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.08) 0 10px,transparent 10px 20px);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:26px 28px 24px;margin-bottom:34px}
.hero .eyebrow{font:800 13px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#fff}
.hero h1{font:900 clamp(30px,5vw,54px)/1.02 var(--sans);text-transform:uppercase;letter-spacing:.01em;color:#fff;margin:8px 0 12px;max-width:16ch;text-shadow:3px 3px 0 var(--ink)}
.hero p{max-width:62ch;background:#fff;border:2px solid var(--ink);box-shadow:var(--sh);padding:10px 14px;font-weight:500}
.sticker{position:absolute;right:22px;top:20px;background:#fff;border:2px solid var(--ink);box-shadow:var(--sh);padding:6px 14px;font:900 15px var(--sans);letter-spacing:.1em;text-transform:uppercase;transform:rotate(4deg)}
.units{display:flex;gap:8px;margin:0 0 26px;flex-wrap:wrap}
.units a{font:800 13px var(--mono);border:2px solid var(--ink);background:#fff;padding:6px 14px;box-shadow:3px 3px 0 var(--ink);color:var(--ink);text-decoration:none;transition:transform .15s,box-shadow .15s}
.units a:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.units a.on{background:var(--blue);color:#fff}
.card{background:#fff;border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:20px 22px 18px;margin-bottom:34px;background-image:linear-gradient(#f1eee6 1px,transparent 1px);background-size:100% 26px}
.card-top{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.num{font:900 44px/1 var(--sans);background:var(--blue);color:#fff;border:3px solid var(--ink);box-shadow:var(--sh);padding:8px 12px;min-width:76px;text-align:center}
h2{font:900 clamp(19px,2.4vw,26px)/1.1 var(--sans);text-transform:uppercase;letter-spacing:.01em}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.lab{font:800 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#555;margin-right:2px}
.chip{font:800 12px var(--mono);border:2px solid var(--ink);background:#e9ecff;padding:1px 8px;box-shadow:2px 2px 0 var(--ink)}
.card-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:30px;margin-top:18px}
h3{font:800 11.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#555;margin-bottom:7px}
ul{list-style:none;padding:0}li{position:relative;padding-left:20px;margin-bottom:6px;font-size:14px}
li::before{content:"";position:absolute;left:0;top:.38em;width:9px;height:9px;background:var(--orange);border:2px solid var(--ink)}
.card-body p{font-size:14.5px}
code{font:.92em var(--mono);background:#eee;padding:0 4px}
.cut{height:0;margin:18px 0 14px;border-top:2px dashed #999}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.col h3{margin-bottom:10px}.fbtns{display:grid;grid-template-columns:1fr;gap:10px}
.fbtn{display:flex;align-items:center;gap:10px;min-height:42px;padding:8px 12px;font:800 13px/1.2 var(--sans);text-transform:uppercase;letter-spacing:.03em;color:var(--ink);text-decoration:none;background:#fff;border:2px solid var(--ink);border-radius:4px;box-shadow:var(--sh);transition:transform .12s,box-shadow .12s,background .12s;min-width:0}
.fbtn span{min-width:0;overflow-wrap:anywhere}
.fbtn em{font:700 10px var(--mono);font-style:normal;color:#666}
.fbtn svg{flex:none;color:var(--blue)}
.fbtn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink);background:var(--blue);color:#fff}
.fbtn:hover svg{color:#fff}.fbtn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.none{color:#777;font-size:13px}
.foot{font:700 12px var(--mono);color:#555;text-align:center;margin-top:10px}
@media(max-width:760px){.cols{grid-template-columns:1fr;gap:16px}.card-top{grid-template-columns:auto 1fr}.card-body{grid-template-columns:1fr;gap:16px}.fbtns{grid-template-columns:1fr}.fbtn{min-height:46px}.sticker{position:static;display:inline-block;margin-bottom:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01s!important}}
body{padding-top:0}
.topbar{position:sticky;top:0;z-index:20;background:var(--ink);border-bottom:3px solid var(--ink);margin:0 -16px 26px;padding:0 16px}
.topbar-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 0}
.topbar .course{font:900 14px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:#fff;margin-right:auto}
.topbar nav{display:flex;gap:8px}
.topbar .u{font:800 13px var(--mono);min-width:44px;text-align:center;border:2px solid #fff;background:#fff;color:var(--ink);padding:5px 12px;text-decoration:none;box-shadow:3px 3px 0 var(--orange);transition:transform .12s,box-shadow .12s}
.topbar .u:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--orange)}
.topbar .u.on{background:var(--blue);color:#fff}
.part{display:flex;align-items:stretch;margin:44px 0 22px;border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);background:#fff;scroll-margin-top:84px}
.part .code{font:900 34px/1 var(--sans);background:var(--orange);color:#fff;padding:12px 18px;border-right:3px solid var(--ink);display:flex;align-items:center;text-shadow:2px 2px 0 var(--ink)}
.part .pt{padding:10px 18px;display:flex;flex-direction:column;justify-content:center}
.part .pt b{font:900 clamp(17px,2.2vw,24px)/1.1 var(--sans);text-transform:uppercase}
.part .pt span{font:800 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#555;margin-top:3px}
.jump{display:flex;gap:8px;margin:0 0 -18px;flex-wrap:wrap}
.jump button{font:800 13px var(--mono);border:2px solid var(--ink);background:#fff;padding:5px 12px;box-shadow:3px 3px 0 var(--ink);color:var(--ink);text-decoration:none}
.jump button:hover{background:var(--blue);color:#fff}

div.card-top{cursor:pointer}
div.card-top:hover h2,.lr-head:hover h2{color:var(--blue)}
.code-tag{display:block;font:800 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin-bottom:3px}
.card .chips{margin:12px 0 0}
div.blk{display:block;cursor:pointer;padding:8px 10px;margin:-8px -10px;border:2px solid transparent;transition:border-color .12s,background .12s}
div.blk:hover{border-color:var(--ink);background:#fffbe6}
.more{font:800 11px var(--mono);color:#555;margin-top:2px}
.lens{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 24px}
.tab{font:800 13px var(--mono);border:2px solid var(--ink);background:#fff;padding:6px 13px;box-shadow:3px 3px 0 var(--ink);color:var(--ink);text-decoration:none;transition:transform .12s,box-shadow .12s,background .12s}
.tab:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.tab.on{background:var(--blue);color:#fff}
.jump{margin:0 0 -18px}
.lr-head{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;cursor:pointer;margin-bottom:14px}
.lr-head .num{font-size:30px;min-width:60px;padding:6px 8px}
.lrow{padding:16px 20px;box-shadow:6px 6px 0 var(--ink);margin-bottom:26px}
.lr-body ul{columns:2;column-gap:36px}.lr-body li{break-inside:avoid}
.lr-body .cols{margin-top:2px}
.stds{display:grid;grid-template-columns:62px 1fr;gap:8px 12px}
.stds dt{font:800 12px var(--mono);border:2px solid var(--ink);background:#e9ecff;padding:1px 6px;height:fit-content;text-align:center;box-shadow:2px 2px 0 var(--ink)}
.stds dd{font-size:13.5px}
body.locked{overflow:hidden}
.sheet{position:fixed;inset:0;z-index:40;overflow:auto;background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;padding:0 16px 60px;outline:none}
.sheet-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0}
.back{font:800 13px var(--mono);border:2px solid var(--ink);background:#fff;padding:6px 12px;box-shadow:3px 3px 0 var(--ink);color:var(--ink);text-decoration:none}
.back:hover{background:var(--blue);color:#fff}
.pager{display:flex;gap:8px}.pager button,.pager .off{font:800 13px var(--mono);border:2px solid var(--ink);background:#fff;padding:6px 12px;box-shadow:3px 3px 0 var(--ink);color:var(--ink);text-decoration:none}
.pager .off{opacity:.35;box-shadow:none}.pager button:hover{background:var(--blue);color:#fff}
.s-head{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;background:var(--orange);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:20px 24px;margin:8px 0 30px}

.s-head .num{font-size:48px;background:#fff;color:var(--ink)}
.s-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:30px;align-items:start;margin-bottom:26px}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:22px 0}
.sec{background:#fff;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:16px 18px;margin-bottom:0}
.s-main>.sec{margin-bottom:0}.s-main>.sec+.quad+.sec{margin-top:0}
.sec.focus{outline:4px solid var(--blue);outline-offset:3px}
.s-side .sec{margin-bottom:0}
@media(max-width:860px){.s-grid{grid-template-columns:1fr}.quad{grid-template-columns:1fr}.lr-body ul{columns:1}.s-head{grid-template-columns:1fr}}

a,a:hover,a:focus,a:visited,a:active{text-decoration:none!important}

*{text-decoration:none!important;text-decoration-color:transparent!important}

button.fbtn{width:100%;text-align:left}

.card{position:relative}
.card-top,.lr-head{padding-right:128px}
.qr{position:absolute;top:14px;right:16px;width:102px;height:102px;padding:0;background:#fff;border:3px solid var(--ink);box-shadow:var(--sh);cursor:pointer;z-index:2;transition:transform .12s}
.qr:hover{transform:translate(-2px,-2px)}
.qr:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.qr svg{display:block;width:100%;height:100%}

.qrm-url{font:600 13px var(--mono);color:#555;word-break:break-all}

@media(prefers-reduced-motion:reduce){.qr{transition:none}}

.ek{margin-top:8px}.ek summary{cursor:pointer;font:800 12px var(--mono)}
.ek .lo{margin:12px 0 4px;font-weight:700}.ek .lo b{font:800 12px var(--mono);margin-right:4px}
.eks{list-style:none;padding:0;display:grid;gap:8px}.eks li{display:grid;grid-template-columns:62px 1fr;gap:10px}

@media(max-width:600px){.eks li{grid-template-columns:1fr;gap:0}}

<script id="data" type="application/json">{"unit": 5, "title": "Regression Analysis", "overview": "Describes the relationship between two quantitative variables with scatterplots, correlation and linear regression models.", "parts": [{"code": "5", "title": "Regression Analysis"}], "lessons": [{"id": "L1", "n": 1, "ln": 1, "code": "5.1", "part": "5", "partTitle": "Regression Analysis", "title": "Describing Two Quantitative Variables", "summary": "A scatterplot shows form, direction and strength, and the correlation coefficient r measures the strength of a linear relationship. You describe scatterplots and interpret r, and separate correlation from causation. The activity asks whether raising attendance would raise test scores.", "standards": [{"code": "CED 5.1", "text": "Graphical representations between two quantitative variables", "ek": [{"code": "5.1.A", "text": "Construct scatterplots depicting the relationship between two quantitative variables. [Skill 3.A]", "eks": [{"code": "5.1.A.1", "text": "A bivariate quantitative data set consists of observations of ordered pairs from two quantitative variables, collected from the same individuals in a sample or population, and can be used to construct a scatterplot."}, {"code": "5.1.A.2", "text": "A scatterplot shows the relationship between two quantitative variables for each observation, one corresponding to the value on the x-axis and one corresponding to the value on the y-axis. The explanatory variable is placed on the x-axis and is the variable whose values are used to explain or predict the corresponding values for the response variable, which is placed on the y-axis."}]}, {"code": "5.1.B", "text": "Describe the characteristics of a scatterplot. [Skill 4.A]", "eks": [{"code": "5.1.B.1", "text": "A description of the association shown in a scatterplot includes form, direction, strength, and unusual features."}, {"code": "5.1.B.2", "text": "The form of the association shown in a scatterplot, if any, can be described as linear or non-linear."}, {"code": "5.1.B.3", "text": "The direction of the association shown in a scatterplot, if any, can be described as positive or negative. A positive association means that as values of the explanatory variable increase, the values of the response variable tend to increase. A negative association means that as values of the explanatory variable increase, the values of the response variable tend to decrease."}, {"code": "5.1.B.4", "text": "The strength of the association shown in a scatterplot is how closely the points follow the general pattern. Strength can be described as strong, moderate, or weak."}, {"code": "5.1.B.5", "text": "Unusual features of a scatterplot include clusters of individual points or points that don’t fit in the general pattern of association between the two variables."}]}, {"code": "5.1.C", "text": "Justify a claim using scatterplots depicting the relationship between two quantitative variables. [Skill 4.B]", "eks": [{"code": "5.1.C.1", "text": "Scatterplots depicting the relationship between two numeric variables may reveal information that can be used to justify claims about the variable in context."}]}]}, {"code": "CED 5.2", "text": "Correlation (introduction)", "ek": [{"code": "5.2.A", "text": "Interpret the correlation for a linear relationship. [Skill 4.D]", "eks": [{"code": "5.2.A.1", "text": "The correlation coefficient, r, summarizes the strength and direction of the linear association between two quantitative variables. The correlation coefficient r is unit-free and always between −1 and 1, inclusive. A negative correlation coefficient value indicates a negative association, and a positive correlation coefficient value indicates a positive association."}, {"code": "5.2.A.2", "text": "The strength of the linear association is determined by how close the correlation coefficient is to −1 or 1. A value of r = 0 indicates that there is no linear association. A value of r = -1 or r = 1 indicates that there is a perfect linear association."}, {"code": "5.2.A.3", "text": "A correlation coefficient close to −1 or 1 does not necessarily mean that a linear model is appropriate."}, {"code": "5.2.A.4", "text": "A perceived or real relationship between two variables does not mean that changes in one variable cause changes in the other. That is, correlation does not necessarily imply causation."}]}]}], "skills": ["Make and describe scatterplots: direction, form, strength and unusual features.", "Identify explanatory and response variables."], "understandings": ["A scatterplot shows the form, direction and strength of an association.", "Explanatory goes on the x-axis."], "misconceptions": ["Swapping explanatory and response variables.", "Describing a plot with only direction."], "processes": ["Plot, then describe direction, form, strength, unusual points, in context."], "exam": ["Describe the association in context; a list of words without context earns partial credit."], "qr": "https://broth11.github.io/ap-stats/unit-5.html#L1", "files": {"F": [{"l": "5.1.APStats.Handout", "h": "https://drive.google.com/file/d/1UsEJ-KJZYw6zFpUGYXeTLp-wZjjq6tKt/view", "k": "page", "x": ""}, {"l": "5.1.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1qDg_2XA_Xg1iaKW82gBzlZ2F4M5PgEw-/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=EVIdV8JGbm4", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 5.1", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=51", "k": "brain", "x": ""}, {"l": "Stats Hub 5.2", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=52", "k": "brain", "x": ""}, {"l": "Practice Library (AP Statistics)", "h": "https://broth11.github.io/practice-library/#course=ap-statistics", "k": "brain", "x": ""}]}}, {"id": "L2", "n": 2, "ln": 2, "code": "5.2", "part": "5", "partTitle": "Regression Analysis", "title": "Linear Regression & Residuals", "summary": "A linear regression model predicts y from x with a slope and a y-intercept. You interpret both, make predictions by interpolation and avoid extrapolation, and read residual plots. The activity asks how colleges should evaluate standardized test scores.", "standards": [{"code": "CED 5.3", "text": "Linear regression models (correlation and the line)", "ek": [{"code": "5.3.A", "text": "Calculate a predicted response value using a linear regression model. [Skill 3.B]", "eks": [{"code": "5.3.A.1", "text": "If the form of the relationship between x and y appears linear, we can approximate the relationship between x and y using a linear regression model, which is a linear equation that uses an explanatory variable, x, to predict the response variable, y."}, {"code": "5.3.A.2", "text": "", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA1sAAACNCAAAAABk2D92AAAnpElEQVR42u2dd2AWVdrFf3kDISEkkY7SixiKgnQVkI5KkaYIKgJhQREEdUGNCugKiKIgRRDE0ISQ0BEindCkBHfFTxd1bWtBUewFG+f7Y94yM++kIIEleM8fMHPLc597c593Zu6dOSdCGPzFEWHmwBmBzwyBgYGJLQMDE1sGBia2zBAYGJjYMjAogLG1J0+l9+S96JnCq/nW/J5cEwAO5Ud7B18B9rx6Gr4ZFNjYmt/8hjwUTm9+O9zefPH/0uF+zfPJ0MzmY50JIz07dkt+tNejFdC8X94rNG9rpuZf8J6wcFTk/9LhIlFnqaEukQfy12BUEVdCiYvM/DufUeiUa0yf/j91+NDZauiPk/m8pfpLWAu/m/n3l4qtTccrtLCdbj9WqGd2ddMK9QgcZnxX4apca2Q1Ath2rFS7QMqWLyte5c7f/0HcdYGE9ygfyF91omQHh7UVha7P1mtYTTeAtOLtvcqvOdE7VNTmex56uvpkD2fe/g8u6Ogubyu056PiruzMz8q0xm0j2Gc2flX5SjMvzwtIkpRCL2mB7/4l5YBmCuDJEgBdA6dpDJHu9r0o1fGpVwTEzJIkDY8BLs5w1fC12FmXalbNwb7VI2OYI80sC5R4WpI0rxxw2Tpfe1v+1jpA1CBJ2n4pQOUNktQJIO5pSU19krS3GUA7ycPrBb775yZAXLr6RkD5DFd5aXQUcMNkxjh9H8GiYMc1zQc+n09KRD0I9vTaCKB1sFQdn5oBF0z1N1uWfs5Cuy8FLkyrECXJV0+SnrsIKD5V6u0Dn6+eHH3WgtJAg1W00dkDMjiD45pCLymFBoX7Pz+rDnf5M1NpuGz/+g48YI+tESySEmlcc/ziEZHFJKkbA7dpQcXog84aVL2g2sCJVs0kGviuu+OAJtNitV5qzmxJCymavGZJ+xK0CeXvKFJpXtaOJG6RlFB8yvbMyUVLSLqSezfuWVCNLVJDJO0tFvvQ+pUDuVAeXqdQr/DtC++OKNum3KMv9qeKq7zupsbMlyZfGM8Yp++O2MpMrsmQ5GQpkfqhnlaJHr933+NFagZKJVL1qgUbxhVlvpTC5TQdkuosVIKk1S/eGBUdJYk6kqZSedr6KaV5UYuTi8QmJ0+Vo8/pEXHjXprTON7E1nkXW8yTpIiq/swZ7SVJsRU9YutySb 12BFcyAMaOf4l+OVh2pn9T/Z4a7076ISgTN+HWvsmNv1+z5Ir2HJjQIcn8OQ04B9/LCBIkX89Ma6urulIYOdQHvr7B3abnygEd5avjYnXuDJR+JplFkhbHQn1Jj8QBMUNDZNSSpIU0cGwC9LDe+vCy7G4xifltg7zYDV202uP9jNgGZn/rnOOs9iBInj/gnqdYFtnLnnbg2/aeMbo15srg8Y5C1kLghi9LdnKXS574zF3eUZ6dZUd61lsJnfPEb22A4Xk6h8d1/oB78n0drvyP35hRN7FleHXzG6sj0j4dbQbdwMRWvmP4xzSdZAbdwNwP5Dt2vFfKPByZe0IzrgZmDhhgONQMDExsGRj8NfD/uGFtDfy2QywAAAAASUVORK5CYII="}, {"code": "5.3.A.3", "text": "Extrapolation is predicting a response value using a value for the explanatory variable that is beyond the interval of x-values used to determine the regression line. The predicted value is less reliable the further the estimate is extrapolated."}, {"code": "5.3.A.4", "text": "Interpolation is predicting a response value using a value for the explanatory variable that is within the interval of x-values used to determine the regression line."}]}]}, {"code": "CED 5.4", "text": "Residuals (introduction)", "ek": [{"code": "5.4.A", "text": "Calculate the differences between the observed and predicted values. [Skill 3.B]", "eks": [{"code": "5.4.A.1", "text": "A residual is the difference between the observed response value and the predicted response value for the given value of the explanatory variable: residual = y - y or ( residual = observed y - predicted y )."}]}, {"code": "5.4.B", "text": "Interpret the differences between the observed and predicted values. [Skill 4.D]", "eks": [{"code": "5.4.B.1", "text": "If the residual is positive, the model underpredicts (underestimates) the value of the response variable. If the residual is negative, the model overpredicts (overestimates) the value of the response variable."}]}, {"code": "5.4.C", "text": "Describe the form of association of bivariate data using residual plots. [Skill 4.A]", "eks": [{"code": "5.4.C.1", "text": "A residual plot is a scatterplot of the residuals versus the predicted response values (or the explanatory variable values)."}, {"code": "5.4.C.2", "text": "Residual plots can be used to investigate the appropriateness of the linear regression model for the observed data."}, {"code": "5.4.C.3", "text": "The linear regression model should only be fit to the data if the data exhibit a linear trend. Apparent randomness in a residual plot for a linear regression model is confirmation of a linear form in the association between the two variables and indicates that the simple linear regression model is an appropriate model for the data."}, {"code": "5.4.C.4", "text": "Curvature in the residual plot for a linear regression model suggests that the linear model is not the most appropriate model for the data."}]}]}], "skills": ["Interpret r and know its properties.", "Write and interpret a least-squares line."], "understandings": ["r measures the strength of a linear association only.", "Correlation does not imply causation."], "misconceptions": ["Using r for a curved pattern.", "Interpreting r as the percent of points on the line."], "processes": ["Run LinReg, read r and the equation, then interpret slope and intercept."], "exam": ["Interpret slope as the predicted change in y for each one unit increase in x, in context."], "qr": "https://broth11.github.io/ap-stats/unit-5.html#L2", "files": {"F": [{"l": "5.2.APStats.Handout", "h": "https://drive.google.com/file/d/12yMQPY_ffp-4yJmlFwf-8_rooBrYtxCO/view", "k": "page", "x": ""}, {"l": "5.2.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/16elZzWGzwcA9m3Y3E4M9jleCnR8erOHr/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=i8StYTogxm0", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 5.3", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=53", "k": "brain", "x": ""}, {"l": "Stats Hub 5.4", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=54", "k": "brain", "x": ""}, {"l": "Practice Library (AP Statistics)", "h": "https://broth11.github.io/practice-library/#course=ap-statistics", "k": "brain", "x": ""}]}}, {"id": "L3", "n": 3, "ln": 3, "code": "5.3", "part": "5", "partTitle": "Regression Analysis", "title": "Least-Squares Regression", "summary": "The least-squares regression line minimizes the sum of squared residuals. You read computer output, interpret the slope and y-intercept, and interpret r-squared as the share of variation explained. The activity models the link between neighborhood income and access to organic food.", "standards": [{"code": "CED 5.4", "text": "Residuals", "ek": [{"code": "5.4.A", "text": "Calculate the differences between the observed and predicted values. [Skill 3.B]", "eks": [{"code": "5.4.A.1", "text": "A residual is the difference between the observed response value and the predicted response value for the given value of the explanatory variable: residual = y - y or ( residual = observed y - predicted y )."}]}, {"code": "5.4.B", "text": "Interpret the differences between the observed and predicted values. [Skill 4.D]", "eks": [{"code": "5.4.B.1", "text": "If the residual is positive, the model underpredicts (underestimates) the value of the response variable. If the residual is negative, the model overpredicts (overestimates) the value of the response variable."}]}, {"code": "5.4.C", "text": "Describe the form of association of bivariate data using residual plots. [Skill 4.A]", "eks": [{"code": "5.4.C.1", "text": "A residual plot is a scatterplot of the residuals versus the predicted response values (or the explanatory variable values)."}, {"code": "5.4.C.2", "text": "Residual plots can be used to investigate the appropriateness of the linear regression model for the observed data."}, {"code": "5.4.C.3", "text": "The linear regression model should only be fit to the data if the data exhibit a linear trend. Apparent randomness in a residual plot for a linear regression model is confirmation of a linear form in the association between the two variables and indicates that the simple linear regression model is an appropriate model for the data."}, {"code": "5.4.C.4", "text": "Curvature in the residual plot for a linear regression model suggests that the linear model is not the most appropriate model for the data."}]}]}, {"code": "CED 5.5", "text": "Least-squares regression", "ek": [{"code": "5.5.A", "text": "Calculate the coefficients for the least-squares regression line model. [Skill 3.B]", "eks": [{"code": "5.5.A.1", "text": "", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA1sAAADACAAAAADXHibEAAA1VUlEQVR42u2deWAURfq/n0xCLiDhvoPIoUAQkABRLrlvEAQEERAIK6Ii14IaVES5PEAOFeTYwIIQiNxC5CZAEJCw3x+ueLvuokZRPECBXTHv74/umanu6ZlMuBPr8wd0qqrfequ63+nu6uqnQgStP7lC9DlwVeTSXaClpWNLS0vHlpaWji3dBVpaOra0tPKRwoz/Mr0pTcm60DSofY+dz71cZlQDp9Sm7n+um4JxPjj5tMOT4Nx4dn5TqnPeW399u0vrEiQiIv2UhNlS00jMVfFBlCPeIXENw0WGs1yuo+K5Qob6sc2aMMrTMMfGS33gUDIv562aFMZera5AtK6GjOtWy8LAgY9bVgNqBh2WEeGXE9SFwkOv52/K5TkfnMIjHBIH/1/vpAuJW8PDgBKR33jS1W2L/GZo5Yd7wuHDgYEf9xuep32zLqvmefOua8OzrkEd/3VKPOBKAyZPBvjjojdd3bbIb4ZWvnje8tWasHvcmxty7rFkrb9Qsr0lYcdP9wJsDOnuTjn8ZbEOliK7T5Vqm7eq9pwK6+UnLBLsFrf82lfJP9rQln/0Cyo29dk0tTbsbu8f209Xam71LaYjcPBkxWbu0Pg6ppM3t1BPb1F7N3m0NztCyTlbJNeDYnFJ1bbTcc09PVy0sz5988HzloiIDGCBsVETuQeImi8iIp1CgFbeYl0Ais4SkUSXiLiaZ9QAV7JMiYbImSIS75I7gGKzvY8cr5UFSsyyPG+Ncb0pEu+S3iFOVb1UAqC7iCxzPbGoLIPMpySXdAWbxbFRQM/ZrkkiD7o2jI5ioSV/z20AN221bia6REQO3gHQVox6VpYD7nB7+aBr42OhUE0kEWgsIiLLqwCRw4wC3YDISebzltd37/OWq56ILCwL0MxM6usCl6udTHe9ZG7XU9LrWV1SM1IYu6Ksx71d8UD4MP28dSPLObbq3zJ1xajQIiIiVSKnHjw0I+IWd6kmjNuWuawqO0USEBFuKtZ50UvF6Bfx6IpnIkJEpCY3N1229dlolrpj62Wab5C3m7ntG7E1iuUiNWnkWFUqCasPb2nPkyIp3E7i8FS3aw1i+z1ktTicuFe2LqhRgmdEkmjg6jziiCU/tvgrezJeji5h3UxARA4WKfzUlnVDKS8iKTQoNHjx/HgeM71M4vYSk/7eneaV6s9b1oQBIvI6Veam/70VbURE7qD1ivXjI2LYZvXdOpaxkfjlB3Y8TDsjaUVy4Yjk5IUylRdkRXJE4eTk2Wa6ua26pGakUNfr3t6IykuO7k1igI6tfBdbtxt/vyEy0kgcyxz3Dh1FRPbFveiOLcaKyPOEbhGRoSwQqWn8xq+imju2oozILFzRIbacq3rVOBULx4mkgOeCJzWpLWK1eCikkoiIFDFiq/BuW34KU0REXrw1Xd00nG/Mm8aVZrBICiwREQm52RNbpUVEShhhQRURKRItIiKNWSSykJYiIm/DNqvv1thKYq+ISO8EdxNKx4iITOUFEYkp7e1+c1t1Sc2wuHd7eJaISCJHdWzduHJ+ ase in the explanatory variable, and it should be interpreted in context."}, {"code": "5.5.B.3", "text": "The y-intercept in the least-squares regression line is the predicted value of the response variable when the explanatory variable is equal to 0, and it should be interpreted in context. Sometimes, the y-intercept of the line does not have a reasonable interpretation in context because x = 0 might be beyond the interval of x-values used to determine the regression line (extrapolation). At other times, the y-intercept of the line does not have a logical interpretation in context because it might be a negative value for a response variable that has no negative values, such as height."}]}]}], "skills": ["Compute and interpret residuals and use residual plots.", "Interpret r-squared and standard deviation of residuals."], "understandings": ["A residual is actual minus predicted; a pattern in the residual plot means the line is not appropriate.", "Extrapolation is unreliable."], "misconceptions": ["Subtracting in the wrong direction.", "Claiming a pattern-free residual plot means the relationship is strong."], "processes": ["Predict y-hat, subtract from y, plot residuals, check for pattern."], "exam": ["Interpret r-squared as the percent of variation in y explained by the linear model with x."], "qr": "https://broth11.github.io/ap-stats/unit-5.html#L3", "files": {"F": [{"l": "5.3.APStats.Handout", "h": "https://drive.google.com/file/d/1XqCWIuSTGTHaTSN3ZQfex5iW-YAHeTBg/view", "k": "page", "x": ""}, {"l": "5.3.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1PNBBXaUd-5AnXHROgtOB3vs9Ai9bmC86/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=3SN30w52VjA", "k": "video", "x": ""}, {"l": "Optional video (regression output)", "h": "https://www.youtube.com/watch?v=e8hxeiv9R6c", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 5.4", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=54", "k" function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function chips(l){return l.standards.map(function(s){return '<span class="chip">'+esc(s.code.replace('CED ',''))+'</span>';}).join('');}
function list(a){return a&&a.length?'<ul>'+a.map(function(x){return '<li>'+fmt(x)+'</li>';}).join('')+'</ul>':'<p class="none">Nothing here yet</p>';}
function ekh(s,open){if(!s.ek||!s.ek.length)return '';var n=s.ek.reduce(function(a,lo){return a+lo.eks.length;},0);return '<details class="ek"'+(open?' open':'')+'><summary>Essential knowledge ('+n+')</summary>'+s.ek.map(function(lo){return '<div class="lo"><b>'+esc(lo.code)+'</b> '+esc(lo.text)+'</div><ul class="eks">'+lo.eks.map(function(e){return '<li><span class="ekc">'+esc(e.code)+'</span>'+(e.img?'<img src="'+e.img+'" alt="'+esc(e.code)+'">':'<span>'+esc(e.text)+'</span>')+'</li>';}).join('')+'</ul>';}).join('')+'</details>';}

     "text": "Residuals (introduction)",
     "ek": [
      {
       "code": "5.4.A",
       "text": "Calculate the differences between the observed and predicted values. [Skill 3.B]",
       "eks": [
        {
         "code": "5.4.A.1",
         "text": "A residual is the difference between the observed response value and the predicted response value for the given value of the explanatory variable: residual = y - y or ( residual = observed y - predicted y )."
        }
       ]
      },
      {
       "code": "5.4.B",
       "text": "Interpret the differences between the observed and predicted values. [Skill 4.D]",
       "eks": [
        {
         "code": "5.4.B.1",
         "text": "If the residual is positive, the model underpredicts (underestimates) the value of the response variable. If the residual is negative, the model overpredicts (overestimates) the value of the response variable."
        }
       ]
      },
      {
       "code": "5.4.C",
       "text": "Describe the form of association of bivariate data using residual plots. [Skill 4.A]",
       "eks": [
        {
         "code": "5.4.C.1",
         "text": "A residual plot is a scatterplot of the residuals versus the predicted response values (or the explanatory variable values)."
        },
        {
         "code": "5.4.C.2",
         "text": "Residual plots can be used to investigate the appropriateness of the linear regression model for the observed data."
        },
        {
         "code": "5.4.C.3",
         "text": "The linear regression model should only be fit to the data if the data exhibit a linear trend. Apparent randomness in a residual plot for a linear regression model is confirmation of a linear form in the association between the two variables and indicates that the simple linear regression model is an appropriate model for the data."
        },
        {
         "code": "5.4.C.4",
         "text": "Curvature in the residual plot for a linear regression model suggests that the linear model is not the most appropriate model for the data."
        }
       ]

       "text": "Interpret coefficients for the least-squares regression line model. [Skill 4.D]",
       "eks": [
        {
         "code": "5.5.B.1",
         "text": "The coefficients of the least-squares regression line model (line of best fit) are the slope, b, and the y-intercept, a, because they are based on a sample of values."
        },
        {
         "code": "5.5.B.2",
         "text": "The slope of the least-squares regression line can be interpreted as the predicted increase or decrease in the response variable for a one- unit increase in the explanatory variable, and it should be interpreted in context."
        },
        {
         "code": "5.5.B.3",
         "text": "The y-intercept in the least-squares regression line is the predicted value of the response variable when the explanatory variable is equal to 0, and it should be interpreted in context. Sometimes, the y-intercept of the line does not have a reasonable interpretation in context because x = 0 might be beyond the interval of x-values used to determine the regression line (extrapolation). At other times, the y-intercept of the line does not have a logical interpretation in context because it might be a negative value for a response variable that has no negative values, such as height."
        }
