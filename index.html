<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AP Statistics · Files for Students</title>
<style>
:root{--ink:#0b0b0b;--paper:#f6f3ec;--grid:#e4dfd2;--orange:#ff4d00;--blue:#4b5cff;--sh:4px 4px 0 var(--ink);--sans:ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box;margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
body{font:15px/1.5 var(--sans);color:var(--ink);background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;padding:28px 16px 64px}
.wrap{max-width:1296px;margin:0 auto}
.topbar{position:sticky;top:0;z-index:20;background:var(--ink);margin:-28px -16px 26px;padding:0 16px}
.topbar-in{max-width:1296px;margin:0 auto;display:flex;align-items:center;padding:17px 0}
.topbar .course{font:900 14px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:#fff}
.hero{position:relative;background:var(--orange);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.08) 0 10px,transparent 10px 20px);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:26px 28px 24px;margin-bottom:34px}
.hero .eyebrow{font:800 13px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#fff}
.hero h1{font:900 clamp(30px,5vw,54px)/1.02 var(--sans);text-transform:uppercase;letter-spacing:.01em;color:#fff;margin:8px 0 12px;text-shadow:3px 3px 0 var(--ink)}
.hero p{max-width:62ch;background:#fff;border:2px solid var(--ink);box-shadow:var(--sh);padding:10px 14px;font-weight:500}
.sticker{position:absolute;right:22px;top:20px;background:#fff;border:2px solid var(--ink);box-shadow:var(--sh);padding:6px 14px;font:900 15px var(--sans);letter-spacing:.1em;text-transform:uppercase;transform:rotate(4deg)}
.list{display:flex;flex-direction:column;gap:18px;margin-bottom:40px}
.row{display:flex;align-items:stretch;border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);background:#fff;color:var(--ink)}
.row .code{font:900 38px/1 var(--sans);color:#fff;padding:14px 0;width:108px;flex:none;border-right:3px solid var(--ink);display:flex;align-items:center;justify-content:center;text-shadow:2px 2px 0 var(--ink)}
.row .code{color:#fff}
.row.o .code{background:var(--orange)}
.row.b .code{background:var(--blue)}
.row .code:hover{filter:brightness(1.1)}
.row .mid{flex:1;min-width:0;padding:12px 20px;display:flex;align-items:center}
.row .mid b{font:900 clamp(17px,2.2vw,24px)/1.1 var(--sans);text-transform:uppercase}
.row .mid:hover b{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px}
.codes{flex:none;display:grid;grid-template-columns:repeat(8,62px);gap:8px;align-content:center;padding:12px 6px 12px 12px}
.codes button{font:800 12px var(--mono);color:var(--ink);background:#fff;text-align:center;border:2px solid var(--ink);padding:5px 0;background:#fff;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.codes button:hover,.codes button:focus-visible{background:var(--blue);color:#fff;transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);outline:none}
.row .go{align-self:center;font:900 28px var(--sans);padding:0 22px}
.row .go:hover{color:var(--orange)}
@media(max-width:1180px){.row{flex-wrap:wrap}.row .mid{flex:1 1 calc(100% - 160px)}.codes{order:5;flex:1 0 100%;grid-template-columns:repeat(auto-fill,62px);border-top:2px dashed #bbb;padding:12px 16px}.row .go{display:none}}
@media(max-width:760px){.row .code{width:72px;font-size:26px}.sticker{display:none}}
.foot{font:800 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#555}
</style></head>
<body>

<div class="wrap">

<div class="row o"><button type="button" class="code" data-href="unit-3a.html" aria-label="Open part 3A">3A</button><button type="button" class="mid" data-href="unit-3a.html"><b>Inference for One Proportion</b></button><div class="codes"><button type="button" data-href="unit-3a.html#L1" title="Sampling Distribution for a Proportion">3.A.1</button><button type="button" data-href="unit-3a.html#L2" title="Conditions for Sampling a Proportion">3.A.2</button><button type="button" data-href="unit-3a.html#L3" title="Intro to Confidence Intervals">3.A.3</button><button type="button" data-href="unit-3a.html#L4" title="Interval for a Proportion">3.A.4</button><button type="button" data-href="unit-3a.html#L5" title="Confidence &amp; Margins of Error">3.A.5</button><button type="button" data-href="unit-3a.html#L6" title="Introduction to Hypothesis Tests">3.A.6</button><button type="button" data-href="unit-3a.html#L7" title="Hypothesis Test for One Proportion">3.A.7</button><button type="button" data-href="unit-3a.html#L8" title="Errors &amp; Power">3.A.8</button></div><button type="button" class="go" data-href="unit-3a.html" aria-label="Open part 3A">&rarr;</button></div>
