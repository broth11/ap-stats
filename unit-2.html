ext": "Summary statistics for two categorical variables may reveal information that can be used to justify claims about the variables in context."}]}]}], "skills": ["Build and read two-way tables with joint, marginal and conditional relative frequencies.", "Use segmented bar charts and mosaic plots to compare groups."], "understandings": ["Conditional relative frequencies, not counts, show whether variables are associated.", "Association means the conditional distribution changes between groups."], "misconceptions": ["Comparing counts in groups of different sizes.", "Conditioning on the wrong variable (row versus column)."], "processes": ["Compute relative frequencies conditional on the explanatory variable, then compare across groups."], "exam": ["State the comparison with percentages from the correct group, in context."], "qr": "https://broth11.github.io/ap-stats/unit-2.html#L1", "files": {"F": [{"l": "2.A.1.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1QgUZXpdqdlzaXH9mkm5_NGCyt5Q7VHoN/view", "k": "page", "x": ""}, {"l": "2.A.1.APStats.MasteryChecks.Key", "h": "https://drive.google.com/file/d/1AQ3BFpaE-46JbG3Z9uP2nSQxP_rs_NVi/view", "k": "page", "x": ""}, {"l": "2.A.1.vB.APStats.Handout", "h": "https://drive.google.com/file/d/1-NDqr55tZRpxU-O6kdM2TQUWE9ispMyu/view", "k": "page", "x": ""}, {"l": "2.A.1.vB.APStats.Handout.Key", "h": "https://drive.google.com/file/d/1NFpgGitjJk-cY5srWxryd3EumL__IKzV/view", "k": "page", "x": ""}], "V": [], "K": [{"l": "Stats Hub 2.1", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=14", "k": "brain", "x": ""}, {"l": "Stats Hub 2.2", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=15", "k": "brain", "x": ""}, {"l": "Practice Library 2.A.1", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=2-a&question=q01", "k": "brain", "x": ""}]}}, {"id": "L2", "n": 2, "ln": 2, "code": "2.A.2", "part": "2A", "partTitle": "Categorical Data and Probability", "title": "Defining Probability", "summary": "Simulation estimates probabilities, the law of large numbers says long-run results settle down, and complements give a quick way to find a probability. You simulate and calculate probabilities of equally likely outcomes. The activity asks whether the home run derby is cursed.", "standards": [{"code": "CED 2.3", "text": "Estimating probabilities using simulation", "ek": [{"code": "2.3.A", "text": "Estimate probabilities using simulations. [Skill 3.C]", "eks": [{"code": "2.3.A.1", "text": "A random process generates results that are determined by chance."}, {"code": "2.3.A.2", "text": "An outcome is the result of one trial of a random process."}, {"code": "2.3.A.3", "text": "An event is a collection of outcomes."}, {"code": "2.3.A.4", "text": "Simulation is a way to model random events such that simulated outcomes closely match real-world outcomes. All possible outcomes are associated with a value to be determined by chance. Record the counts of simulated outcomes and the count total."}, {"code": "2.3.A.5", "text": "The probability of an outcome or event is its long-run relative frequency—that is, its relative frequency over a large number of trials."}, {"code": "2.3.A.6", "text": "The relative frequency of an outcome or event determined from empirical data can be used to estimate the actual, or true, probability of that outcome or event."}, {"code": "2.3.A.7", "text": "The law of large numbers states that for independent trials, as the number of trials increases, the long-run relative frequency of the outcome or event gets closer and closer to a single value."}]}]}, {"code": "CED 2.4", "text": "Introduction to probability", "ek": [{"code": "2.4.A", "text": "Calculate probabilities for events and their complements. [Skill 3.C]", "eks": [{"code": "2.4.A.1", "text": "The sample space of a random process is the set of all possible nonoverlapping outcomes. The probability of the sample space is 1."}, {"code": "2.4.A.2", "text": "If all outcomes in the sample space are equally likely, then the theoretical probability an event $E$ will occur is $\\dfrac{\\text{number of outcomes in event } E}{\\text{total number of outcomes in the sample space}}$. The probability of event $E$ occurring is written as $P(E)$."}, {"code": "2.4.A.3", "text": "The probability of an event is a number between 0 and 1, inclusive."}, {"code": "2.4.A.4", "text": "The probability of the complement of an event $E$, which can be written as $E'$, $\\overline{E}$, or $E^{C}$ (i.e., the probability of “not $E$”) is equal to $1-P(E)$."}]}]}], "skills": ["Design and run a simulation, then estimate a probability.", "Use the complement rule and the language of events."], "understandings": ["Long-run relative frequency estimates probability, and more trials gives a better estimate.", "A probability near 0 or 1 says an event is unlikely or very likely."], "misconceptions": ["Believing short-run results must balance out.", "Skipping the stated simulation steps."], "processes": ["State the model, assign random digits, run a trial, repeat, then compute the proportion."], "exam": ["Simulation answers need all four steps: model, trial, repetitions, result."], "qr": "https://broth11.github.io/ap-stats/unit-2.html#L2", "files": {"F": [{"l": "2.A.2.APStats.Handout", "h": "https://drive.google.com/file/d/1luKl8Bje982q1cjwvw-mmUZOp2SwT7QV/view", "k": "page", "x": ""}, {"l": "2.A.2.APStats.Handout.Key", "h": "https://drive.google.com/file/d/1a4qOv-eoNSVe3RYrk4lhgb0k2QpIqo_X/view", "k": "page", "x": ""}, {"l": "2.A.2.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1D04GXdFG6L6HnTVgmUFm983qmB8XP47u/view", "k": "page", "x": ""}, {"l": "2.A.2.APStats.MasteryChecks.Key", "h": "https://drive.google.com/file/d/1kIra5BAmHOWCmAiImIG9LFJZuYBJvJol/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=sD4IiafeGC8", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 2.3", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=16", "k": "brain", "x": ""}, {"l": "Stats Hub 2.4", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=17", "k": "brain", "x": ""}, {"l": "Practice Library 2.A.2", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=2-a&question=q06", "k": "brain", "x": ""}]}}, {"id": "L3", "n": 3, "ln": 3, "code": "2.A.3", "part": "2A", "partTitle": "Categorical Data and Probability", "title": "Conditional Probability", "summary": "Venn diagrams organize events, mutually exclusive events cannot happen together, and conditional probability restricts the sample space to what you already know. You calculate and interpret each. The activity analyzes OkCupid data to ask how many people lie in their online dating profiles.", "standards": [{"code": "CED 2.5", "text": "Mutually exclusive events", "ek": [{"code": "2.5.A", "text": "Justify why two events are mutually exclusive (or disjoint) using joint probability. [Skill 4.B]", "eks": [{"code": "2.5.A.1", "text": "The probability that events $A$ and $B$ both will occur, sometimes called the joint probability, is the probability of the intersection of $A$ and $B$. Joint probability is defined as $P(A \\text{ intersect } B)$ or $P(A\\cap B)$."}, {"code": "2.5.A.2", "text": "Two events are mutually exclusive, or disjoint, if they cannot occur at the same time. This means that if two events are mutually exclusive, then $P(A\\cap B)=0$."}]}]}, {"code": "CED 2.6", "text": "Conditional probability (part 1)", "ek": [{"code": "2.6.A", "text": "Calculate conditional probabilities. [Skill 3.C]", "eks": [{"code": "2.6.A.1", "text": "The probability that event $A$ will occur given that event $B$ has occurred is called a conditional probability and is written as $P(A\\mid B)$. Conditional probability is defined as $P(A\\mid B)=\\dfrac{P(A\\cap B)}{P(B)}$."}, {"code": "2.6.A.2", "text": "The general multiplication rule states that the probability that events $A$ and $B$ both will occur is equal to the probability that event $A$ will occur multiplied by the conditional probability that event $B$ will occur given that event $A$ has occurred. The multiplication rule is defined as $P(A\\cap B)=P(A)\\cdot P(B\\mid A)$."}]}]}], "skills": ["Apply the addition rule for mutually exclusive and non-exclusive events.", "Compute conditional probabilities from tables."], "understandings": ["Mutually exclusive means no overlap; it does not mean independent.", "Conditional probability restricts the sample space."], "misconceptions": ["Treating mutually exclusive as independent.", "Dividing by the grand total instead of the condition's total."], "processes": ["Draw a two-way table or Venn diagram, then restrict to the condition."], "exam": ["Write the probability notation and the calculation; unlabeled answers lose marks."], "qr": "https://broth11.github.io/ap-stats/unit-2.html#L3", "files": {"F": [{"l": "2.A.3.APStats.Handout", "h": "https://drive.google.com/file/d/1DNC-M6z1c-tGKAw9Oce8wu6M9-HAM1vG/view", "k": "page", "x": ""}, {"l": "2.A.3.APStats.Handout.Key", "h": "https://drive.google.com/file/d/1lmq2EIoD8l-qtyVof6iy7Q5Zcub-ObcJ/view", "k": "page", "x": ""}, {"l": "2.A.3.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1qYF8ET_Bw_tjriydCvrgztG7V7zlnuOy/view", "k": "page", "x": ""}, {"l": "2.A.3.APStats.MasteryChecks.Key", "h": "https://drive.google.com/file/d/1W__ukshBjyT_YXu_J1s7vNfcGaXpu1Iz/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=1M0Le-VsyIs", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 2.5", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=18", "k": "brain", "x": ""}, {"l": "Stats Hub 2.6", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=19", "k": "brain", "x": ""}, {"l": "Practice Library 2.A.3", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=2-a&question=q11", "k": "brain", "x": ""}]}}, {"id": "L4", "n": 4, "ln": 4, "code": "2.A.4", "part": "2A", "partTitle": "Categorical Data and Probability", "title": "The Multiplication Rule", "summary": "Tree diagrams and the multiplication rule find the probability of several events happening in a row. You handle repeated events and work out chains of conditional probabilities. The activity breaks down Kobe Bryant's 81-point game to test whether hot hands are real or just chance.", "standards": [{"code": "CED 2.6", "text": "Conditional probability (part 2)", "ek": [{"code": "2.6.A", "text": "Calculate conditional probabilities. [Skill 3.C]", "eks": [{"code": "2.6.A.1", "text": "The probability that event $A$ will occur given that event $B$ has occurred is called a conditional probability and is written as $P(A\\mid B)$. Conditional probability is defined as $P(A\\mid B)=\\dfrac{P(A\\cap B)}{P(B)}$."}, {"code": "2.6.A.2", "text": "The general multiplication rule states that the probability that events $A$ and $B$ both will occur is equal to the probability that event $A$ will occur multiplied by the conditional probability that event $B$ will occur given that event $A$ has occurred. The multiplication rule is defined as $P(A\\cap B)=P(A)\\cdot P(B\\mid A)$."}]}]}], "skills": ["Use the general multiplication rule and tree diagrams.", "Find P(A given B) from a tree."], "understandings": ["P(A and B) = P(A) times P(B given A).", "Reversing the condition changes the probability."], "misconceptions": ["Confusing P(A given B) with P(B given A).", "Multiplying along the wrong branches."], "processes": ["Draw the tree, multiply along branches, add the branches that satisfy the event."], "exam": ["Show the tree or the multiplication line; a bare decimal may not earn full credit."], "qr": "https://broth11.github.io/ap-stats/unit-2.html#L4", "files": {"F": [{"l": "2.A.4.APStats.Handout", "h": "https://drive.google.com/file/d/19fCU4--oePBmRkx7rYXXctLjpK15NlU8/view", "k": "page", "x": ""}, {"l": "2.A.4.APStats.Handout.Key", "h": "https://drive.google.com/file/d/1jjL_urBDZe0E3IH8ggTueyioZ81U8mzv/view", "k": "page", "x": ""}, {"l": "2.A.4.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/102TZLJ4Fttw_vPo-MjJxYCIQ7VM5JbRl/view", "k": "page", "x": ""}, {"l": "2.A.4.APStats.MasteryChecks.Key", "h": "https://drive.google.com/file/d/1Dl_QgmZVGNhfmHpabBrkgXRELKSWd73e/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=qKoJHX_22Hc", "k": "video", "x": ""}, {"l": "Supplemental video", "h": "https://youtu.be/Xc-xCXHCZuQ", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 2.6", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=19", "k": "brain", "x": ""}, {"l": "Practice Library 2.A.4", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=2-a&question=q16", "k": "brain", "x": ""}]}}, {"id": "L5", "n": 5, "ln": 5, "code": "2.A.5", "part": "2A", "partTitle": "Categorical Data and Probability", "title": "Independence & The Addition Rule", "summary": "Two events are independent when knowing one does not change the probability of the other. You test independence with two-way tables and use the addition rule for unions. The activity analyzes stock trades made by members of Congress and asks whether they should be allowed to trade.", "standards": [{"code": "CED 2.7", "text": "Independent events and unions of events", "ek": [{"code": "2.7.A", "text": "Calculate probabilities for independent events and for the union of two events. [Skill 3.C]", "eks": [{"code": "2.7.A.1", "text": "Events $A$ and $B$ are independent if and only if knowing whether event $A$ has occurred (or will occur) does not change the probability that event $B$ will occur. When events $A$ and $B$ are independent, then $P(A\\mid B)=P(A)$, $P(B\\mid A)=P(B)$, and $P(A\\cap B)=P(A)\\cdot P(B)$."}, {"code": "2.7.A.2", "text": "The probability that event $A$ or event $B$ (or both) will occur is the probability of $A$ union $B$. The probability of the union is defined as $P(A\\cup B)$."}, {"code": "2.7.A.3", "text": "$P(A \\text{ union } B)=P(A)+P(B)-P(A \\text{ intersect } B)$, or $P(A\\cup B)=P(A)+P(B)-P(A\\cap B)$."}]}]}], "skills": ["Test independence with P(A given B) = P(A).", "Use the union rule and multiplication rule for independent events."], "understandings": ["Independence means knowing one event does not change the other's probability.", "Independence is checked, not assumed."], "misconceptions": ["Assuming independence without checking.", "Adding probabilities of non-exclusive events without subtracting the overlap."], "processes": ["Compute P(A given B) and compare with P(A), or compare P(A and B) with P(A)P(B)."], "exam": ["Justify independence with a numerical comparison, not a statement."], "qr": "https://broth11.github.io/ap-stats/unit-2.html#L5", "files": {"F": [{"l": "2.A.5.APStats.Data", "h": "https://docs.google.com/spreadsheets/d/17iz_qU_QGHQhNSjKX8pd1OOgRgCoiPXDMWxwBSjXeKM/view", "k": "page", "x": "gsheet"}, {"l": "2.A.5.APStats.Data", "h": "https://drive.google.com/file/d/1XCfXgRnwCg905BgNg1jZM1TZn9ZezetQ/view", "k": "page", "x": "xlsx"}, {"l": "2.A.5.APStats.Handout", "h": "https://drive.google.com/file/d/10oGTVbv9LLWcUxkNFI8exkQmUiXlkyeM/view", "k": "page", "x": ""}, {"l": "2.A.5.APStats.Handout.Key", "h": "https://drive.google.com/file/d/1M-br0Z5NgMx1CHw8ht-N2bPqUmj0Ekd_/view", "k": "page", "x": ""}, {"l": "2.A.5.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1I9iiNGL8Ta3NQBTpqNRcVrBNKBSiuO4V/view", "k": "page", "x": ""}, {"l": "2.A.5.APStats.MasteryChecks.Key", "h": "https://drive.google.com/file/d/1_sC22XAfL_1Ym0mItpQEyOwsirTcugyR/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=HtseZo1JtzM", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 2.7", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=20", "k": "brain", "x": ""}, {"l": "Practice Library 2.A.5", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=2-a&question=q21", "k": "brain", "x": ""}]}}, {"id": "L6", "n": 6, "ln": 1, "code": "2.B.1", "part": "2B", "partTitle": "Random Variables and Probability Distributions", "title": "Discrete Random Variables", "summary": "A probability distribution lists every value of a random variable with its probability. You calculate expected value for the long-run average and variance and standard deviation for risk. The activity simulates a roulette game and shows why it is a losing game over time.", "standards": [{"code": "CED 2.8", "text": "Introduction to random variables and probability distributions", "ek": [{"code": "2.8.A", "text": "Construct a probability distribution for a discrete random variable. [Skill 3.A]", "eks": [{"code": "2.8.A.1", "text": "A random variable is a variable whose values have numerical outcomes that result from a random phenomenon."}, {"code": "2.8.A.2", "text": "A probability distribution for a discrete random variable shows the probability associated with every possible value of the random variable. The sum of the probabilities over all possible values of a discrete random variable is 1."}, {"code": "2.8.A.3", "text": "A discrete probability distribution can be determined using the rules of probability or estimated with a simulation."}, {"code": "2.8.A.4", "text": "A discrete probability distribution can be represented as a graph, table, or function showing the probabilities associated with values of a random variable."}, {"code": "2.8.A.5", "text": "A cumulative probability distribution can be represented as a table or function and shows the probability of being less than or equal to each value of the discrete random variable."}]}]}, {"code": "CED 2.9", "text": "Parameters of random variables", "ek": [{"code": "2.9.A", "text": "Calculate the mean and standard deviation for a discrete random variable. [Skill 3.B]", "eks": [{"code": "2.9.A.1", "text": "A numerical value measuring a characteristic of a probability distribution of a random variable, or a population, is a parameter. The value of a parameter is a single, fixed value."}, {"code": "2.9.A.2", "text": "The expected value (or mean) of a probability distribution is a parameter and is denoted by $E(X)$ or $\\mu_X$. For a discrete random variable $X$, the expected value is calculated as $\\mu_X=\\sum x_i\\cdot P(x_i)$, where $x_i$ is the possible value of the random variable and $P(x_i)$ is the probability of the possible value of the random variable. The expected value can be interpreted as the long-run average outcome of the random variable. The discrete random variable can only take on values that are countable or finite."}, {"code": "2.9.A.3", "text": "The standard deviation of a probability distribution is a parameter represented by $SD(X)$ or $\\sigma_X$. For a discrete random variable $X$, the standard deviation is calculated as $\\sigma_X=\\sqrt{\\sum(x_i-\\mu_X)^2\\cdot P(x_i)}$, where $x_i$ is the possible value of the random variable, $\\mu_X$ is the mean, and $P(x_i)$ is the probability of the possible value of the random variable. The standard deviation can be interpreted as the typical deviation of the values of the random variable from the mean value (or expected value) of the random variable over the long run. The square of the standard deviation of a random variable is called the variance of the random variable and is denoted as $V(X)$ or $\\sigma_X^{2}$."}]}, {"code": "2.9.B", "text": "Interpret the mean and standard deviation for a discrete random variable. [Skill 4.D]", "eks": [{"code": "2.9.B.1", "text": "The mean and standard deviation for the probability distribution of a discrete random variable should be interpreted in the context of a specific population."}]}]}], "skills": ["Build and read discrete probability distributions.", "Compute and interpret the mean and standard deviation of a random variable."], "understandings": ["The mean of a random variable is a long-run average, not a typical single outcome.", "Probabilities in a distribution sum to 1."], "misconceptions": ["Interpreting the expected value as the most likely value.", "Forgetting the probabilities sum to 1 as a check."], "processes": ["List the values and probabilities, check the sum, then compute with the formula or 1-Var Stats with a frequency list."], "exam": ["Interpret the mean as the long-run average value in context."], "qr": "https://broth11.github.io/ap-stats/unit-2.html#L6", "files": {"F": [{"l": "2.B.1.APStats.Handout", "h": "https://drive.google.com/file/d/10mhSIct3ohCmB2xJXcEPv4tNMlvMMXfc/view", "k": "page", "x": ""}, {"l": "2.B.1.APStats.Handout.Key", "h": "https://drive.google.com/file/d/1lKlj-KCcS5cUo68j2kGKCSu51ZcFaaJx/view", "k": "page", "x": ""}, {"l": "2.B.1.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1UGJ8F149MrkXXq5f1c3tJSoYWePNkVLO/view", "k": "page", "x": ""}, {"l": "2.B.1.APStats.MasteryChecks.Key", "h": "https://drive.google.com/file/d/14v-EDt3tGi-CC0uE4F4eYJIxZPKh-M2h/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=-p4GpNZY-O4", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 2.8", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=21", "k": "brain", "x": ""}, {"l": "Stats Hub 2.9", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=22", "k": "brain", "x": ""}, {"l": "Practice Library 2.B.1", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=2-b&question=b01", "k": "brain", "x": ""}]}}, {"id": "L7", "n": 7, "ln": 2, "code": "2.B.2", "part": "2B", "partTitle": "Random Variables and Probability Distributions", "title": "The Binomial Distribution", "summary": "A binomial random variable counts successes in a fixed number of independent trials with the same probability each time. You check the conditions and calculate probabilities, the mean and the standard deviation. The activity explores why NBA players stopped shooting free throws granny style.", "standards": [{"code": "CED 2.10", "text": "The binomial distribution", "ek": [{"code": "2.10.A", "text": "Justify why a random variable is or is not a binomial random variable. [Skill 4.B]", "eks": [{"code": "2.10.A.1", "text": "A binomial random variable, X, is a discrete random variable that counts the number of successes in repeated independent trials, n, that have only two possible outcomes (success or failure), with the probability of success p and the probability of failure 1− p."}]}, {"code": "2.10.B", "text": "Calculate the mean and standard deviation for a binomial distribution. [Skill 3.D]", "eks": [{"code": "2.10.B.1", "text": "If a random variable is binomial, its mean, $\\mu_X$, is $np$ and its standard deviation, $\\sigma_X$, is $\\sqrt{np(1-p)}$."}]}, {"code": "2.10.C", "text": "Interpret the mean, standard deviation, and probabilities for a binomial distribution. [Skill 4.D]", "eks": [{"code": "2.10.C.1", "text": "The mean, standard deviation, and probabilities for a binomial distribution should be interpreted in context."}]}, {"code": "2.10.D", "text": "Estimate probabilities of binomial random variables using data from a simulation. [Skill 3.C]", "eks": [{"code": "2.10.D.1", "text": "A probability distribution can be constructed using the rules of probability or estimated with a simulation."}]}, {"code": "2.10.E", "text": "Calculate probabilities for a binomial distribution. [Skill 3.C]", "eks": [{"code": "2.10.E.1", "text": "The probability that a binomial random variable, $X$, has exactly $x$ successes for $n$ independent trials, when the probability of success is $p$, is calculated as $P(X=x)=\\dbinom{n}{x}p^{x}(1-p)^{n-x}$, $x=0,1,2,\\ldots,n$. This is called the binomial probability function."}]}]}], "skills": ["Check the binomial conditions (BINS) and compute binomial probabilities.", "Find the mean and standard deviation of a binomial."], "understandings": ["A binomial counts successes in a fixed number of independent trials with constant probability.", "The mean is np."], "misconceptions": ["Using binomial without checking independence or a fixed n.", "Mixing up P(X = k) and P(X at most k) on the calculator."], "processes": ["Define X, state n and p, then use binompdf or binomcdf."], "exam": ["Define the variable and give n and p; the calculator command alone does not earn the mark."], "qr": "https://broth11.github.io/ap-stats/unit-2.html#L7", "files": {"F": [{"l": "2.B.2.APStats.Handout", "h": "https://drive.google.com/file/d/1IQmEK5tpHltjVhm5l9qFhuu2BldyrkZ0/view", "k": "page", "x": ""}, {"l": "2.B.2.APStats.Handout.Key", "h": "https://drive.google.com/file/d/138kQog1u9fY_kCxOaZxf1Sjvwu9JrcyW/view", "k": "page", "x": ""}, {"l": "2.B.2.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1cVMqbkFtT3tDHIyzkwZW6o1EOIyIi1IZ/view", "k": "page", "x": ""}, {"l": "2.B.2.APStats.MasteryChecks.Key", "h": "https://drive.google.com/file/d/1sGCeoZoJk6J_aqMT75s4i3Eiu37e0zNW/view", "k": "page", "x": ""}, {"l": "Binomial Distribution Day 2", "h": "https://drive.google.com/file/d/1S32yLilsjOKrgDqL7mF06-I7xVYx1bAn/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=aQiX36yXvBg", "k": "video", "x": ""}, {"l": "Pascal's triangle exploration", "h": "https://www.youtube.com/watch?v=s19dWIHficY", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 2.10", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=23", "k": "brain", "x": ""}, {"l": "Practice Library 2.B.2", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=2-b&question=b11", "k": "brain", "x": ""}]}}, {"id": "L8", "n": 8, "ln": 3, "code": "2.B.3", "part": "2B", "partTitle": "Random Variables and Probability Distributions", "title": "The Empirical Rule & Standard Normal Curve", "summary": "Continuous random variables use areas under a curve, and the Empirical Rule and the standard normal curve describe the normal distribution. You model data with a normal curve and use z-scores. The activity models IQ with a bell curve, then questions whether the tests measure intelligence.", "standards": [{"code": "CED 2.11", "text": "The normal distribution (parts A to D)", "ek": [{"code": "2.11.A", "text": "Describe a normal distribution. [Skill 4.C]", "eks": [{"code": "2.11.A.1", "text": "A continuous random variable is a variable that can take on any value within a specified domain. Every interval within the domain has a probability associated with it."}, {"code": "2.11.A.2", "text": "Many continuous random variables are well-modeled by a normal distribution."}, {"code": "2.11.A.3", "text": "A normal distribution can be described as a continuous, unimodal, bell-shaped, and symmetric curve."}, {"code": "2.11.A.4", "text": "A normal curve can be used to model a distribution of data and a continuous random variable."}, {"code": "2.11.A.5", "text": "The normal distribution, or the normal curve, is identified by two parameters, the mean, $\\mu$, and the standard deviation, $\\sigma$. The smaller the standard deviation, the taller and more concentrated the normal curve is around its mean. The larger the standard deviation, the shorter and less concentrated the normal curve is around its mean."}]}, {"code": "2.11.B", "text": "Calculate the mean and standard deviation for a normal distribution. [Skill 3.D]", "eks": [{"code": "2.11.B.1", "text": "A standard normal distribution is a normal distribution with mean μ = 0 and standard deviation σ = 1."}]}, {"code": "2.11.C", "text": "Calculate percentages from a normal distribution using the empirical rule. [Skill 3.C]", "eks": [{"code": "2.11.C.1", "text": "The empirical rule can be used to estimate the area of a region under the graph of the normal distribution curve. For a normal distribution, approximately 68% of observations are within 1 standard deviation of the mean, approximately 95% of observations are within 2 standard deviations of the mean, and approximately 99.7% of observations are within 3 standard deviations of the mean. This is called the empirical rule, or the 68–95–99.7 rule."}]}, {"code": "2.11.D", "text": "Calculate the probability that a particular value lies within a given interval of a normal distribution. [Skill 3.C]", "eks": [{"code": "2.11.D.1", "text": "If the distribution of a random variable is approximately normal, the probability that the random variable takes on values within a particular interval of the random variable is determined by the area under the normal curve within that interval. The total probability or area under the normal curve is 1."}]}, {"code": "2.11.E", "text": "Calculate the associated intervals and areas of a normal distribution. [Skill 3.C]", "eks": [{"code": "2.11.E.1", "text": "The boundaries of an interval associated with a given area in a normal distribution can be determined using technology or using z-scores and a standard normal table."}, {"code": "2.11.E.2", "text": "Intervals associated with a given area in a normal distribution can be determined by assigning appropriate inequalities to the boundaries of the intervals. To determine the intervals, $p$ is defined as a number between 0 and 100, $x_a$ is the lower bound, and $x_b$ is the upper bound on a normal distribution.\n2.11.E.2.i $P(X<x_a)=\\dfrac{p}{100}$ means that the lowest $p$% of the values lie to the left of $x_a$.\n2.11.E.2.ii $P(x_a<X<x_b)=\\dfrac{p}{100}$ means that $p$% of the values lie between $x_a$ and $x_b$.\n2.11.E.2.iii $P(X>x_b)=\\dfrac{p}{100}$ means that the highest $p$% of the values lie to the right of $x_b$.\n2.11.E.2.iv To determine the most extreme $p$% of values on both sides requires dividing the area associated with $p$% into two equal areas on either extreme of the distribution: $P(X<x_a)=\\dfrac{1}{2}\\left(\\dfrac{p}{100}\\right)$ and $P(X>x_b)=\\dfrac{1}{2}\\left(\\dfrac{p}{100}\\right)$ mean that half of the $p$% most extreme values lie to the left of $x_a$ and half of the $p$% most extreme values lie to the right of $x_b$."}]}, {"code": "2.11.F", "text": "Compare measures of relative position for distributions. [Skill 4.C]", "eks": [{"code": "2.11.F.1", "text": "Percentiles and proportions may be used to compare relative positions of individual values within a normal distribution or between normal distributions."}]}]}], "skills": ["Compute normal probabilities and percentiles with z-scores and the calculator.", "Sketch and label the normal curve."], "understandings": ["The normal model uses z-scores to compare unlike scales.", "Area under the curve is probability."], "misconceptions": ["Omitting the sketch or shading.", "Mixing up the inputs of normalcdf and invNorm."], "processes": ["Sketch and shade, standardize or use normalcdf, then answer in context."], "exam": ["Label the sketch, name the distribution with mean and standard deviation, then answer."], "qr": "https://broth11.github.io/ap-stats/unit-2.html#L8", "files": {"F": [{"l": "2.B.3.APStats.Handout", "h": "https://drive.google.com/file/d/1MJZT1Aydw92rDV7olax5vskiK5wbpnQ0/view", "k": "page", "x": ""}, {"l": "2.B.3.APStats.Handout.Key", "h": "https://drive.google.com/file/d/1wacQAvbv-p6pJySS_UGB8Bzd6gqYjOj7/view", "k": "page", "x": ""}, {"l": "2.B.3.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1r-O39UPsGIoE27zabEXGpbrgxBMcIUUj/view", "k": "page", "x": ""}, {"l": "2.B.3.APStats.MasteryChecks.Key", "h": "https://drive.google.com/file/d/1buDW_i8OCUgfsjd9YaPJR04SLUGE6Eej/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=XpY0dAVAr0A", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 2.11", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=24", "k": "brain", "x": ""}, {"l": "Stats Hub 2.11", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=25", "k": "brain", "x": ""}, {"l": "Practice Library 2.B.3", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=2-b&question=b21", "k": "brain", "x" reas on either extreme of the distribution: $P(X<x_a)=\\dfrac{1}{2}\\left(\\dfrac{p}{100}\\right)$ and $P(X>x_b)=\\dfrac{1}{2}\\left(\\dfrac{p}{100}\\right)$ mean that half of the $p$% most extreme values lie to the left of $x_a$ and half of the $p$% most extreme values lie to the right of $x_b$."}]}, {"code": "2.11.F", "text": "Compare measures of relative position for distributions. [Skill 4.C]", "eks": [{"code": "2.11.F.1", "text": "Percentiles and proportions may be used to compare relative positions of individual values within a normal distribution or between normal distributions."}]}]}], "skills": ["Solve backward and combined normal problems.", "Use the normal approximation when conditions are met."], "understandings": ["A backward problem starts from the area and returns a value.", "Check the conditions before using the model."], "misconceptions": ["Using normal when the distribution is clearly skewed.", "Giving a z-score when asked for a value."], "processes": ["Sketch, find z with invNorm, then convert with x = mean + z times standard deviation."], "exam": ["Return to the original units and answer the question asked."], "qr": "https://broth11.github.io/ap-stats/unit-2.html#L9", "files": {"F": [{"l": "2.B.4.APStats.Handout", "h": "https://drive.google.com/file/d/1YHUbUf98IySOTvoYyC191TJXhNnuZzz4/view", "k": "page", "x": ""}, {"l": "2.B.4.APStats.Handout.Key", "h": "https://drive.google.com/file/d/1eiyVmUk29wVdyzAkx5gY4PoHtw59ENXX/view", "k": "page", "x": ""}, {"l": "2.B.4.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1DRti0YuIB1uMOgaX3BjrNbNs1sd8Zlwg/view", "k": "page", "x": ""}, {"l": "2.B.4.APStats.MasteryChecks.Key", "h": "https://drive.google.com/file/d/10AnbZWtZHQhrPOYVMv08X1X2_mJq0VxY/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=q0MSH8LolLk", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 2.11", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=24", "k": "brain", "x": ""}, {"l": "Stats Hub 2.11", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=25", "k": "brain", "x": ""}, {"l": "Practice Library 2.B.4", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=2-b&question=b31", "k": "brain", "x": ""}]}}, {"id": "L10", "n": 10, "ln": 5, "code": "2.B.5", "part": "2B", "partTitle": "Random Variables and Probability Distributions", "title": "Intro to Sampling Distributions", "summary": "A sampling distribution shows how a statistic varies from sample to sample, and the Central Limit Theorem tells you its likely shape. You simulate to describe a sampling distribution and make informal inferences. The activity tests whether the VA meets its wait time goals.", "standards": [{"code": "CED 2.12", "text": "Sampling distributions and the Central Limit Theorem", "ek": [{"code": "2.12.A", "text": "Describe sampling distributions with simulations. [Skill 4.C]", "eks": [{"code": "2.12.A.1", "text": "A sampling distribution of a statistic is the distribution of values of the statistic for all possible samples of a given size from a given population."}, {"code": "2.12.A.2", "text": "The sampling distribution of a statistic can be simulated by repeatedly generating a large number of random samples from the population assuming known value(s) for the parameter(s). The value of the statistic is determined and recorded for each sample. The resulting distribution of the sample statistic values approximates the sampling distribution of the statistic."}, {"code": "2.12.A.3", "text": "A randomization distribution is the distribution of a statistic generated by simulation from repeatedly randomly reallocating, or reassigning, the response values to treatment groups. The value of the statistic is determined and recorded for each reallocation, or reassignment. The resulting distribution of the statistic values approximates the sampling distribution of the statistic."}, {"code": "2.12.A.4", "text": "The central          "text": "A normal curve can be used to model a distribution of data and a continuous random variable."
        },

         "code": "2.11.A.5",
         "text": "The normal distribution, or the normal curve, is identified by two parameters, the mean, $\\mu$, and the standard deviation, $\\sigma$. The smaller the standard deviation, the taller and more concentrated the normal curve is around its mean. The larger the standard deviation, the shorter and less concentrated the normal curve is around its mean."
        }

       "code": "2.11.C",
       "text": "Calculate percentages from a normal distribution using the empirical rule. [Skill 3.C]",
       "eks": [
        {
         "code": "2.11.C.1",
         "text": "The empirical rule can be used to estimate the area of a region under the graph of the normal distribution curve. For a normal distribution, approximately 68% of observations are within 1 standard deviation of the mean, approximately 95% of observations are within 2 standard deviations of the mean, and approximately 99.7% of observations are within 3 standard deviations of the mean. This is called the empirical rule, or the 68–95–99.7 rule."
        }

         "text": "A sampling distribution of a statistic is the distribution of values of the statistic for all possible samples of a given size from a given population."
        },

         "code": "2.12.A.2",
         "text": "The sampling distribution of a statistic can be simulated by repeatedly generating a large number of random samples from the population assuming known value(s) for the parameter(s). The value of the statistic is determined and recorded for each sample. The resulting distribution of the sample statistic values approximates the sampling distribution of the statistic."
        },

         "text": "A randomization distribution is the distribution of a statistic generated by simulation from repeatedly randomly reallocating, or reassigning, the response values to treatment groups. The value of the statistic is determined and recorded for each reallocation, or reassignment. The resulting distribution of the statistic values approximates the sampling distribution of the statistic."
        },
        {
         "code": "2.12.A.4",
         "text": "The central limit theorem (CLT) states that the sampling distribution of a mean of a random sample has a shape that can be approximated by a normal distribution. The larger the sample is, the better the approximation will be."
        }
