Probability", "summary": "Simulation estimates probabilities, the law of large numbers says long-run results settle down, and complements give a quick way to find a probability. You simulate and calculate probabilities of equally likely outcomes. The activity asks whether the home run derby is cursed.", "standards": [{"code": "CED 2.3", "text": "Estimating probabilities using simulation", "ek": [{"code": "2.3.A", "text": "Estimate probabilities using simulations. [Skill 3.C]", "eks": [{"code": "2.3.A.1", "text": "A random process generates results that are determined by chance."}, {"code": "2.3.A.2", "text": "An outcome is the result of one trial of a random process."}, {"code": "2.3.A.3", "text": "An event is a collection of outcomes."}, {"code": "2.3.A.4", "text": "Simulation is a way to model random events such that simulated outcomes closely match real-world outcomes. All possible outcomes are associated with a value to be determined by chance. Record the counts of simulated outcomes and the count total."}, {"code": "2.3.A.5", "text": "The probability of an outcome or event is its long-run relative frequency—that is, its relative frequency over a large number of trials."}, {"code": "2.3.A.6", "text": "The relative frequency of an outcome or event determined from empirical data can be used to estimate the actual, or true, probability of that outcome or event."}, {"code": "2.3.A.7", "text": "The law of large numbers states that for independent trials, as the number of trials increases, the long-run relative frequency of the outcome or event gets closer and closer to a single value."}]}]}, {"code": "CED 2.4", "text": "Introduction to probability", "ek": [{"code": "2.4.A", "text": "Calculate probabilities for events and their complements. [Skill 3.C]", "eks": [{"code": "2.4.A.1", "text": "The sample space of a random process is the set of all possible nonoverlapping outcomes. The probability of the sample space is 1."}, {"code": "2.4.A.2", "text": "", "img": "data:i ut subtracting the overlap."], "processes": ["Compute P(A given B) and compare with P(A), or compare P(A and B) with P(A)P(B)."], "exam": ["Justify independence with a numerical comparison, not a statement."], "qr": "https://broth11.github.io/ap-stats/unit-2.html#L5", "files": {"F": [{"l": "2.A.5.APStats.Data", "h": "https://docs.google.com/spreadsheets/d/17iz_qU_QGHQhNSjKX8pd1OOgRgCoiPXDMWxwBSjXeKM/view", "k": "page", "x": "gsheet"}, {"l": "2.A.5.APStats.Data", "h": "https://drive.google.com/file/d/1XCfXgRnwCg905BgNg1jZM1TZn9ZezetQ/view", "k": "page", "x": "xlsx"}, {"l": "2.A.5.APStats.Handout", "h": "https://drive.google.com/file/d/10oGTVbv9LLWcUxkNFI8exkQmUiXlkyeM/view", "k": "page", "x": ""}, {"l": "2.A.5.APStats.Handout.Key", "h": "https://drive.google.com/file/d/1M-br0Z5NgMx1CHw8ht-N2bPqUmj0Ekd_/view", "k": "page", "x": ""}, {"l": "2.A.5.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1I9iiNGL8Ta3NQBTpqNRcVrBNKBSiuO4V/view", "k": "page", "x": ""}, {"l": "2.A.5.APStats.MasteryChecks.Key", "h": "https://drive.google.com/file/d/1_sC22XAfL_1Ym0mItpQEyOwsirTcugyR/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=HtseZo1JtzM", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 2.7", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=20", "k": "brain", "x": ""}, {"l": "Practice Library 2.A.5", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=2-a&question=q21", "k": "brain", "x": ""}]}}, {"id": "L6", "n": 6, "ln": 1, "code": "2.B.1", "part": "2B", "partTitle": "Random Variables and Probability Distributions", "title": "Discrete Random Variables", "summary": "A probability distribution lists every value of a random variable with its probability. You calculate expected value for the long-run average and variance and standard deviation for risk. The activity simulates a roulette game and shows why it is a losing game over time.", "standards": [{"code": "CED 2.8", "text": "Introduction to random variables and probability distributions", "ek": [{"code": "2.8.A", "text": "Construct a probability distribution for a discrete random variable. [Skill 3.A]", "eks": [{"code": "2.8.A.1", "text": "A random variable is a variable whose values have numerical outcomes that result from a random phenomenon."}, {"code": "2.8.A.2", "text": "A probability distribution for a discrete random variable shows the probability associated with every possible value of the random variable. The sum of the probabilities over all possible values of a discrete random variable is 1."}, {"code": "2.8.A.3", "text": "A discrete probability distribution can be determined using the rules of probability or estimated with a simulation."}, {"code": "2.8.A.4", "text": "A discrete probability distribution can be represented as a graph, table, or function showing the probabilities associated with values of a random variable."}, {"code": "2.8.A.5", "text": "A cumulative probability distribution can be represented as a table or function and shows the probability of being less than or equal to each value of the discrete random variable."}]}]}, {"code": "CED 2.9", "text": "Parameters of random variables", "ek": [{"code": "2.9.A", "text": "Calculate the mean and standard deviation for a discrete random variable. [Skill 3.B]", "eks": [{"code": "2.9.A.1", "text": "A numerical value measuring a characteristic of a probability distribution of a random variable, or a population, is a parameter. The value of a parameter is a single, fixed value."}, {"code": "2.9.A.2", "text": "", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAXUAAADwCAAAAADanKvLAAAzdElEQVR42u2deXxVxfnGn5udBAIhJCwJoLIHUYsgAdkjF8MeBBIFDEsBF5AdlE2jRgiCoiKLIApaISyRzbAGDFwgkKBVPlpaa21rrW3tT1tbNxSe3x/nzJyZc8/NehOx3vkn9845Z2bOm+Qs853neV1EoNR4CQqEIBD1QNQDpXqjftYswNnq6MNHo+d9HrDx9cp3tmmnd92RA1UY63nbJr+EiOQh8XlMAYpYtbLToQ57HXeNyfbRRknwwcoPYE09r6obIxLzy3m0dwCy4uSmQg5OZQEKye1VjFIQADfJ8fVJvlL1X+Ko56vexoak/pU/+F4+aa ey", "h": "https://drive.google.com/file/d/1sGCeoZoJk6J_aqMT75s4i3Eiu37e0zNW/view", "k": "page", "x": ""}, {"l": "Binomial Distribution Day 2", "h": "https://drive.google.com/file/d/1S32yLilsjOKrgDqL7mF06-I7xVYx1bAn/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=aQiX36yXvBg", "k": "video", "x": ""}, {"l": "Pascal's triangle exploration", "h": "https://www.youtube.com/watch?v=s19dWIHficY", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 2.10", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=23", "k": "brain", "x": ""}, {"l": "Practice Library 2.B.2", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=2-b&question=b11", "k": "brain", "x": ""}]}}, {"id": "L8", "n": 8, "ln": 3, "code": "2.B.3", "part": "2B", "partTitle": "Random Variables and Probability Distributions", "title": "The Empirical Rule & Standard Normal Curve", "summary": "Continuous random variables use areas under a curve, and the Empirical Rule and the standard normal curve describe the normal distribution. You model data with a normal curve and use z-scores. The activity models IQ with a bell curve, then questions whether the tests measure intelligence.", "standards": [{"code": "CED 2.11", "text": "The normal distribution (parts A to D)", "ek": [{"code": "2.11.A", "text": "Describe a normal distribution. [Skill 4.C]", "eks": [{"code": "2.11.A.1", "text": "A continuous random variable is a variable that can take on any value within a specified domain. Every interval within the domain has a probability associated with it."}, {"code": "2.11.A.2", "text": "Many continuous random variables are well- modeled by a normal distribution."}, {"code": "2.11.A.3", "text": "A normal distribution can be described as a continuous, unimodal, bell-shaped, and symmetric curve."}, {"code": "2.11.A.4", "text": "A normal curve can be used to model a distribution of data and a continuous random variable."}, {"code": "2.11. ext": "Compare measures of relative position for distributions. [Skill 4.C]", "eks": [{"code": "2.11.F.1", "text": "Percentiles and proportions may be used to compare relative positions of individual values within a normal distribution or between normal distributions."}]}]}], "skills": ["Compute normal probabilities and percentiles with z-scores and the calculator.", "Sketch and label the normal curve."], "understandings": ["The normal model uses z-scores to compare unlike scales.", "Area under the curve is probability."], "misconceptions": ["Omitting the sketch or shading.", "Mixing up the inputs of normalcdf and invNorm."], "processes": ["Sketch and shade, standardize or use normalcdf, then answer in context."], "exam": ["Label the sketch, name the distribution with mean and standard deviation, then answer."], "qr": "https://broth11.github.io/ap-stats/unit-2.html#L8", "files": {"F": [{"l": "2.B.3.APStats.Handout", "h": "https://drive.google.com/file/d/1MJZT1Aydw92rDV7olax5vskiK5wbpnQ0/view", "k": "page", "x": ""}, {"l": "2.B.3.APStats.Handout.Key", "h": "https://drive.google.com/file/d/1wacQAvbv-p6pJySS_UGB8Bzd6gqYjOj7/view", "k": "page", "x": ""}, {"l": "2.B.3.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1r-O39UPsGIoE27zabEXGpbrgxBMcIUUj/view", "k": "page", "x": ""}, {"l": "2.B.3.APStats.MasteryChecks.Key", "h": "https://drive.google.com/file/d/1buDW_i8OCUgfsjd9YaPJR04SLUGE6Eej/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=XpY0dAVAr0A", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 2.11", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=24", "k": "brain", "x": ""}, {"l": "Stats Hub 2.11", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=25", "k": "brain", "x": ""}, {"l": "Practice Library 2.B.3", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=2-b&question=b21", "k": "brain", "x": ""}]}}, {"id": "L9", "n": 9, "ln": 4, "code": "2.B.4", "part": "2B", "partTitle": "Random Variables and Probability Distributions", "title": "Normal Calculations", "summary": "You find normal areas with the calculator, and you work backward from an area to find a value. You use both to answer questions in context. The activity looks at the Marlins Miracle and asks what role the pitcher played.", "standards": [{"code": "CED 2.11", "text": "The normal distribution (parts E and F)", "ek": [{"code": "2.11.A", "text": "Describe a normal distribution. [Skill 4.C]", "eks": [{"code": "2.11.A.1", "text": "A continuous random variable is a variable that can take on any value within a specified domain. Every interval within the domain has a probability associated with it."}, {"code": "2.11.A.2", "text": "Many continuous random variables are well- modeled by a normal distribution."}, {"code": "2.11.A.3", "text": "A normal distribution can be described as a continuous, unimodal, bell-shaped, and symmetric curve."}, {"code": "2.11.A.4", "text": "A normal curve can be used to model a distribution of data and a continuous random variable."}, {"code": "2.11.A.5", "text": "", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAXUAAACtCAAAAABqjLDiAAAd6ElEQVR42u2deXwV5bnHfyc55yQkIRAhCCQKQtiiUmWR1agsoQHCJhCqbIqAVVsBAVtAbFBQNnHBAo1VUAqETTYDhASakEAggfaWz6XcWmur1/Z6aze3K9jwu3/MzDvvO8vJdoIE5/l8+JBZ3nmfeSBz5sx3fr/HR3hxxSPCK4FXda/qXtRb+AHglL7QC6d61fmIZ7pLC6GPF4bZRJT3bEhlJ3nY+HliIcpY10hYKi1gH9MzpOX94qf0DDrMVliibapR7CTJmFV1zjwzg1co/ADSCTy4928AjtbDP+uD0s8L3xzutNqM7Nb93Da5x/iXH22IVxgA8ZHGmt3RQwEABX+76Q6xW9mfOnQDAOTGZ+irSvoDKPp4PFDwr3sB4MSHUaPkQxf+7/cAIAsAKt6NGgPgS4rBWdoP22OHyWO+vmSMQNFfku60TK6HJQfgC20p/7N7AQCn3282yJ75bt9ofVVxmiVz7KzMUqqyK3qYpU7FadLCvktj636FIcnHE0myECuatwrcRPJkhza940foF4ORY2ISsYTkmIh2cdfvJ7NbLYpMZvqIjKaxicd6Nmvc9CTZt0nv5KbHzStMt2CnuGnYx8wMcmRstw5ROUwDAH1wZgYLsTA+pVHyCRLrSY4dwAgAvbTf9FujUvzdlMn1UHMg8wBgDmNm39yscdx+kukJfVp1sWb+VDApMXoZWYgVTWDJfGZUj9TIteYV5slg+8Rm+82sCrGiCc60vJckWzzMN5t0vb3R4jpdYaxVb3OcbPwjsv29JJtla7n7Hicf tion, approximately 68% of observations are within 1 standard deviation of the mean, approximately 95% of observations are within 2 standard deviations of the mean, and approximately 99.7% of observations are within 3 standard deviations of the mean. This is called the empirical rule, or the 68–95–99.7 rule."}]}, {"code": "2.11.D", "text": "Calculate the probability that a particular value lies within a given interval of a normal distribution. [Skill 3.C]", "eks": [{"code": "2.11.D.1", "text": "If the distribution of a random variable is approximately normal, the probability that the random variable takes on values within a particular interval of the random variable is determined by the area under the normal curve within that interval. The total probability or area under the normal curve is 1."}]}, {"code": "2.11.E", "text": "Calculate the associated intervals and areas of a normal distribution. [Skill 3.C]", "eks": [{"code": "2.11.E.1", "text": "The boundaries of an interval associated with a given area in a normal distribution can be determined using technology or using z-scores and a standard normal table."}, {"code": "2.11.E.2", "text": "", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAmAAAALCCAAAAABc1DDpAACAX0lEQVR42u1dd1gVR989lHtBQBApiqBGBQvW2MCGBUWxa1SIDUvQRBN7S2xBg70lsdfYxV6xAYqCooBvEr8kvklMM3lNT0xiYgme74/t916aQjTJnOfxYe/Mb2Znd4+7s7NnztgRAo8Ldv+Ck28vLrOAIJiAIJiAQB4Eyy5suUsPvcdLxVbzoxaWkClIUfQEG99On3Y0/2Lpoececocp+pIp6dYBoUcsU9p3lCPb9yxM5Q+JVnMEK4oQjtZJU7d0LsYdtpkfpv2IK9esAEWGFDjSUPlD4rWGghXFRbCMz4PqA7/LL8+H7/WS09OaazGnvvdqr97qfglQL+iRXys10aelfO0ZCQBI/DVKisi67h0OYJKulvv3AACXP/VqCwBI/vZZG22M0iJx6bOg+nLyhRtO3dWYvS4doVSuYo9zF7nRvz4Dq1LnwnQh2mGNlf4k+La2PDSBhwFJcpwnGdGtp4sPZjFMSt3iUefpEjPIOL9pDgEXsYRkOral+weEeASTaUjlQc/KDUuGkCS5ziW4oak/tbRgn0Zly14g93h7VLSLIsnO5mquckmlFnsAIWSEZxO/GiRZ31zNbSgOk6T7RHIrVpITfNklUo6M6CQ1kSTZ1CM0oNR5aXuB2SegakRTpiF1ES6TnG8ix7qEVi21n3SZWNOrpNsRQ6lkLPCAFqI0iCQ94xnnN7tEOXQwHloxAPznQ0cwu9Hk807kKwEkM50WkweQxDj70DQyNITki2U5PIqk5zymIZX files": {"F": [{"l": "2.B.4.APStats.Handout", "h": "https://drive.google.com/file/d/1YHUbUf98IySOTvoYyC191TJXhNnuZzz4/view", "k": "page", "x": ""}, {"l": "2.B.4.APStats.Handout.Key", "h": "https://drive.google.com/file/d/1eiyVmUk29wVdyzAkx5gY4PoHtw59ENXX/view", "k": "page", "x": ""}, {"l": "2.B.4.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1DRti0YuIB1uMOgaX3BjrNbNs1sd8Zlwg/view", "k": "page", "x": ""}, {"l": "2.B.4.APStats.MasteryChecks.Key", "h": "https://drive.google.com/file/d/10AnbZWtZHQhrPOYVMv08X1X2_mJq0VxY/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=q0MSH8LolLk", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 2.11", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=24", "k": "brain", "x": ""}, {"l": "Stats Hub 2.11", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=25", "k": "brain", "x": ""}, {"l": "Practice Library 2.B.4", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=2-b&question=b31", "k": "brain", "x": ""}]}}, {"id": "L10", "n": 10, "ln": 5, "code": "2.B.5", "part": "2B", "partTitle": "Random Variables and Probability Distributions", "title": "Intro to Sampling Distributions", "summary": "A sampling distribution shows how a statistic varies from sample to sample, and the Central Limit Theorem tells you its likely shape. You simulate to describe a sampling distribution and make informal inferences. The activity tests whether the VA meets its wait time goals.", "standards": [{"code": "CED 2.12", "text": "Sampling distributions and the Central Limit Theorem", "ek": [{"code": "2.12.A", "text": "Describe sampling distributions with simulations. [Skill 4.C]", "eks": [{"code": "2.12.A.1", "text": "A sampling distribution of a statistic is the distribution of values of the statistic for all possible samples of a given size from a given population."}, {"code": "2.12.A.2", "text": "The sampling distribution of a statistic can be simulated by repeatedly generating a large number of random samples from the population assuming known value(s) for the parameter(s). The value of the statistic is determined and recorded for each sample. The resulting distribution of the sample statistic values approximates the sampling distribution of the statistic."}, {"code": "2.12.A.3", "text": "A randomization distribution is the distribution of a statistic generated by simulation from repeatedly randomly reallocating, or reassigning, the response values to treatment groups. The value of the statistic is determined and recorded for each reallocation, or reassignment. The resulting distribution of the statistic values approximates the sampling distribution of the statistic."}, {"code": "2.12.A.4", "text": "The central limit theorem (CLT) states that the sampling distribution of a mean of a random sample has a shape that can be approximated by a normal distribution. The larger the sample is, the better the approximation will be."}]}]}], "skills": ["Describe a sampling distribution's shape, center and spread.", "Apply the Central Limit Theorem to a sample mean."], "understandings": ["A sampling distribution describes how a statistic varies across samples.", "Larger samples give less variability, with spread shrinking by the square root of n."], "misconceptions": ["Confusing a sampling distribution with the distribution of one sample.", "Applying the CLT without a large sample or a normal population."], "processes": ["Name the statistic, give its center and spread, then check the shape condition."], "exam": ["State the shape condition (population normal or n at least 30) before using normal."], "qr": "https://broth11.github.io/ap-stats/unit-2.html#L10", "files": {"F": [{"l": "2.B.5.APStats.Handout", "h": "https://drive.google.com/file/d/1EluqJB-n0YJvpSgRjrKEGIF99-ydOjjF/view", "k": "page", "x": ""}, {"l": "2.B.5.APStats.Handout.Key", "h": "https://drive.google.com/file/d/19xqKS2rRL7SCmC_uGw9LKtO86SfYeX38/v        "code": "2.8.A",
       "text": "Construct a probability distribution for a discrete random variable. [Skill 3.A]",
       "eks": [
        {
         "code": "2.8.A.1",
         "text": "A random variable is a variable whose values have numerical outcomes that result from a random phenomenon."
        },
        {
         "code": "2.8.A.2",
         "text": "A probability distribution for a discrete random variable shows the probability associated with every possible value of the random variable. The sum of the probabilities over all possible values of a discrete random variable is 1."
        },
        {
         "code": "2.8.A.3",
         "text": "A discrete probability distribution can be determined using the rules of probability or estimated with a simulation."
        },
        {
         "code": "2.8.A.4",
         "text": "A discrete probability distribution can be represented as a graph, table, or function showing the probabilities associated with values of a random variable."
        },
        {
         "code": "2.8.A.5",
         "text": "A cumulative probability distribution can be represented as a table or function and shows the probability of being less than or equal to each value of the discrete random variable."
        }
       ]
      }

      {
       "code": "2.11.B",
       "text": "Calculate the mean and standard deviation for a normal distribution. [Skill 3.D]",
       "eks": [
        {
         "code": "2.11.B.1",
         "text": "A standard normal distribution is a normal distribution with mean μ = 0 and standard deviation σ = 1."
        }
       ]
      },
      {
       "code": "2.11.C",
       "text": "Calculate percentages from a normal distribution using the empirical rule. [Skill 3.C]",
       "eks": [
        {
         "code": "2.11.C.1",
         "text": "The empirical rule can be used to estimate the area of a region under the graph of the normal distribution curve. For a normal distribution, approximately 68% of observations are within 1 standard deviation of the mean, approximately 95% of observations are within 2 standard deviations of the mean, and approximately 99.7% of observations are within 3 standard deviations of the mean. This is called the empirical rule, or the 68–95–99.7 rule."
        }
       ]
      },
      {
       "code": "2.11.D",
       "text": "Calculate the probability that a particular value lies within a given interval of a normal distribution. [Skill 3.C]",
       "eks": [
        {
         "code": "2.11.D.1",
         "text": "If the distribution of a random variable is approximately normal, the probability that the random variable takes on values within a particular interval of the random variable is determined by the area under the normal curve within that interval. The total probability or area under the normal curve is 1."
        }
       ]
      },
      {
       "code": "2.11.E",
       "text": "Calculate the associated intervals and areas of a normal distribution. [Skill 3.C]",
       "eks": [

      {
       "code": "2.11.B",
       "text": "Calculate the mean and standard deviation for a normal distribution. [Skill 3.D]",
       "eks": [
        {
         "code": "2.11.B.1",
         "text": "A standard normal distribution is a normal distribution with mean μ = 0 and standard deviation σ = 1."
        }
       ]
      },
      {
       "code": "2.11.C",
       "text": "Calculate percentages from a normal distribution using the empirical rule. [Skill 3.C]",
       "eks": [
        {
         "code": "2.11.C.1",
         "text": "The empirical rule can be used to estimate the area of a region under the graph of the normal distribution curve. For a normal distribution, approximately 68% of observations are within 1 standard deviation of the mean, approximately 95% of observations are within 2 standard deviations of the mean, and approximately 99.7% of observations are within 3 standard deviations of the mean. This is called the empirical rule, or the 68–95–99.7 rule."
        }
       ]
      },
      {
       "code": "2.11.D",
       "text": "Calculate the probability that a particular value lies within a given interval of a normal distribution. [Skill 3.C]",
       "eks": [
        {
         "code": "2.11.D.1",
         "text": "If the distribution of a random variable is approximately normal, the probability that the random variable takes on values within a particular interval of the random variable is determined by the area under the normal curve within that interval. The total probability or area under the normal curve is 1."
        }
       ]
      },
      {
       "code": "2.11.E",
       "text": "Calculate the associated intervals and areas of a normal distribution. [Skill 3.C]",
       "eks": [

       "eks": [
        {
         "code": "2.12.A.1",
         "text": "A sampling distribution of a statistic is the distribution of values of the statistic for all possible samples of a given size from a given population."
        },
        {
         "code": "2.12.A.2",
         "text": "The sampling distribution of a statistic can be simulated by repeatedly generating a large number of random samples from the population assuming known value(s) for the parameter(s). The value of the statistic is determined and recorded for each sample. The resulting distribution of the sample statistic values approximates the sampling distribution of the statistic."
        },
        {
         "code": "2.12.A.3",
         "text": "A randomization distribution is the distribution of a statistic generated by simulation from repeatedly randomly reallocating, or reassigning, the response values to treatment groups. The value of the statistic is determined and recorded for each reallocation, or reassignment. The resulting distribution of the statistic values approximates the sampling distribution of the statistic."
        },
        {
         "code": "2.12.A.4",
         "text": "The central limit theorem (CLT) states that the sampling distribution of a mean of a random sample has a shape that can be approximated by a normal distribution. The larger the sample is, the better the approximation will be."
        }
       ]
      }
