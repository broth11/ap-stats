ariable."}, {"code": "2.1.A.3", "text": "Graphical representations of two categorical variables can be used to compare the relationship of one categorical variable across the levels of the other categorical variable and determine whether the two variables are associated."}]}, {"code": "2.1.B", "text": "Justify a claim using tabular and graphical representations for the distributions of two categorical variables. [Skill 4.B]", "eks": [{"code": "2.1.B.1", "text": "Tabular and graphical representations for the distributions of two categorical variables may reveal information that can be used to justify claims about the variable in context."}]}]}, {"code": "CED 2.2", "text": "Summary statistics for two categorical variables", "ek": [{"code": "2.2.A", "text": "Calculate summary statistics from two-way tables. [Skill 3.B]", "eks": [{"code": "2.2.A.1", "text": "A joint relative frequency in a two-way table is a cell frequency divided by the total for the entire table."}, {"code": "2.2.A.2", "text": "A marginal relative frequency in a two-way table is a row total divided by the total for the entire table or a column total divided by the total for the entire table."}, {"code": "2.2.A.3", "text": "A conditional relative frequency is a relative frequency computed by restricting to a particular level, or category of interest. A conditional relative frequency can be a cell frequency in a row divided by the total for that row or it can be a cell frequency in a column divided by the total for that column."}]}, {"code": "2.2.B", "text": "Compare summary statistics for two categorical variables. [Skill 4.A]", "eks": [{"code": "2.2.B.1", "text": "Summary statistics for two categorical variables can be used to compare distributions for evidence of association between the two variables."}]}, {"code": "2.2.C", "text": "Justify a claim using summary statistics for two categorical variables. [Skill 4.B]", "eks": [{"code": "2.2.C.1", "text": "Summary statistics for two categorical variables may reveal information that can be used to justify claims about the variables in context."}]}]}], "skills": ["Build and read two-way tables with joint, marginal and conditional relative frequencies.", "Use segmented bar charts and mosaic plots to compare groups."], "understandings": ["Conditional relative frequencies, not counts, show whether variables are associated.", "Association means the conditional distribution changes between groups."], "misconceptions": ["Comparing counts in groups of different sizes.", "Conditioning on the wrong variable (row versus column)."], "processes": ["Compute relative frequencies conditional on the explanatory variable, then compare across groups."], "exam": ["State the comparison with percentages from the correct group, in context."], "qr": "https://broth11.github.io/ap-stats/unit-2.html#L1", "files": {"F": [{"l": "2.A.1.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1QgUZXpdqdlzaXH9mkm5_NGCyt5Q7VHoN/view", "k": "page", "x": ""}, {"l": "2.A.1.APStats.MasteryChecks.Key", "h": "https://drive.google.com/file/d/1AQ3BFpaE-46JbG3Z9uP2nSQxP_rs_NVi/view", "k": "page", "x": ""}, {"l": "2.A.1.vB.APStats.Handout", "h": "https://drive.google.com/file/d/1-NDqr55tZRpxU-O6kdM2TQUWE9ispMyu/view", "k": "page", "x": ""}, {"l": "2.A.1.vB.APStats.Handout.Key", "h": "https://drive.google.com/file/d/1NFpgGitjJk-cY5srWxryd3EumL__IKzV/view", "k": "page", "x": ""}], "V": [], "K": [{"l": "Stats Hub 2.1", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=14", "k": "brain", "x": ""}, {"l": "Stats Hub 2.2", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=15", "k": "brain", "x": ""}, {"l": "Practice Library 2.A.1", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=2-a&question=q01", "k": "brain", "x": ""}]}}, {"id": "L2", "n": 2, "ln": 2, "code": "2.A.2", "part": "2A", "partTitle": "Categorical Data and Probability", "title": "Defining Probability", "summary": "Simulation estimates probabilities, the law of large numbers says long-run results settle down, and complements give a quick way to find a probability. You simulate and calculate probabilities of equally likely outcomes. The activity asks whether the home run derby is cursed.", "standards": [{"code": "CED 2.3", "text": "Estimating probabilities using simulation", "ek": [{"code": "2.3.A", "text": "Estimate probabilities using simulations. [Skill 3.C]", "eks": [{"code": "2.3.A.1", "text": "A random process generates results that are determined by chance."}, {"code": "2.3.A.2", "text": "An outcome is the result of one trial of a random process."}, {"code": "2.3.A.3", "text": "An event is a collection of outcomes."}, {"code": "2.3.A.4", "text": "Simulation is a way to model random events such that simulated outcomes closely match real-world outcomes. All possible outcomes are associated with a value to be determined by chance. Record the counts of simulated outcomes and the count total."}, {"code": "2.3.A.5", "text": "The probability of an outcome or event is its long-run relative frequency—that is, its relative frequency over a large number of trials."}, {"code": "2.3.A.6", "text": "The relative frequency of an outcome or event determined from empirical data can be used to estimate the actual, or true, probability of that outcome or event."}, {"code": "2.3.A.7", "text": "The law of large numbers states that for independent trials, as the number of trials increases, the long-run relative frequency of the outcome or event gets closer and closer to a single value."}]}]}, {"code": "CED 2.4", "text": "Introduction to probability", "ek": [{"code": "2.4.A", "text": "Calculate probabilities for events and their complements. [Skill 3.C]", "eks": [{"code": "2.4.A.1", "text": "The sample space of a random process is the set of all possible nonoverlapping outcomes. The probability of the sample space is 1."}, {"code": "2.4.A.2", "text": "", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA1sAAADmCAAAAA : "https://broth11.github.io/practice-library/#course=ap-statistics&unit=2-a&question=q21", "k": "brain", "x": ""}]}}, {"id": "L6", "n": 6, "ln": 1, "code": "2.B.1", "part": "2B", "partTitle": "Random Variables and Probability Distributions", "title": "Discrete Random Variables", "summary": "A probability distribution lists every value of a random variable with its probability. You calculate expected value for the long-run average and variance and standard deviation for risk. The activity simulates a roulette game and shows why it is a losing game over time.", "standards": [{"code": "CED 2.8", "text": "Introduction to random variables and probability distributions", "ek": [{"code": "2.8.A", "text": "Construct a probability distribution for a discrete random variable. [Skill 3.A]", "eks": [{"code": "2.8.A.1", "text": "A random variable is a variable whose values have numerical outcomes that result from a random phenomenon."}, {"code": "2.8.A.2", "text": "A probability distribution for a discrete random variable shows the probability associated with every possible value of the random variable. The sum of the probabilities over all possible values of a discrete random variable is 1."}, {"code": "2.8.A.3", "text": "A discrete probability distribution can be determined using the rules of probability or estimated with a simulation."}, {"code": "2.8.A.4", "text": "A discrete probability distribution can be represented as a graph, table, or function showing the probabilities associated with values of a random variable."}, {"code": "2.8.A.5", "text": "A cumulative probability distribution can be represented as a table or function and shows the probability of being less than or equal to each value of the discrete random variable."}]}]}, {"code": "CED 2.9", "text": "Parameters of random variables", "ek": [{"code": "2.9.A", "text": "Calculate the mean and standard deviation for a discrete random variable. [Skill 3.B]", "eks": [{"code": "2.9.A.1", "text": "A numerical value meas ode": "2.11.D", "text": "Calculate the probability that a particular value lies within a given interval of a normal distribution. [Skill 3.C]", "eks": [{"code": "2.11.D.1", "text": "If the distribution of a random variable is approximately normal, the probability that the random variable takes on values within a particular interval of the random variable is determined by the area under the normal curve within that interval. The total probability or area under the normal curve is 1."}]}, {"code": "2.11.E", "text": "Calculate the associated intervals and areas of a normal distribution. [Skill 3.C]", "eks": [{"code": "2.11.E.1", "text": "The boundaries of an interval associated with a given area in a normal distribution can be determined using technology or using z-scores and a standard normal table."}, {"code": "2.11.E.2", "text": "", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA1sAAAPBCAAAAAAtqu/8AADBm0lEQVR42uydd2AVxfbHP7khFZJA6BB6b9KkSZESmnQBKSItKCAgRUGNiiJNQZAiRcAHSO+99xI6+J7vic9nw4qCqIAKtpzfH7v33t1796ZA8CdwPv9kdmfmzJm5e7K7s7PfDRKUu5wgPQZuCS4dAkXR2FIUjS1F0djSIVAUjS1FuQ1jK+nmTSVlrGfpMHfyaICMM0k36l/SmVs35kl62N1NsbWgTsebtbSqTr+MdKxfncVpLvtg/QAZ3et4033qrEtH83W637IhX5yxA6XcdteErYJP/L86FhIafPMOhYUCrwS/nv7mQ8NuWc+CQ0P0uLsbyBQo48/k/98nitOnZ4BDpwGSk5PT3/yvt65nXbroYXd3xtbOS3F1fXatT37QcrhW9cndcSmqlXV76w/RrQLk7z8f9qB/EtZkauNJH/gmV4OUzPs4lPRFtqbp6O6G651SNL7G1S5g3W1X4moHGqZ9FzK1T8FLp+w0eKPc3oiIiMyng8hC1zNL8wA1Raa5wOVyiYg0DwIaiIiUc0lLkPaukSIistpVX6RXKBCaKCIr6SsiQ8IBVy9x482XObkB6vgk5UhNgHij+Jv5gGxTRGSoa4m1uqNDcrgCkHdlXKhR+xXX4yIiBbIdFZGJrhFSwyWnXUEEuVxLJIE1z4YBCU6+GbQEQkf2cO0UcVWUSa5Gxu7MMSIyKAIosU1sw2QyMRagtYiIq+7B8hS1e2nJNsbtcZHHXBufC0/Zm78MRLmF4zqfDiLzqRLSc96scjwhBxJL0jcxUUQKh489cuyVsJIiUpoqMZ37yVpKiojIg8yTgTy07fjSEmwxY2sErTYcWd+Il0zzlvwNlFt0eNfjNLYl5UiWzM9vWdubvCIiUyg0bcvrOVkiMphF1uqODkksCeuXPBQabsbWCcqLyGZ4WURasUOqIpLYmGaJiSckgUpZhy8aH8sKf98MKlH7ra0vR8eyQ4RyIhEuERGZRC+RtvTeKwsLhJ+0DZPBcqquOL6lCc+KCEWyFu093ualNVvc/4QSqJaKNxpbd1Zs8ZaISFAREWnOMRGRQcwWERnGVJHSlBURkSLsE n, and approximately 99.7% of observations are within 3 standard deviations of the mean. This is called the empirical rule, or the 68–95–99.7 rule."}]}, {"code": "2.11.D", "text": "Calculate the probability that a particular value lies within a given interval of a normal distribution. [Skill 3.C]", "eks": [{"code": "2.11.D.1", "text": "If the distribution of a random variable is approximately normal, the probability that the random variable takes on values within a particular interval of the random variable is determined by the area under the normal curve within that interval. The total probability or area under the normal curve is 1."}]}, {"code": "2.11.E", "text": "Calculate the associated intervals and areas of a normal distribution. [Skill 3.C]", "eks": [{"code": "2.11.E.1", "text": "The boundaries of an interval associated with a given area in a normal distribution can be determined using technology or using z-scores and a standard normal table."}, {"code": "2.11.E.2", "text": "", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA1sAAAPBCAAAAAAtqu/8AADBm0lEQVR42uydd2AVxfbHP7khFZJA6BB6b9KkSZESmnQBKSItKCAgRUGNiiJNQZAiRcAHSO+99xI6+J7vic9nw4qCqIAKtpzfH7v33t1796ZA8CdwPv9kdmfmzJm5e7K7s7PfDRKUu5wgPQZuCS4dAkXR2FIUjS1F0djSIVAUjS1FuQ1jK+nmTSVlrGfpMHfyaICMM0k36l/SmVs35kl62N1NsbWgTsebtbSqTr+MdKxfncVpLvtg/QAZ3et4033qrEtH83W637IhX5yxA6XcdteErYJP/L86FhIafPMOhYUCrwS/nv7mQ8NuWc+CQ0P0uLsbyBQo48/k/98nitOnZ4BDpwGSk5PT3/yvt65nXbroYXd3xtbOS3F1fXatT37QcrhW9cndcSmqlXV76w/RrQLk7z8f9qB/EtZkauNJH/gmV4OUzPs4lPRFtqbp6O6G651SNL7G1S5g3W1X4moHGqZ9FzK1T8FLp+w0eKPc3oiIiMyng8hC1zNL8wA1Raa5wOVyiYg0DwIaiIiUc0lLkPaukSIistpVX6RXKBCaKCIr6SsiQ8IBVy9x482XObkB6vgk5UhNgHij+Jv5gGxTRGSoa4m1uqNDcrgCkHdlXKhR+xXX4yIiBbIdFZGJrhFSwyWnXUEEuVxLJIE1z4YBCU6+GbQEQkf2cO0UcVWUSa5Gxu7MMSIyKAIosU1sw2QyMRagtYiIq+7B8hS1e2nJNsbtcZHHXBufC0/Zm78MRLmF4zqfDiLzqRLSc96scjwhBxJL0jcxUUQKh489cuyVsJIiUpoqMZ37yVpKiojIg8yTgTy07fjSEmwxY2sErTYcWd+Il0zzlvwNlFt0eNfjNLYl5UiWzM9vWdubvCIiUyg0bcvrOVkiMphF1uqODkksCeuXPBQabsbWCcqLyGZ4WURas l units and answer the question asked."], "qr": "https://broth11.github.io/ap-stats/unit-2.html#L9", "files": {"F": [{"l": "2.B.4.APStats.Handout", "h": "https://drive.google.com/file/d/1YHUbUf98IySOTvoYyC191TJXhNnuZzz4/view", "k": "page", "x": ""}, {"l": "2.B.4.APStats.Handout.Key", "h": "https://drive.google.com/file/d/1eiyVmUk29wVdyzAkx5gY4PoHtw59ENXX/view", "k": "page", "x": ""}, {"l": "2.B.4.APStats.MasteryChecks", "h": "https://drive.google.com/file/d/1DRti0YuIB1uMOgaX3BjrNbNs1sd8Zlwg/view", "k": "page", "x": ""}, {"l": "2.B.4.APStats.MasteryChecks.Key", "h": "https://drive.google.com/file/d/10AnbZWtZHQhrPOYVMv08X1X2_mJq0VxY/view", "k": "page", "x": ""}], "V": [{"l": "STS lesson video (YouTube)", "h": "https://www.youtube.com/watch?v=q0MSH8LolLk", "k": "video", "x": ""}], "K": [{"l": "Stats Hub 2.11", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=24", "k": "brain", "x": ""}, {"l": "Stats Hub 2.11", "h": "https://broth11.github.io/AP-Statistics-Hub/lesson.html?v=25", "k": "brain", "x": ""}, {"l": "Practice Library 2.B.4", "h": "https://broth11.github.io/practice-library/#course=ap-statistics&unit=2-b&question=b31", "k": "brain", "x": ""}]}}, {"id": "L10", "n": 10, "ln": 5, "code": "2.B.5", "part": "2B", "partTitle": "Random Variables and Probability Distributions", "title": "Intro to Sampling Distributions", "summary": "A sampling distribution shows how a statistic varies from sample to sample, and the Central Limit Theorem tells you its likely shape. You simulate to describe a sampling distribution and make informal inferences. The activity tests whether the VA meets its wait time goals.", "standards": [{"code": "CED 2.12", "text": "Sampling distributions and the Central Limit Theorem", "ek": [{"code": "2.12.A", "text": "Describe sampling distributions with simulations. [Skill 4.C]", "eks": [{"code": "2.12.A.1", "text": "A sampling distribution of a statistic is the distribution of values of the statistic for all possible samples of a given size from a given population."}, {"code": "2.12.A.2", "text": "The sampling distribution of a statistic can be simulated by repeatedly generating a large number of random samples from the population assuming known value(s) for the parameter(s). The value of the statistic is determined and recorded for each sample. The resulting distribution of the sample statistic values approximates the sampling distribution of the statistic."}, {"code": "2.12.A.3", "text": "A randomization distribution is the distribution of a statistic generated by simulation from repeatedly randomly reallocating, or reassigning, the response values to treatment groups. The value of the statistic is determined and recorded for each reallocation, or reassignment. The resulting distribution of the statistic values approximates the sampling distribution of the statistic."}, {"code": "2.12.A.4", "text": "The central limit theorem (CLT) states that the sampling distribution of a mean of a random sample has a shape that can be approximated by a normal distribution. The larger the sample is, the better the approximation will be."}]}]}], "skills": ["Describe a sampling distribution's shape, center and spread.", "Apply the Central Limit Theorem to a sample mean."], "understandings": ["A sampling distribution describes how a statistic varies across samples.", "Larger samples give less variability, with spread shrinking by the square root of n."], "misconceptions": ["Confusing a sampling distribution with the distribution of one sample.", "Applying the CLT without a large sample or a normal population."], "processes": ["Name the statistic, give its center and spread, then check the shape condition."], "exam": ["State the shape condition (population normal or n at least 30) before using normal."], "qr": "https://broth11.github.io/ap-stats/unit-2.html#L10", "files": {"F": [{"l": "2.B.5.APStats.Handout", "h": "https://drive.google.com/file/d/1EluqJB-n0YJvpSgRjrKEGIF99-ydOjjF/view", "k": "page", "x": ""}, {"l":          "text": "A probability distribution for a discrete random variable shows the probability associated with every possible value of the random variable. The sum of the probabilities over all possible values of a discrete random variable is 1."
        },
        {
         "code": "2.8.A.3",
         "text": "A discrete probability distribution can be determined using the rules of probability or estimated with a simulation."
        },
        {
         "code": "2.8.A.4",
         "text": "A discrete probability distribution can be represented as a graph, table, or function showing the probabilities associated with values of a random variable."
        },
        {
         "code": "2.8.A.5",
         "text": "A cumulative probability distribution can be represented as a table or function and shows the probability of being less than or equal to each value of the discrete random variable."
        }
       ]
      }
     ]

      {
       "code": "2.11.B",
       "text": "Calculate the mean and standard deviation for a normal distribution. [Skill 3.D]",
       "eks": [
        {
         "code": "2.11.B.1",
         "text": "A standard normal distribution is a normal distribution with mean μ = 0 and standard deviation σ = 1."
        }
       ]
      },
      {
       "code": "2.11.C",
       "text": "Calculate percentages from a normal distribution using the empirical rule. [Skill 3.C]",
       "eks": [
        {
         "code": "2.11.C.1",
         "text": "The empirical rule can be used to estimate the area of a region under the graph of the normal distribution curve. For a normal distribution, approximately 68% of observations are within 1 standard deviation of the mean, approximately 95% of observations are within 2 standard deviations of the mean, and approximately 99.7% of observations are within 3 standard deviations of the mean. This is called the empirical rule, or the 68–95–99.7 rule."
        }
       ]
      },
      {
       "code": "2.11.D",
       "text": "Calculate the probability that a particular value lies within a given interval of a normal distribution. [Skill 3.C]",
       "eks": [
        {
         "code": "2.11.D.1",
         "text": "If the distribution of a random variable is approximately normal, the probability that the random variable takes on values within a particular interval of the random variable is determined by the area under the normal curve within that interval. The total probability or area under the normal curve is 1."
        }
       ]
      },
      {
       "code": "2.11.E",
       "text": "Calculate the associated intervals and areas of a normal distribution. [Skill 3.C]",
       "eks": [
        {
         "code": "2.11.E.1",
         "text": "The boundaries of an interval associated with a given area in a normal distribution can be determined using technology or using z-scores and a standard normal table."
        },
        {

      {
       "code": "2.11.B",
       "text": "Calculate the mean and standard deviation for a normal distribution. [Skill 3.D]",
       "eks": [
        {
         "code": "2.11.B.1",
         "text": "A standard normal distribution is a normal distribution with mean μ = 0 and standard deviation σ = 1."
        }
       ]
      },
      {
       "code": "2.11.C",
       "text": "Calculate percentages from a normal distribution using the empirical rule. [Skill 3.C]",
       "eks": [
        {
         "code": "2.11.C.1",
         "text": "The empirical rule can be used to estimate the area of a region under the graph of the normal distribution curve. For a normal distribution, approximately 68% of observations are within 1 standard deviation of the mean, approximately 95% of observations are within 2 standard deviations of the mean, and approximately 99.7% of observations are within 3 standard deviations of the mean. This is called the empirical rule, or the 68–95–99.7 rule."
        }
       ]
      },
      {
       "code": "2.11.D",
       "text": "Calculate the probability that a particular value lies within a given interval of a normal distribution. [Skill 3.C]",
       "eks": [
        {
         "code": "2.11.D.1",
         "text": "If the distribution of a random variable is approximately normal, the probability that the random variable takes on values within a particular interval of the random variable is determined by the area under the normal curve within that interval. The total probability or area under the normal curve is 1."
        }
       ]
      },
      {
       "code": "2.11.E",
       "text": "Calculate the associated intervals and areas of a normal distribution. [Skill 3.C]",
       "eks": [
        {
         "code": "2.11.E.1",
         "text": "The boundaries of an interval associated with a given area in a normal distribution can be determined using technology or using z-scores and a standard normal table."
        },
        {

       "text": "Describe sampling distributions with simulations. [Skill 4.C]",
       "eks": [
        {
         "code": "2.12.A.1",
         "text": "A sampling distribution of a statistic is the distribution of values of the statistic for all possible samples of a given size from a given population."
        },
        {
         "code": "2.12.A.2",
         "text": "The sampling distribution of a statistic can be simulated by repeatedly generating a large number of random samples from the population assuming known value(s) for the parameter(s). The value of the statistic is determined and recorded for each sample. The resulting distribution of the sample statistic values approximates the sampling distribution of the statistic."
        },
        {
         "code": "2.12.A.3",
         "text": "A randomization distribution is the distribution of a statistic generated by simulation from repeatedly randomly reallocating, or reassigning, the response values to treatment groups. The value of the statistic is determined and recorded for each reallocation, or reassignment. The resulting distribution of the statistic values approximates the sampling distribution of the statistic."
        },
        {
         "code": "2.12.A.4",
         "text": "The central limit theorem (CLT) states that the sampling distribution of a mean of a random sample has a shape that can be approximated by a normal distribution. The larger the sample is, the better the approximation will be."
        }
       ]
      }
     ]
    }
